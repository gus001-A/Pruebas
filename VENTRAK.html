form=function(title,fields,vals,save,label){vals=vals||{};const edit=/^Editar/.test(title);

modal(title,edit?'Modifica los datos y guarda los cambios':'Completa la información',MI(title),body,`<button class="btn" onclick="closeM()">Cancelar</button><button class="btn p" id="fs">${label||'Guardar'}</button>`);
$('mc').oninput=e=>{const w=e.target.closest('.f');w&&w.classList.remove('err')};
$('fs').onclick=()=>{const d={};document.querySelectorAll('#mc [data-k]').forEach(e=>{d[e.dataset.k]=e.classList.contains('chk')?[...e.querySelectorAll('input:checked')].map(i=>i.value):e.value.trim()});let bad=null;
fields.forEach(f=>{const w=document.querySelector(`#mc [data-f="${f.k}"]`),miss=f.r&&(!d[f.k]||!d[f.k].length);w.classList.toggle('err',!!miss);if(miss&&!bad)bad=w});
if(bad){const x=bad.querySelector('input,select,textarea');x&&x.focus();return}save(d);closeM();render()}};
function confirmM(title,msg,ok,fn,back){modal(title,'','alert',`<p style="margin:14px 0 4px">${msg}</p>`,`<button class="btn" id="ccn">Cancelar</button><button class="btn dg" id="cok">${ok}</button>`,true);$('ccn').onclick=back||closeM;$('cok').onclick=()=>{closeM();fn()}}
docsM=function(key,title,ce){const l=docs[key]=docs[key]||[];
const list=l.length?l.map((d,i)=>`<div class="dl"><span class="ft">${ic('file',20)}</span><div><b>${esc(d.t)}</b><small>${esc(d.d||'Sin descripción')} · ${esc(d.f)}</small></div>${ce?`<button class="mx" aria-label="Quitar" onclick="delDoc('${key}',${i},'${title}')">${ic('trash',17)}</button>`:''}</div>`).join(''):`<div class="empty">${ic('file',28)}<br>Aún no hay documentos guardados</div>`;
const add=ce?`<div class="dsec">Nuevo archivo</div><div class="fg"><div class="f h"><label class="fl">Tipo de documento</label><select id="dt">${cats['Tipos de documento'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="f h"><label class="fl">Descripción</label><input id="dd" placeholder="Ej. vigente 2026"></div><div class="f"><label class="fl">Archivo <span class="rq">*</span></label><input id="df" type="file"><div class="em">Elige un archivo</div></div></div>`:'';
modal('Documentos',esc(title)+' · '+l.length+(l.length===1?' archivo':' archivos'),'file',list+add,`<button class="btn" onclick="closeM()">Cerrar</button>${ce?`<button class="btn p" onclick="addDoc('${key}','${title}')">Agregar documento</button>`:''}`);
const df=$('df');if(df)df.oninput=()=>df.closest('.f').classList.remove('err')};
addDoc=function(key,title){const f=$('df').files[0];if(!f){$('df').closest('.f').classList.add('err');return}const t=$('dt').value;docs[key].push({t,d:$('dd').value.trim(),f:f.name});addLog('documentos','INSERT',t+' en '+title);docsM(key,title,true);toast('Documento agregado')};
delDoc=function(key,i,title){const d=docs[key][i];confirmM('¿Quitar documento?',`Se quitará <b>${esc(d.t)}</b> (${esc(d.f)}) de ${esc(title)}.`,'Quitar',()=>{docs[key].splice(i,1);addLog('documentos','DELETE',d.t+' de '+title);docsM(key,title,true)},()=>docsM(key,title,true))};
delCat=function(i){const x=cats[catTab][i];if(catTab==='Tipos de negocio'&&pros.some(p=>p.t===x))return toast('No se puede quitar: hay prospectos con este giro');confirmM('¿Quitar registro?',`Se quitará <b>${esc(x)}</b> de ${catTab.toLowerCase()}.`,'Quitar',()=>{cats[catTab].splice(i,1);addLog('catálogos','DELETE',catTab+': '+x);render()})};
document.body.insertAdjacentHTML('beforeend','<div id="scrim"></div>');$('scrim').onclick=()=>$('dr').classList.remove('open');
new MutationObserver(()=>$('scrim').classList.toggle('on',$('dr').classList.contains('open'))).observe($('dr'),{attributes:true,attributeFilter:['class']});
function setNH(){document.documentElement.style.setProperty('--nh',document.querySelector('aside').offsetHeight+'px')}addEventListener('resize',setNH);
const _render2=render;render=function(){_render2();setNH()};
let dashBr='Todas';const SC={Programada:'#6C7BC4',Proceso:'#F0A202',Realizada:'#1B8A55',Revisada:'#0B8FA0',Supervisada:'#7A55B8'};
function dashSet(b){dashBr=b;render()}function goDay(d){calSel=d;calMode='Semana';calWk='2026-10-12';go('Agenda')}function goList(st){filt=st;go('Visitas')}
const ch=(t,i,a)=>`<div class="ch"><h3>${ic(i,18)}${t}</h3>${a||''}</div>`,ini=n=>{const w=n.split(' ');return w.length>1?w.map(x=>x[0]).slice(0,2).join(''):n.slice(0,2)},who=v=>first(users.find(u=>u.id===v.u).n);
V.Panel=()=>{if(dashBr!=='Todas'&&!me.s.includes(dashBr))dashBr='Todas';
const P=me.p==='Prospecto',all=myVisits(),vs=all.filter(v=>dashBr==='Todas'||v.s===dashBr),sub='Lunes 12 de octubre · '+(me.s.length>1?'todas tus sucursales':'sucursal '+me.s[0]);

const hd=head('Hola, '+me.n.split(' ')[0],sub,btn);
if(P){const pr=[...new Set(all.map(v=>v.u))].map(i=>users.find(u=>u.id===i));return hd+`<div class="grid g12"><div class="card s8">${ch('Tus visitas','pin')}${all.map(v=>`<div class="row2 dv" onclick="openV(${v.id})"><span><b>${fd(v.d)}</b><br><span class="mut">${v.s} · ${who(v)}</span></span>${stag(v)}</div>`).join('')||'<div class="empty">Aún no tienes visitas programadas</div>'}</div><div class="card s4">${ch('Tu promotor','user')}${pr.map(u=>`<div class="pr"><span class="av">${ini(u.n)}</span><div><b>${esc(u.n)}</b><br><span class="mut">Promotor asignado</span></div></div>`).join('')||'<p class="mut">Sin promotor asignado</p>'}<div class="ced"><button class="btn p" onclick="go('Mensajes')">Escribir mensaje</button></div></div></div>`}
const n=s=>vs.filter(v=>v.st===s).length,pos=vs.filter(v=>v.res==='Positiva').length,neg=vs.filter(v=>v.res==='Negativa').length,cl=pos+neg,pend=vs.filter(v=>v.st==='Realizada'),today=vs.filter(v=>v.d===TODAY),late=vs.filter(v=>v.st==='Programada'&&v.d<TODAY),pct=cl?Math.round(pos/cl*100):0;
const chips=me.s.length>1?`<div class="chips">${['Todas',...me.s].map(b=>`<button class="chip ${b===dashBr?'on':''}" onclick="dashSet('${b}')">${b==='Todas'?'Todas las sucursales':b}</button>`).join('')}</div>`:'';
const K=(i,v,l,s)=>`<div class="card kpi"><i class="ki">${ic(i)}</i><b>${v}</b><span>${l}</span><small>${s}</small></div>`;
const kp=`<div class="grid k4">${K('cal',today.length,'Visitas de hoy',today.filter(v=>v.st==='Programada').length+' por iniciar')}${K('play',n('Proceso'),'En proceso','en campo ahora')}${K('trend',pct+'%','Efectividad',cl?pos+' positivas de '+cl+' cerradas':'Sin cierres aún')}${K('check',pend.length,'Por revisar','esperan auditoría')}</div>`;
const hoy=`<div class="card s7">${ch('Visitas de hoy','pin',`<button class="btn" onclick="go('Visitas')">Ver lista</button>`)}${today.map(v=>`<div class="row2 dv" onclick="openV(${v.id})"><span style="display:flex;align-items:center"><span class="dot" style="background:${SC[v.st]}"></span><span><b>${esc(v.p)}</b><br><span class="mut">${v.s} · ${who(v)}</span></span></span>${stag(v)}</div>`).join('')||`<div class="empty">${ic('check',26)}<br>No hay visitas para hoy</div>`}</div>`;
const al=late.map(v=>`<div class="alert" onclick="openV(${v.id})" style="cursor:pointer">${ic('alert',17)}<span><b>Visita vencida</b><br>${esc(v.p)} · era del ${fd(v.d)}</span></div>`);
vs.filter(v=>v.st==='Proceso'&&!v.geo).forEach(v=>al.push(`<div class="alert" onclick="openV(${v.id})" style="cursor:pointer">${ic('locate',17)}<span><b>Sin ubicación</b><br>${esc(v.p)} está en proceso</span></div>`));

const fun=`<div class="card s4">${ch('Visitas por estatus','list')}${S.map(s=>`<div class="fn" onclick="goList('${s}')"><div class="row2 mut"><span><i class="dot" style="background:${SC[s]}"></i>${lab(s)}</span><b>${n(s)}</b></div><div class="bar"><i style="width:${vs.length?n(s)/vs.length*100:0}%;background:${SC[s]}"></i></div></div>`).join('')}</div>`;
