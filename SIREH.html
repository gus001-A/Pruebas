<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --ink:#262330; --ink-soft:#656077;
    --paper:#EFF0EC; --card:#FFFFFF; --line:#DEE0DA;
    --graphite:#2A2740; --graphite2:#383552; --graphite-line:#484468;
    --steel:#8C4A54; --steel-dark:#6E3842; --steel-soft:#F1DFE1;
    --amber:#B2822E; --amber-soft:#F3E7D1; --amber-text:#6E5518;
    --danger:#A23E3E; --danger-soft:#F2DEDC;
    --success:#3F7A63; --success-soft:#DDEAE3;
    --radius:8px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'IBM Plex Sans',sans-serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; }
  .brand{ font-family:'Fraunces',serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:.01em; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  button, select, input, textarea{ font-family:'IBM Plex Sans',sans-serif; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11.5px; font-weight:500; color:var(--ink-soft); padding:12px 14px; background:#FAF9F6; border-bottom:2px solid var(--line); white-space:nowrap; }
  td{ font-size:13.5px; padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:nth-child(even){ background:#FBFBF9; }
  tr.row{ transition:background-color .12s ease; }
  tr.row.clickable{ cursor:pointer; }
  tr.row:hover{ background:#F2EEE8 !important; }
  tfoot td{ padding:7px 10px; border-top:2px solid var(--line); border-bottom:none; background:#FAF9F6; }
  .table-filter{ width:100%; border:1px solid var(--line); border-radius:5px; padding:6px 8px; font-size:12px; background:#fff; transition:border-color .12s ease, box-shadow .12s ease; }
  .table-filter:focus{ outline:none; border-color:var(--steel); box-shadow:0 0 0 3px var(--steel-soft); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 1px 2px rgba(38,35,48,.045); }
  .badge{ font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:20px; display:inline-block; line-height:1.4; white-space:nowrap; }
  .badge-neutral{ background:#EAE8E3; color:var(--ink-soft); }
  .badge-steel{ background:var(--steel-soft); color:var(--steel-dark); }
  .badge-amber{ background:var(--amber-soft); color:var(--amber-text); }
  .badge-danger{ background:var(--danger-soft); color:var(--danger); }
  .badge-success{ background:var(--success-soft); color:var(--success); }
  .btn{ border:none; border-radius:6px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:opacity .12s ease, transform .05s ease, background-color .12s ease; white-space:nowrap; }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--steel-dark); color:#fff; padding:9px 16px; }
  .btn-primary:hover{ background:#5A2D35; }
  .btn-ghost{ background:#fff; border:1px solid var(--line); padding:9px 16px; }
  .btn-ghost:hover{ background:#FAF9F6; }
  .btn-danger{ background:var(--danger); color:#fff; padding:9px 16px; }
  .btn-danger:hover{ background:#8A3232; }
  .btn-sm{ padding:6px 11px; font-size:12px; }
  .fadein{ animation:fadein .16s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }
  @keyframes toastin{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .icon{ width:15px; height:15px; display:inline-block; vertical-align:-3px; stroke:currentColor; fill:none; stroke-width:1.8; flex-shrink:0; }
  .icon-btn{ width:29px; height:29px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer; transition:background-color .12s ease, color .12s ease; flex-shrink:0; }
  .icon-btn:hover{ background:#EFEAE3; color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--danger-soft); color:var(--danger); }
  .readonly-banner{ display:flex; align-items:center; gap:8px; background:var(--amber-soft); color:var(--amber-text); font-size:12.5px; padding:9px 12px; border-radius:6px; margin-bottom:16px; }
  .info-banner{ display:flex; align-items:center; gap:8px; background:var(--steel-soft); color:var(--steel-dark); font-size:12.5px; padding:9px 12px; border-radius:6px; margin-bottom:16px; }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:0 1px 2px rgba(38,35,48,.045); }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,18,26,.5); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px; }
  .modal-box{ background:#fff; width:460px; max-width:92vw; border-radius:12px; padding:26px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px rgba(20,18,26,.3); }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .field-label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:5px; font-weight:500; }
  .field-input{ width:100%; border:1px solid var(--line); border-radius:6px; padding:9px 10px; font-size:13px; margin-bottom:14px; transition:border-color .12s ease, box-shadow .12s ease; background:#fff; }
  .field-input:focus{ outline:none; border-color:var(--steel); box-shadow:0 0 0 3px var(--steel-soft); }
  .field-input:disabled{ background:#F3F1EC; color:var(--ink-soft); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .chip{ border:1px solid var(--line); border-radius:6px; padding:6px 12px; font-size:12.5px; cursor:pointer; transition:background-color .12s ease; }
  .chip:hover{ background:#FAF9F6; }
  .chip.active{ background:var(--steel-dark); color:#fff; border-color:var(--steel-dark); }
  .flowchip{ background:var(--steel-soft); color:var(--steel-dark); font-size:11.5px; font-weight:500; padding:6px 12px; border-radius:14px; white-space:nowrap; }
  .toast{ position:fixed; bottom:22px; right:22px; background:var(--graphite); color:#F1EFE9; font-size:13px; padding:12px 18px; border-radius:8px; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:toastin .18s ease; display:flex; align-items:center; gap:8px; }

  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{ width:254px; flex-shrink:0; background:var(--graphite); color:#D8D6DF; display:flex; flex-direction:column; border-right:2px solid var(--amber); position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:20px 20px 16px; flex-shrink:0; }
  .sidebar-nav{ padding:4px 12px 26px; }
  .sidebar-link{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; font-size:13.3px; color:#D8D6DF; cursor:pointer; user-select:none; margin-bottom:2px; transition:background-color .12s ease, color .12s ease; }
  .sidebar-link:hover{ background:var(--graphite2); color:#fff; }
  .sidebar-link.active{ color:#fff; background:var(--steel); }
  .sidebar-link.disabled{ color:#5C5870; cursor:not-allowed; }
  .sidebar-link.disabled:hover{ background:none; color:#5C5870; }
  .sidebar-group-label{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#8E8AA0; padding:16px 12px 6px; }
  .main-area{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ height:58px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:flex-end; gap:14px; padding:0 24px; position:sticky; top:0; z-index:45; }
  .main-content{ flex:1; background:var(--paper); }
</style>

function showToast(msg, icon){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = (icon?ICONS[icon]:ICONS.check2) + `<span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 2400);
}
function nextFolio(arr, prefix){
  const nums = arr.map(x=>{ const parts=x.folio.split('-'); return parseInt(parts[parts.length-1],10)||0; });
  const max = nums.length ? Math.max(...nums) : 0;
  return prefix+'-'+String(max+1).padStart(4,'0');
}

/* ============================== FECHAS, HORAS Y DÍAS ============================== */
const MES_ABBR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS_SEMANA = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function parseDiasRango(dias){
  const m = (dias||'').match(/^(\w{3})\s+a\s+(\w{3})$/i);
  if(m && DIAS_SEMANA.includes(m[1]) && DIAS_SEMANA.includes(m[2])) return { desde:m[1], hasta:m[2], libre:'' };
  return { desde:'Lun', hasta:'Vie', libre: dias||'' };
}
function parseHorarioRango(horario){
  const m = (horario||'').match(/^(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})$/);
  if(m) return { entrada:m[1], salida:m[2], libre:'' };
  return { entrada:'', salida:'', libre: horario||'' };
}
function isoToMX(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return '';
  return `${d} ${MES_ABBR[Number(m)-1]} ${y}`;
}
function mxToIso(mx){
  if(!mx) return '';
  const m = mx.match(/(\d{1,2})\s+([a-zA-Záéíóúñ]{3,})\.?\s+(\d{4})/i);
  if(!m) return '';
  const idx = MES_ABBR.findIndex(a=>m[2].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').startsWith(a));
  if(idx<0) return '';
  return `${m[3]}-${String(idx+1).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
}
function dateVal(id){ const el=document.getElementById(id); return el && el.value ? isoToMX(el.value) : ''; }
function dateField(id, label, currentMX, placeholder){
  return `<label class="field-label">${label}</label><input id="${id}" type="date" class="field-input" value="${mxToIso(currentMX)}" ${placeholder?`placeholder="${placeholder}"`:''}>`;
}

/* ============================== ARCHIVOS (subir / visualizar) ============================== */
const FILES = {};
function handleFileChange(id){
  const el = document.getElementById(id);
  const nameEl = document.getElementById(id+'-name');
  const viewEl = document.getElementById(id+'-view');
  if(el && el.files && el.files[0]){
    const file = el.files[0];
    const url = URL.createObjectURL(file);
    FILES[id] = { name:file.name, url, type:file.type };
    if(nameEl) nameEl.textContent = file.name;
    if(viewEl) viewEl.innerHTML = `<a href="${url}" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none;">${ICONS.eye}Ver</a>`;
    showToast('Archivo cargado: '+file.name,'upload');
  }
}
function fileField(id, label, existingName, existingUrl){
  return `<label class="field-label">${label}</label>
  <div class="card" style="padding:9px 11px;display:flex;align-items:center;gap:9px;margin-bottom:14px;">
    <input type="file" id="${id}" style="display:none" onchange="handleFileChange('${id}')">
    <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('${id}').click()">${ICONS.upload}Subir archivo</button>
    <span id="${id}-name" class="mono" style="font-size:12px;color:var(--ink-soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${existingName||'Ningún archivo seleccionado'}</span>
    <span id="${id}-view">${existingUrl?`<a href="${existingUrl}" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none;">${ICONS.eye}Ver</a>`:''}</span>
  </div>`;
}
function getFileData(id, fallbackName, fallbackUrl){
  if(FILES[id]) return FILES[id];
  if(fallbackName) return { name:fallbackName, url:fallbackUrl||null, type:'' };
  return { name:null, url:null, type:'' };
}

/* ============================== TABLA GENÉRICA CON FILTROS POR COLUMNA ============================== */
function renderTable(tableId, columns, rows){
  const filters = state.tableFilters[tableId] || {};
  const filtered = rows.filter(r => columns.every((c,i)=>{
    if(c.filterable===false) return true;
    const f = (filters[i]||'').toLowerCase();
    if(!f) return true;
    return String(r.cells[i].text||'').toLowerCase().includes(f);
  }));
  return `<div class="card">
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
      <tbody>
        ${filtered.length ? filtered.map(r=>`<tr class="row ${r.onclick?'clickable':''}" ${r.onclick?`onclick="${r.onclick}"`:''}>${r.cells.map(c=>`<td>${c.html}</td>`).join('')}</tr>`).join('')
          : `<tr><td colspan="${columns.length}" style="text-align:center;color:var(--ink-soft);padding:30px;font-size:13px;">Sin resultados con los filtros aplicados.</td></tr>`}
      </tbody>
      <tfoot><tr>${columns.map((c,i)=> c.filterable===false ? '<td></td>' :
        `<td><input id="tf-${tableId}-${i}" class="table-filter" placeholder="Filtrar…" value="${(filters[i]||'').replace(/"/g,'&quot;')}" oninput="setTableFilter('${tableId}',${i},this.value)"></td>`).join('')}</tr></tfoot>
    </table>
    </div>
  </div>`;
}
function setTableFilter(tableId, colIndex, value){
  if(!state.tableFilters[tableId]) state.tableFilters[tableId] = {};
  state.tableFilters[tableId][colIndex] = value;
  render();
  const input = document.getElementById(`tf-${tableId}-${colIndex}`);
  if(input){ input.focus(); input.setSelectionRange(value.length, value.length); }
}
function actionsCell(editFn, deleteFn){
  return `<div style="display:flex;gap:3px;">
    <span class="icon-btn" onclick="event.stopPropagation(); ${editFn}" title="Editar">${ICONS.edit}</span>
    <span class="icon-btn danger" onclick="event.stopPropagation(); ${deleteFn}" title="Eliminar">${ICONS.trash}</span>
  </div>`;
}

    <span style="font-size:11.5px;color:var(--ink-soft);"><span style="display:inline-block;width:8px;height:8px;background:var(--amber);border-radius:2px;margin-right:5px;"></span>Bajas</span>

  const total = distSucursal.reduce((a,d)=>a+d.value,0) || 1;
  let acc = 0;

  return `

    ${readOnlyBanner()}
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px;">
      ${stats.map(([label,v,icon,tone])=>`
        <div class="stat-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div style="font-size:12px;color:var(--ink-soft);">${label}</div>${icon}
          </div>
          <div class="mono" style="font-size:24px;margin-top:10px;color:${toneColor[tone]};">${v}</div>
        </div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
      ${kpis.map(([label,v,sub])=>`
        <div class="stat-card" style="background:var(--steel-soft);border-color:var(--steel-soft);">

          <div class="mono" style="font-size:21px;margin-top:8px;color:var(--steel-dark);">${v}</div>
          <div style="font-size:11px;color:var(--steel-dark);opacity:.8;margin-top:2px;">${sub}</div>
        </div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px;">
      <div class="card" style="padding:18px;">
        <div style="font-size:13.5px;font-weight:500;margin-bottom:4px;">Altas vs. bajas — últimos 6 meses</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Movimientos de personal por mes</div>
        ${barChart}
      </div>
      <div class="card" style="padding:18px;">
        <div style="font-size:13.5px;font-weight:500;margin-bottom:4px;">Colaboradores por sucursal</div>

      </div>
    </div>
    ${flujo}
  </div>`;
}

/* ============================== COLABORADORES ============================== */
function renderColaboradores(){
  const q = state.filtroCol.toLowerCase();
  const tipo = state.filtroTipo;
  const filtered = COLABORADORES.filter(c => (tipo==='Todos'||c.tipo===tipo) && (c.nombre.toLowerCase().includes(q)||c.folio.toLowerCase().includes(q)));
  const puedeEditar = ['Administrador de Recursos Humanos','Superadministrador'].includes(state.role);

  const columns = [
    {label:'Folio'}, {label:'Nombre'}, {label:'Tipo'}, {label:'Puesto'}, {label:'Sucursal'},
    {label:'Estado'}, {label:'Documentación'}, {label:'Ingreso'},
  ];
  if(puedeEditar) columns.push({label:'Acciones', filterable:false});
  const rows = filtered.map(c=>{
    const cells = [
      { text:c.folio, html:`<span class="mono">${c.folio}</span>` },
      { text:c.nombre, html:c.nombre },
      { text:c.tipo, html:badge(c.tipo, c.tipo==='Externo'?'steel':'neutral') },
      { text:c.puesto, html:c.puesto },
      { text:c.sucursal, html:`<span style="color:var(--ink-soft);">${c.sucursal}</span>` },
      { text:c.estado, html:badge(c.estado, toneEstadoColaborador(c.estado)) },
      { text:c.docEstado, html:badge(c.docEstado, toneDoc(c.docEstado)) },

            <span>${it}</span>

          </div>`).join('')}
          ${puedeEditar?`<div style="display:flex;gap:8px;margin-top:12px;">
            <input id="cat-input-${gi}" class="field-input" style="margin-bottom:0;" placeholder="Nuevo valor…" onkeydown="if(event.key==='Enter'){addCatalogItem(${gi});}">
            <button class="btn btn-ghost btn-sm" onclick="addCatalogItem(${gi})">${ICONS.plus}</button>
          </div>`:''}
        </div>`).join('')}
    </div>
  </div>`;
}
function addCatalogItem(gIdx){
  const input = document.getElementById('cat-input-'+gIdx);
  const v = input.value.trim();
  if(!v) return;
  CATALOGOS[gIdx].items.push(v);
  render();
  showToast('Valor agregado a «'+CATALOGOS[gIdx].nombre+'»','check2');
}
function deleteCatalogItem(gIdx, itemIdx){
  const nombre = CATALOGOS[gIdx].items[itemIdx];
  CATALOGOS[gIdx].items.splice(itemIdx,1);
  render();
  showToast('«'+nombre+'» eliminado del catálogo','trash');
}

/* ============================== FORMULARIOS DE ALTA / EDICIÓN ============================== */
function openForm(type, mode, key){ state.modalForm = { type, mode, key }; render(); }
function closeForm(){ state.modalForm = null; render(); }
function modalHead(title){
  return `<div class="modal-head"><div style="font-size:16px;font-weight:500;">${title}</div><span onclick="closeForm()" style="cursor:pointer;color:var(--ink-soft);">${ICONS.x}</span></div>`;
}
function selectChip(el){ el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); }

function renderFormModal(){
  switch(state.modalForm.type){
    case 'colaborador': return renderColaboradorForm();
    case 'sucursal': return renderSucursalForm();
    case 'area': return renderAreaForm();
    case 'puesto': return renderPuestoForm();
    case 'movimiento': return renderMovimientoForm();
    case 'contenido': return renderContenidoForm();
    case 'horario': return renderHorarioForm();
    case 'vacacion': return renderVacacionForm();
    case 'permiso': return renderPermisoForm();
    case 'curso': return renderCursoForm();
    case 'contrato': return renderContratoForm();
    case 'formato': return renderFormatoForm();
    case 'usuario': return renderUsuarioForm();
    case 'prestacion': return renderPrestacionForm();
    default: return '';
  }
}

/* ---- Colaborador ---- */
function renderColaboradorForm(){
  const editing = state.modalForm.mode==='edit';
  const r = editing ? COLABORADORES.find(c=>c.folio===state.modalForm.key) : {};
  const fv = (k,d='')=> r&&r[k]!==undefined ? r[k] : d;
  return `<div class="modal-backdrop" onclick="closeForm()">
    <div class="modal-box fadein" style="width:600px;" onclick="event.stopPropagation()">
      ${modalHead(editing?'Editar colaborador':'Nuevo colaborador')}
      <div class="form-grid">

/* ============================== CONFIRMACIÓN DE ELIMINACIÓN ============================== */
function askDelete(type, key, label){ state.confirmDelete = { type, key, label }; render(); }
function cancelDeleteModal(){ state.confirmDelete = null; render(); }
function renderConfirmDeleteModal(){
  const { label } = state.confirmDelete;
  return `<div class="modal-backdrop" onclick="cancelDeleteModal()">
    <div class="modal-box fadein" style="width:380px;text-align:center;" onclick="event.stopPropagation()">
      <div style="width:44px;height:44px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">${ICONS.trash}</div>
      <div style="font-size:15px;font-weight:500;margin-bottom:6px;">¿Eliminar «${label}»?</div>
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 20px;">Esta acción es permanente dentro de esta sesión de demostración y no se puede deshacer.</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" style="flex:1;justify-content:center;padding:10px 0;" onclick="cancelDeleteModal()">Cancelar</button>
        <button class="btn btn-danger" style="flex:1;justify-content:center;padding:10px 0;" onclick="doDelete()">Eliminar</button>
      </div>
    </div>
  </div>`;
}
function doDelete(){
  const { type, key, label } = state.confirmDelete;
  switch(type){
    case 'colaborador': { const idx=COLABORADORES.findIndex(c=>c.folio===key); if(idx>-1) COLABORADORES.splice(idx,1); if(state.colSel===key){ state.colSel=null; state.page='colaboradores'; } break; }
    case 'sucursal': { const idx=SUCURSALES.findIndex(s=>s.id===key); if(idx>-1) SUCURSALES.splice(idx,1); break; }
    case 'area': AREAS.splice(key,1); break;
    case 'puesto': PUESTOS.splice(key,1); break;
    case 'movimiento': MOVIMIENTOS.splice(key,1); break;
    case 'contenido': CONTENIDO.splice(key,1); break;
    case 'horario': HORARIOS.splice(key,1); break;
    case 'vacacion': { const idx=VACACIONES.findIndex(v=>v.folio===key); if(idx>-1) VACACIONES.splice(idx,1); break; }
    case 'permiso': { const idx=PERMISOS.findIndex(p=>p.folio===key); if(idx>-1) PERMISOS.splice(idx,1); break; }
    case 'curso': CURSOS.splice(key,1); break;
    case 'contrato': { const idx=CONTRATOS.findIndex(c=>c.folio===key); if(idx>-1) CONTRATOS.splice(idx,1); break; }
    case 'formato': FORMATOS.splice(key,1); break;
    case 'usuario': USUARIOS.splice(key,1); break;
    case 'prestacion': { const idx=PRESTACIONES.findIndex(p=>p.folio===key); if(idx>-1) PRESTACIONES.splice(idx,1); break; }
  }
  showToast((label||'Registro')+' eliminado','trash');
  state.confirmDelete = null;
  render();
}

/* ============================== ACCIONES / RUTEO ============================== */
function render(){
  document.getElementById('app').innerHTML = state.session ? renderShell() : renderLogin();
}
function login(){ state.session = true; render(); showToast('Sesión iniciada','check2'); }
function logout(){ state.session = false; render(); }
function goTo(page){ state.page = page; state.colSel = null; state.showNotif = false; render(); }
function changeRole(role){
  state.role = role;
  if(!ROLE_ACCESS[role].includes(state.page)) state.page = 'dashboard';
  state.colSel = null; render();
  showToast('Vista cambiada al rol '+role,'users');
}
function selectCol(folio){ state.colSel = folio; render(); }
function backCol(){ state.colSel = null; render(); }
function toggleNotif(ev){ ev.stopPropagation(); state.showNotif = !state.showNotif; render(); }
function filtroColChange(v){
  state.filtroCol = v; render();
  const input = document.querySelector('#app input[placeholder^="Buscar"]');
  if(input){ input.focus(); input.setSelectionRange(v.length, v.length); }
}
function filtroTipoChange(v){ state.filtroTipo = v; render(); }
function selectReporte(id){ state.reporteSel = id; render(); }

document.addEventListener('click', ()=>{ if(state.showNotif){ state.showNotif=false; render(); } });

render();
