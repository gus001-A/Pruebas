  :root{
    --ink:#1C2226; --ink-soft:#5B6167;
    --paper:#F4F1EA; --card:#FFFFFF; --line:#E2DED2;
    --graphite:#153238; --graphite2:#1E4550; --graphite-line:#2E5A63;
    --steel:#2F7A6B; --steel-dark:#215A4F; --steel-soft:#DCEEE9;
    --amber:#B9812A; --amber-soft:#F5EAD4; --amber-text:#7A5A15;
    --danger:#B24A34; --danger-soft:#F5E1DB;
    --success:#3F7A5C; --success-soft:#DEEAE3;
    --radius:8px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'IBM Plex Sans',sans-serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; }
  .brand{ font-family:'Fraunces',serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:.01em; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  button, select, input, textarea{ font-family:'IBM Plex Sans',sans-serif; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11.5px; font-weight:500; color:var(--ink-soft); padding:12px 14px; background:#FAF8F2; border-bottom:2px solid var(--line); white-space:nowrap; }
  td{ font-size:13.5px; padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:nth-child(even){ background:#FBFAF6; }
  tr.row{ transition:background-color .12s ease; }
  tr.row.clickable{ cursor:pointer; }
  tr.row:hover{ background:#F0ECDF !important; }
  tfoot td{ padding:7px 10px; border-top:2px solid var(--line); border-bottom:none; background:#FAF8F2; }
  .table-filter{ width:100%; border:1px solid var(--line); border-radius:5px; padding:6px 8px; font-size:12px; background:#fff; transition:border-color .12s ease, box-shadow .12s ease; }
  .table-filter:focus{ outline:none; border-color:var(--steel); box-shadow:0 0 0 3px var(--steel-soft); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 1px 2px rgba(28,34,38,.045); }
  .badge{ font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:20px; display:inline-block; line-height:1.4; white-space:nowrap; }
  .badge-neutral{ background:#EAE8E1; color:var(--ink-soft); }
  .badge-steel{ background:var(--steel-soft); color:var(--steel-dark); }
  .badge-amber{ background:var(--amber-soft); color:var(--amber-text); }
  .badge-danger{ background:var(--danger-soft); color:var(--danger); }
  .badge-success{ background:var(--success-soft); color:var(--success); }
  .btn{ border:none; border-radius:6px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:opacity .12s ease, transform .05s ease, background-color .12s ease; white-space:nowrap; }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--steel-dark); color:#fff; padding:9px 16px; }
  .btn-primary:hover{ background:#194539; }
  .btn-ghost{ background:#fff; border:1px solid var(--line); padding:9px 16px; }
  .btn-ghost:hover{ background:#FAF8F2; }
  .btn-danger{ background:var(--danger); color:#fff; padding:9px 16px; }
  .btn-danger:hover{ background:#96392A; }
  .btn-sm{ padding:6px 11px; font-size:12px; }
  .fadein{ animation:fadein .16s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }
  @keyframes toastin{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .icon{ width:15px; height:15px; display:inline-block; vertical-align:-3px; stroke:currentColor; fill:none; stroke-width:1.8; flex-shrink:0; }
  .icon-btn{ width:29px; height:29px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer; transition:background-color .12s ease, color .12s ease; flex-shrink:0; }
  .icon-btn:hover{ background:#EFEBDD; color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--danger-soft); color:var(--danger); }
  .readonly-banner{ display:flex; align-items:center; gap:8px; background:var(--amber-soft); color:var(--amber-text); font-size:12.5px; padding:9px 12px; border-radius:6px; margin-bottom:16px; }
  .info-banner{ display:flex; align-items:center; gap:8px; background:var(--steel-soft); color:var(--steel-dark); font-size:12.5px; padding:9px 12px; border-radius:6px; margin-bottom:16px; }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:0 1px 2px rgba(28,34,38,.045); }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(16,20,22,.5); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px; }
  .modal-box{ background:#fff; width:460px; max-width:92vw; border-radius:12px; padding:26px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px rgba(10,14,16,.28); }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .field-label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:5px; font-weight:500; }
  .field-input{ width:100%; border:1px solid var(--line); border-radius:6px; padding:9px 10px; font-size:13px; margin-bottom:14px; transition:border-color .12s ease, box-shadow .12s ease; background:#fff; }
  .field-input:focus{ outline:none; border-color:var(--steel); box-shadow:0 0 0 3px var(--steel-soft); }
  .field-input:disabled{ background:#F3F1EB; color:var(--ink-soft); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .chip{ border:1px solid var(--line); border-radius:6px; padding:6px 12px; font-size:12.5px; cursor:pointer; transition:background-color .12s ease; }
  .chip:hover{ background:#FAF8F2; }
  .chip.active{ background:var(--steel-dark); color:#fff; border-color:var(--steel-dark); }
  .flowchip{ background:var(--steel-soft); color:var(--steel-dark); font-size:11.5px; font-weight:500; padding:6px 12px; border-radius:14px; white-space:nowrap; }
  .toast{ position:fixed; bottom:22px; right:22px; background:var(--graphite); color:#F1EFE9; font-size:13px; padding:12px 18px; border-radius:8px; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:toastin .18s ease; display:flex; align-items:center; gap:8px; }

  .navbar{ height:58px; background:var(--graphite); color:#EDEEE9; display:flex; align-items:center; justify-content:space-between; padding:0 22px; position:sticky; top:0; z-index:45; border-bottom:2px solid var(--amber); }
  .navgroup{ position:relative; }
  .navlink{ display:flex; align-items:center; gap:6px; padding:9px 12px; border-radius:6px; font-size:13.3px; color:#D8DCDF; cursor:pointer; user-select:none; transition:background-color .12s ease, color .12s ease; }
  .navlink:hover{ background:var(--graphite2); color:#fff; }
  .navlink.active{ color:#fff; background:var(--graphite2); }
  .navdrop{ position:absolute; top:44px; left:0; background:#fff; border:1px solid var(--line); border-radius:10px; min-width:216px; box-shadow:0 16px 36px rgba(0,0,0,.2); overflow:hidden; z-index:55; }
  .navdrop-item{ padding:10px 14px; font-size:13px; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:9px; transition:background-color .1s ease; }
  .navdrop-item:hover{ background:#F5F3ED; }
  .navdrop-item.active{ background:var(--steel-soft); color:var(--steel-dark); }
  .navdrop-item.disabled{ color:#BDBAB0; cursor:not-allowed; }

  .cal-cell{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-height:104px; padding:8px; vertical-align:top; }
  .cal-evt{ font-size:11px; padding:4px 6px; border-radius:4px; margin-bottom:4px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:filter .1s ease; }
  .cal-evt:hover{ filter:brightness(0.94); }
</style>

}

/* Generador de patrón pseudo-QR (visual, determinista a partir de un texto) */
function qrPattern(text){
  let seed = 0;
  for(let i=0;i<text.length;i++) seed = (seed*31 + text.charCodeAt(i)) >>> 0;
  function rnd(){ seed = (seed*1103515245 + 12345) >>> 0; return (seed>>>8) % 100; }
  const n = 15;
  let cells = [];
  for(let r=0;r<n;r++){ cells.push([]); for(let c=0;c<n;c++) cells[r].push(rnd()<46); }
  const finder = (r0,c0)=>{
    for(let r=0;r<7;r++) for(let c=0;c<7;c++){
      const on = (r===0||r===6||c===0||c===6) || (r>=2&&r<=4&&c>=2&&c<=4);
      cells[r0+r][c0+c] = on;
    }
  };
  finder(0,0); finder(0,n-7); finder(n-7,0);
  const s = 12;
  let rects = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(cells[r][c]) rects += `<rect x="${c*s}" y="${r*s}" width="${s}" height="${s}" fill="#1B1F22"/>`;
  return `<svg viewBox="0 0 ${n*s} ${n*s}" width="176" height="176" style="background:#fff;">${rects}</svg>`;
}

function parseFechaMX(str){
  const m = String(str).match(/(\d{1,2})\s+([a-z]{3})\s+(\d{4})/i);
  if(!m) return null;
  const day = parseInt(m[1],10);
  const mon = MESES_MX[m[2].toLowerCase()];
  const year = parseInt(m[3],10);
  if(mon===undefined) return null;
  return new Date(year,mon,day);
}

/* ============================== TABLA GENÉRICA CON FILTROS POR COLUMNA ============================== */
function renderTable(tableId, columns, rows){
  const filters = state.tableFilters[tableId] || {};
  const filtered = rows.filter(r => columns.every((c,i)=>{
    if(c.filterable===false) return true;
    const f = (filters[i]||'').toLowerCase();
    if(!f) return true;
    return String(r.cells[i].text||'').toLowerCase().includes(f);
  }));
  return `<div class="card">
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
      <tbody>
        ${filtered.length ? filtered.map(r=>`<tr class="row ${r.onclick?'clickable':''}" ${r.onclick?`onclick="${r.onclick}"`:''}>${r.cells.map(c=>`<td>${c.html}</td>`).join('')}</tr>`).join('')
          : `<tr><td colspan="${columns.length}" style="text-align:center;color:var(--ink-soft);padding:30px;font-size:13px;">Sin resultados con los filtros aplicados.</td></tr>`}
      </tbody>
      <tfoot><tr>${columns.map((c,i)=> c.filterable===false ? '<td></td>' :
        `<td><input id="tf-${tableId}-${i}" class="table-filter" placeholder="Filtrar…" value="${(filters[i]||'').replace(/"/g,'&quot;')}" oninput="setTableFilter('${tableId}',${i},this.value)"></td>`).join('')}</tr></tfoot>
    </table>
    </div>
  </div>`;
}
function setTableFilter(tableId, colIndex, value){
  if(!state.tableFilters[tableId]) state.tableFilters[tableId] = {};
  state.tableFilters[tableId][colIndex] = value;
  render();
  const input = document.getElementById(`tf-${tableId}-${colIndex}`);

          const enabledItems = sec.items.filter(i=>access.includes(i.key));
          if(enabledItems.length===0) return '';
          const isOpen = state.openMenu===sec.label;
          const isActiveSection = currentSectionLabel===sec.label;
          return `<div class="navgroup">
            <div class="navlink ${isActiveSection||isOpen?'active':''}" onclick="toggleMenu(event,'${sec.label}')">${sec.label}${ICONS.chevronD}</div>
            ${isOpen?`<div class="navdrop" onclick="event.stopPropagation()">
              ${sec.items.map(i=>{
                const enabled = access.includes(i.key);
                return `<div class="navdrop-item ${enabled?'':'disabled'} ${state.page===i.key?'active':''}" onclick="${enabled?`goTo('${i.key}')`:''}">${ICONS[i.icon]}${i.label}</div>`;

          ${ICONS.bell}
          ${noLeidas>0?`<span style="position:absolute;top:-5px;right:-7px;background:var(--danger);color:#fff;font-size:9px;border-radius:8px;padding:1px 4px;">${noLeidas}</span>`:''}

          ${ICONS.logout}
        </div>
      </div>
    </div>
    <div style="flex:1;background:var(--paper);">
      <div style="max-width:1360px;margin:0 auto;padding:26px 28px;">${renderPage()}</div>

  ${state.showQr ? renderQrModal() : ''}

function renderPage(){
  switch(state.page){
    case 'dashboard': return renderDashboard();

/* ============================== DASHBOARD ============================== */
function renderDashboard(){
  const urgentes = MANTENIMIENTOS.filter(m => m.prioridad==='Urgente' && !['Cerrado','Cancelado'].includes(m.estado));
  const vencidos = EQUIPOS.filter(e => e.proximo.startsWith('Vencido'));
  const pendientes = MANTENIMIENTOS.filter(m=>!['Cerrado','Cancelado'].includes(m.estado)).length;
  const abiertas = SOLICITUDES.filter(s=>s.estado!=='Cerrada').length;

  const stats = [
    ['Equipos', EQUIPOS.length, ICONS.boxes, 'neutral'],
    ['Valor de inventario', '$2.78M', ICONS.trend, 'neutral'],
    ['Pendientes', pendientes, ICONS.wrench, 'neutral'],
    ['Urgentes', urgentes.length, ICONS.alert, 'danger'],
    ['Vencidos', vencidos.length, ICONS.clock, 'amber'],
    ['Solicitudes abiertas', abiertas, ICONS.inbox, 'neutral'],
  ];
  const toneColor = {neutral:'var(--ink)', amber:'var(--amber-text)', danger:'var(--danger)'};

  const kpis = [
    ['MTTR', '5.4 hrs', 'tiempo medio de reparación'],
    ['MTBF', '612 hrs', 'tiempo medio entre fallas'],
    ['Cumplimiento preventivo', '91%', 'realizado vs. programado'],
    ['Disponibilidad', '97.2%', 'tiempo operativo de equipos'],
  ];

  const maxBar = Math.max(...TIPO_MTO.map(d=>d.preventivo+d.correctivo), 1);
  const barChart = `<div style="display:flex; align-items:flex-end; gap:14px; height:150px; padding:0 4px;">
    ${TIPO_MTO.map(d=>{
      const hp = Math.round((d.preventivo/maxBar)*120), hc = Math.round((d.correctivo/maxBar)*120);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:120px;">
          <div title="Preventivo: ${d.preventivo}" style="width:12px;height:${hp}px;background:var(--steel);border-radius:2px 2px 0 0;"></div>
          <div title="Correctivo: ${d.correctivo}" style="width:12px;height:${hc}px;background:var(--amber);border-radius:2px 2px 0 0;"></div>
        </div>
        <span style="font-size:11px;color:var(--ink-soft);">${d.name}</span>
      </div>`;
    }).join('')}
  </div>
  <div style="display:flex;gap:16px;margin-top:8px;">
    <span style="font-size:11.5px;color:var(--ink-soft);"><span style="display:inline-block;width:8px;height:8px;background:var(--steel);border-radius:2px;margin-right:5px;"></span>Preventivo</span>
    <span style="font-size:11.5px;color:var(--ink-soft);"><span style="display:inline-block;width:8px;height:8px;background:var(--amber);border-radius:2px;margin-right:5px;"></span>Correctivo</span>
  </div>`;

  const distSucursal = SUCURSALES.map(s=>({name:s.nombre.replace('Centro de Distribución','C. Distribución'), value: EQUIPOS.filter(e=>e.sucursal===s.nombre).length}));
  const total = distSucursal.reduce((a,d)=>a+d.value,0) || 1;
  let acc = 0;
  const gradient = distSucursal.map((d,i)=>{
    const start = (acc/total)*360; acc += d.value; const end = (acc/total)*360;
    return `${PIE_COLORS[i%PIE_COLORS.length]} ${start}deg ${end}deg`;
  }).join(', ');
  const donut = `<div style="display:flex;align-items:center;gap:20px;">
    <div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${gradient});display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <div style="width:60px;height:60px;border-radius:50%;background:var(--card);"></div>
    </div>
    <div style="flex:1;">
      ${distSucursal.map((d,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px;">
        <span style="width:8px;height:8px;border-radius:2px;background:${PIE_COLORS[i%PIE_COLORS.length]};"></span>
        <span style="color:var(--ink-soft);">${d.name}</span><span class="mono" style="margin-left:auto;">${d.value}</span>
      </div>`).join('')}
    </div>
  </div>`;

  const proximos = MANTENIMIENTOS.filter(m=>['Asignado','En proceso'].includes(m.estado)).map(m=>`
    <div class="row clickable" onclick="openMtoFromDash('${m.folio}')" style="display:flex;justify-content:space-between;padding:9px 6px;border-radius:5px;font-size:13px;">
      <div><div style="font-weight:500;">${m.equipo}</div><div style="font-size:11.5px;color:var(--ink-soft);">${m.tecnico} · ${m.programado}</div></div>
      ${badge(m.prioridad, tonePrioridad(m.prioridad))}
    </div>`).join('');

  const urgenciasHtml = urgentes.map(m=>`
    <div class="row clickable" onclick="openMtoFromDash('${m.folio}')" style="display:flex;justify-content:space-between;padding:9px 6px;border-radius:5px;font-size:13px;">
      <div><div style="font-weight:500;">${m.equipo}</div><div class="mono" style="font-size:11px;color:var(--ink-soft);">${m.folio}</div></div>
      ${badge(m.estado, toneEstadoMto(m.estado))}
    </div>`).join('') + vencidos.map(e=>`
    <div class="row clickable" onclick="selectEquipoFromDash('${e.codigo}')" style="display:flex;justify-content:space-between;padding:9px 6px;border-radius:5px;font-size:13px;">
      <div><div style="font-weight:500;">${e.nombre}</div><div class="mono" style="font-size:11px;color:var(--ink-soft);">${e.codigo} · preventivo vencido</div></div>
      ${badge('Vencido','amber')}
    </div>`).join('');

  const flujo = `<div class="card" style="padding:16px 18px;margin-top:14px;">
    <div style="font-size:13.5px;font-weight:500;margin-bottom:10px;">Flujo operativo SIGAM</div>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;">
      ${FLUJO_OPERATIVO.map((f,i)=>`<span class="flowchip">${f}</span>${i<FLUJO_OPERATIVO.length-1?`<span style="color:var(--line);">${ICONS.chevronR}</span>`:''}`).join('')}
    </div>
  </div>`;

  return `
  <div class="fadein">
    ${pageHeader('dashboard','Panel de control', 'Vista general · martes, 08 de septiembre de 2026')}
    ${readOnlyBanner()}
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px;">
      ${stats.map(([label,val,icon,tone])=>`
        <div class="stat-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div style="font-size:12px;color:var(--ink-soft);">${label}</div>${icon}
          </div>
          <div class="mono" style="font-size:24px;margin-top:10px;color:${toneColor[tone]};">${val}</div>
        </div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
      ${kpis.map(([label,val,sub])=>`
        <div class="stat-card" style="background:var(--steel-soft);border-color:var(--steel-soft);">
          <div style="font-size:12px;color:var(--steel-dark);">${label}</div>
          <div class="mono" style="font-size:21px;margin-top:8px;color:var(--steel-dark);">${val}</div>
          <div style="font-size:11px;color:var(--steel-dark);opacity:.8;margin-top:2px;">${sub}</div>
        </div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px;">
      <div class="card" style="padding:18px;">
        <div style="font-size:13.5px;font-weight:500;margin-bottom:4px;">Preventivo vs. correctivo — últimos 6 días</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Órdenes de trabajo generadas por día</div>
        ${barChart}
      </div>
      <div class="card" style="padding:18px;">
        <div style="font-size:13.5px;font-weight:500;margin-bottom:4px;">Equipos por sucursal</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">Distribución del inventario activo</div>
        ${donut}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="card" style="padding:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="font-size:13.5px;font-weight:500;">Próximos trabajos</div>
          <span onclick="goTo('calendario')" style="font-size:12px;color:var(--steel-dark);cursor:pointer;">Ver calendario</span>
        </div>
        ${proximos || '<div style="font-size:13px;color:var(--ink-soft);">Sin trabajos programados.</div>'}
      </div>
      <div class="card" style="padding:18px;">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:12px;">${ICONS.alert}<div style="font-size:13.5px;font-weight:500;">Urgencias y alertas</div></div>
        ${urgenciasHtml || '<div style="font-size:13px;color:var(--ink-soft);">Sin urgencias abiertas.</div>'}
      </div>
    </div>
    ${flujo}
  </div>`;
}

/* ============================== EQUIPOS ============================== */
function renderEquipos(){
  const q = state.filtroEquipo.toLowerCase();
  const suc = state.filtroSucursal;
  const filtered = EQUIPOS.filter(e => (suc==='Todas'||e.sucursal===suc) && (e.nombre.toLowerCase().includes(q)||e.codigo.toLowerCase().includes(q)));
  const puedeEditar = !['Usuario básico','Técnico','Auditor'].includes(state.role);

  const columns = [
    {label:'Código'}, {label:'Equipo'}, {label:'Marca / modelo'}, {label:'Ubicación'},
    {label:'Estado'}, {label:'Garantía'}, {label:'Valor'}, {label:'Próximo mtto.'}, {label:'QR', filterable:false},
  ];
  if(puedeEditar) columns.push({label:'Acciones', filterable:false});
  const rows = filtered.map(e=>{
    const cells = [
      { text:e.codigo, html:`<span class="mono">${e.codigo}</span>` },
      { text:e.nombre, html:e.nombre },
      { text:e.marca, html:`<span style="color:var(--ink-soft);">${e.marca}</span>` },
      { text:e.ubicacion, html:`<span style="color:var(--ink-soft);">${ICONS.pin}${e.ubicacion}</span>` },
      { text:e.estado, html:badge(e.estado, toneEstadoEquipo(e.estado)) },
      { text:e.garantiaEstado, html:badge(e.garantiaEstado, toneGarantia(e.garantiaEstado)) },
      { text:e.valor, html:`<span class="mono">${money(e.valor)}</span>` },
      { text:e.proximo, html:`<span style="color:${e.proximo.startsWith('Vencido')?'var(--danger)':'var(--ink-soft)'};">${e.proximo}</span>` },
      { text:'', html:`<span class="icon-btn" onclick="event.stopPropagation(); openQr('${e.codigo}')" title="Ver QR">${ICONS.qr}</span>` },
    ];
    if(puedeEditar) cells.push({ text:'', html: actionsCell(`openForm('equipo','edit','${e.codigo}')`, `askDelete('equipo','${e.codigo}','${e.nombre}')`) });
    return { onclick:`selectEquipo('${e.codigo}')`, cells };
  });

  return `
  <div class="fadein">
    ${pageHeader('boxes','Equipos', filtered.length+' activos visibles según tu rol · expediente digital por equipo', puedeEditar?`<button class="btn btn-primary" onclick="openForm('equipo','create',null)">${ICONS.plus}Nuevo equipo</button>`:'')}
    ${readOnlyBanner()}
    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:#fff;flex:1;max-width:320px;">

/* ============================== CALENDARIO (vista mensual) ============================== */
function buildMonthGrid(year, month){
  const first = new Date(year, month, 1);
  const startWeekday = (first.getDay()+6)%7;
  const start = new Date(year, month, 1-startWeekday);
  const weeks = [];
  let cur = new Date(start);
  for(let w=0; w<6; w++){
    const week = [];
    for(let d=0; d<7; d++){ week.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
    weeks.push(week);
  }
  return weeks;
}
function eventosDelDia(date){
  return MANTENIMIENTOS.filter(m=>{
    const dt = parseFechaMX(m.programado);
    return dt && dt.getFullYear()===date.getFullYear() && dt.getMonth()===date.getMonth() && dt.getDate()===date.getDate();
  });
}
const EVT_TONE_BG = { danger:'var(--danger-soft)', amber:'var(--amber-soft)', steel:'var(--steel-soft)', neutral:'#EAE8E1', success:'var(--success-soft)' };
const EVT_TONE_FG = { danger:'var(--danger)', amber:'var(--amber-text)', steel:'var(--steel-dark)', neutral:'var(--ink-soft)', success:'var(--success)' };

function renderCalendario(){
  const year=2026, month=8;
  const weeks = buildMonthGrid(year, month);
  const hoy = new Date(2026,8,8);
  const diasLabel = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  return `
  <div class="fadein">
    ${pageHeader('calendar','Calendario', MESES_LARGO[month].charAt(0).toUpperCase()+MESES_LARGO[month].slice(1)+' de '+year+' · vista mensual')}
    ${readOnlyBanner()}
    <div class="card" style="padding:0;overflow:hidden;">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#FAF8F2;">
        ${diasLabel.map(d=>`<div style="padding:9px 10px;font-size:11.5px;color:var(--ink-soft);font-weight:500;border-bottom:2px solid var(--line);">${d}</div>`).join('')}
      </div>
      ${weeks.map(week=>`
        <div style="display:grid;grid-template-columns:repeat(7,1fr);">
          ${week.map(date=>{
            const inMonth = date.getMonth()===month;
            const isToday = date.toDateString()===hoy.toDateString();
            const evts = eventosDelDia(date);
            const shown = evts.slice(0,3);
            return `<div class="cal-cell" style="background:${inMonth?'#fff':'#FAF9F5'};">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span class="mono" style="font-size:11px;color:${inMonth?'var(--ink)':'#C7C3B7'};${isToday?'background:var(--steel-dark);color:#fff;border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center;':''}">${date.getDate()}</span>
              </div>
              ${shown.map(m=>{
                const tone = tonePrioridad(m.prioridad);
                return `<div class="cal-evt" onclick="openCalEvent('${m.folio}')" style="background:${EVT_TONE_BG[tone]};color:${EVT_TONE_FG[tone]};" title="${m.equipo}">${m.equipo.split('·')[1]||m.equipo}</div>`;
              }).join('')}
              ${evts.length>3?`<div style="font-size:10.5px;color:var(--ink-soft);padding:2px 4px;">+${evts.length-3} más</div>`:''}
            </div>`;
          }).join('')}
        </div>`).join('')}
    </div>
  </div>`;
}

function addCatalogItem(gIdx){
  const input = document.getElementById('cat-input-'+gIdx);
  const v = input.value.trim();
  if(!v) return;
  CATALOGOS[gIdx].items.push(v);
  render();
  showToast('Valor agregado a «'+CATALOGOS[gIdx].nombre+'»','check2');
}
function deleteCatalogItem(gIdx, itemIdx){
  const nombre = CATALOGOS[gIdx].items[itemIdx];
  CATALOGOS[gIdx].items.splice(itemIdx,1);
  render();
  showToast('«'+nombre+'» eliminado del catálogo','trash');
}

    MANTENIMIENTOS[idx] = { ...MANTENIMIENTOS[idx], equipo, tipo, tecnico, programado:fecha, diagnostico: descripcion || MANTENIMIENTOS[idx].diagnostico, estado, prioridad };
    if(state.mtoSel===state.modalForm.key) state.mtoSel = MANTENIMIENTOS[idx].folio;
    showToast('Orden de trabajo actualizada','check2');
  } else {
    const folio = nextFolio(MANTENIMIENTOS,'MTO-2026');
    const eqRec = EQUIPOS.find(e=>equipo.startsWith(e.codigo));
    MANTENIMIENTOS.push({
      folio, tipo, equipo, sucursal: eqRec? eqRec.sucursal : '—', prioridad:'Normal',
      estado: (tecnico && tecnico!=='—') ? 'Asignado' : 'Solicitado',
      tecnico: tecnico||'—', supervisor:'C. Fuentes', programado:fecha, inicio:'—', cierre:'—',
      diagnostico: descripcion || 'Sin diagnóstico registrado.', actividades:[], materiales:[], formato:'—', norma:'—',
      historial:[{ estado:(tecnico && tecnico!=='—')?'Asignado':'Solicitado', fecha:'08 sep 2026 · '+new Date().toTimeString().slice(0,5), nota:'Orden creada desde el prototipo' }]
    });
    showToast('Orden de trabajo creada','check2');
  }
  state.modalForm=null; render();
}

/* ============================== CONFIRMACIÓN DE ELIMINACIÓN ============================== */
function askDelete(type, key, label){ state.confirmDelete = { type, key, label }; render(); }
function cancelDeleteModal(){ state.confirmDelete = null; render(); }
function renderConfirmDeleteModal(){
  const { label } = state.confirmDelete;
  return `<div class="modal-backdrop" onclick="cancelDeleteModal()">
    <div class="modal-box fadein" style="width:380px;text-align:center;" onclick="event.stopPropagation()">
      <div style="width:44px;height:44px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">${ICONS.trash}</div>
      <div style="font-size:15px;font-weight:500;margin-bottom:6px;">¿Eliminar «${label}»?</div>
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 20px;">Esta acción es permanente dentro de esta sesión de demostración y no se puede deshacer.</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" style="flex:1;justify-content:center;padding:10px 0;" onclick="cancelDeleteModal()">Cancelar</button>
        <button class="btn btn-danger" style="flex:1;justify-content:center;padding:10px 0;" onclick="doDelete()">Eliminar</button>
      </div>
    </div>
  </div>`;
}
function doDelete(){
  const { type, key, label } = state.confirmDelete;
  switch(type){
    case 'equipo': { const idx=EQUIPOS.findIndex(e=>e.codigo===key); if(idx>-1) EQUIPOS.splice(idx,1); if(state.equipoSel===key){ state.equipoSel=null; state.page='equipos'; } break; }
    case 'sucursal': { const idx=SUCURSALES.findIndex(s=>s.id===key); if(idx>-1) SUCURSALES.splice(idx,1); break; }
    case 'proveedor': PROVEEDORES.splice(key,1); break;
    case 'norma': NORMAS.splice(key,1); break;
    case 'usuario': USUARIOS.splice(key,1); break;
    case 'formato': FORMATOS.splice(key,1); break;
    case 'solicitud': { const idx=SOLICITUDES.findIndex(s=>s.folio===key); if(idx>-1) SOLICITUDES.splice(idx,1); break; }
    case 'mantenimiento': { const idx=MANTENIMIENTOS.findIndex(m=>m.folio===key); if(idx>-1) MANTENIMIENTOS.splice(idx,1); if(state.mtoSel===key){ state.mtoSel=null; state.page='mantenimientos'; } break; }
  }
  showToast((label||'Registro')+' eliminado','trash');
  state.confirmDelete = null;
  render();
}

/* ============================== ACCIONES / RUTEO ============================== */
function render(){
  document.getElementById('app').innerHTML = state.session ? renderShell() : renderLogin();
}
function login(){ state.session = true; render(); showToast('Sesión iniciada','check2'); }
function logout(){ state.session = false; render(); }
function goTo(page){ state.page = page; state.equipoSel = null; state.mtoSel = null; state.showNotif = false; state.openMenu = null; render(); }
function changeRole(role){
  state.role = role;
  if(!ROLE_ACCESS[role].includes(state.page)) state.page = 'dashboard';
  state.equipoSel = null; state.mtoSel = null; state.openMenu = null; render();
  showToast('Vista cambiada al rol '+role,'users');
}
function toggleMenu(ev, label){ ev.stopPropagation(); state.openMenu = state.openMenu===label ? null : label; state.showNotif = false; render(); }
function selectEquipo(codigo){ state.equipoSel = codigo; render(); }
function selectEquipoFromDash(codigo){ state.page='equipos'; state.equipoSel=codigo; render(); }
function backEquipo(){ state.equipoSel = null; render(); }
function selectMto(folio){ state.mtoSel = folio; render(); }
function backMto(){ state.mtoSel = null; render(); }
function openMtoFromDash(folio){ state.page='mantenimientos'; state.mtoSel = folio; render(); }
function openMtoFromEquipo(folio){ state.page='mantenimientos'; state.equipoSel=null; state.mtoSel = folio; render(); }
function openQr(codigo){ state.showQr = codigo; render(); }
function closeQr(){ state.showQr = null; render(); }
function toggleNotif(ev){ ev.stopPropagation(); state.showNotif = !state.showNotif; state.openMenu = null; render(); }
function filtroEquipoChange(v){
  state.filtroEquipo = v; render();
  const input = document.querySelector('#app input[placeholder^="Buscar"]');
  if(input){ input.focus(); input.setSelectionRange(v.length, v.length); }
}
function filtroSucursalChange(v){ state.filtroSucursal = v; render(); }
function selectReporte(id){ state.reporteSel = id; render(); }
function avanzarMto(folio){
  const m = MANTENIMIENTOS.find(x=>x.folio===folio);
  if(m){
    const idx = CICLO.indexOf(m.estado);
    if(idx>-1 && idx<CICLO.length-1){
      m.estado = CICLO[idx+1];
      m.historial.push({ estado:m.estado, fecha:'08 sep 2026 · '+new Date().toTimeString().slice(0,5), nota:'Actualizado desde el prototipo' });
    }
  }
  showToast('Estado actualizado para '+folio,'check2');
  render();
}

document.addEventListener('click', ()=>{ if(state.showNotif || state.openMenu){ state.showNotif=false; state.openMenu=null; render(); } });

render();
</script>
</body>
