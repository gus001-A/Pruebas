<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>VisitaSan - Gestión de visitas sanitarias</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f9f8;--sf:#fff;--ink:#23403b;--mu:#6b807b;--ln:#dde8e5;--nv:#fff;--ac:#2f8f81;--ac2:#e7f5f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{font:14px/1.45 "Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv{height:56px;flex:none;background:var(--nv);color:var(--ink);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px;padding:0 14px}
.br{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-right:14px;white-space:nowrap}
.nl{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nl button{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--mu);padding:8px 11px;border-radius:7px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.nl button:hover{background:var(--ac2);color:var(--ink)}.nl button.on{background:var(--ac2);color:var(--ac);box-shadow:inset 0 -2px var(--ac)}
.rt{display:flex;align-items:center;gap:8px}
.rt select{background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:7px;padding:6px 8px;font:inherit;max-width:190px}.rt option{color:#16302c}
.ib0{position:relative;background:none;border:0;color:var(--ink);padding:7px;border-radius:7px;cursor:pointer}.ib0:hover{background:var(--ac2)}
.bd{position:absolute;top:0;right:0;background:#d64a3f;color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:16px;padding:0 4px;text-align:center}
main{flex:1;min-height:0;padding:14px;overflow:hidden}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;height:100%;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tt{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln);flex:none;flex-wrap:wrap}
.tt h2{margin:0;font-size:17px;flex:1;min-width:160px}.tt small{color:var(--mu);font-weight:400;font-size:12px;display:block}
.sc{flex:1;min-height:0;overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:middle}
thead th{position:sticky;top:0;background:var(--ac2);font-size:12px;font-weight:600;z-index:2;color:var(--ink)}
tbody tr:hover{background:var(--ac2)}
tfoot td{position:sticky;bottom:0;background:var(--sf);border-top:2px solid var(--ac);border-bottom:0;padding:7px 8px;z-index:2}
tfoot input,tfoot select{width:100%;min-width:90px;padding:5px 7px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px}
.tf{flex:none;display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;color:var(--mu);border-top:1px solid var(--ln)}
small.s{display:block;color:var(--mu);font-size:11px}
.ch{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.g{background:#e0f5ea;color:#1b6b43}.b{background:#e3eefb;color:#2a5a94}.w{background:#fdf1d3;color:#80540c}.r{background:#fbe3e0;color:#9a2a21}.n{background:#eaf0ee;color:#4d5f5b}
.ib{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--ln);color:var(--ink);border-radius:6px;padding:4px 9px 4px 7px;margin-right:4px;cursor:pointer;font:inherit;font-size:12px;font-weight:500}.ib svg.i{width:15px;height:15px}.ib:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.bt{display:inline-flex;align-items:center;gap:6px;background:var(--ac);color:#fff;border:0;border-radius:7px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}.bt.g2{background:none;color:var(--ink);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px;flex:none}
.k{border:1px solid var(--ln);border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:center}.k b{font-size:24px;line-height:1}.k span{font-size:12px;color:var(--mu)}
.k .ic{background:var(--ac2);color:var(--ac);border-radius:8px;padding:8px}
.dg{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.4fr;gap:14px;padding:0 14px 14px}
.pn{border:1px solid var(--ln);border-radius:9px;display:flex;flex-direction:column;min-height:0}.pn h3{margin:0;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--ln)}.pn .sc{padding:8px 12px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.bar i{display:block;height:10px;background:var(--ac);border-radius:5px;min-width:3px}.bar span:first-child{width:105px}
.al{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln);align-items:center}
#m{position:fixed;inset:0;background:#23403b66;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}#m.on{display:flex}
.mb{background:var(--sf);border-radius:12px;width:min(480px,100%);max-height:92%;display:flex;flex-direction:column}.mb.w{width:min(760px,100%)}
.mb h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--ln)}.mc{padding:14px 16px;overflow:auto;flex:1}.mf{padding:12px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--ln)}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 3px}
.mc input,.mc select,.mc textarea{width:100%;padding:8px;border:1px solid var(--ln);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}.gr div{padding:4px 0;border-bottom:1px solid var(--ln)}.gr small{display:block;color:var(--mu);font-size:11px}
.ck{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--ln)}.ck .rb{display:flex;gap:10px;font-size:12px}.ck label{display:inline-flex;gap:3px;margin:0;font-weight:500;align-items:center}.ck input[type=radio]{width:auto}.ck input[type=text]{grid-column:1/3}
h4{margin:14px 0 4px;font-size:13px}
#t{position:fixed;right:14px;bottom:14px;z-index:30;display:flex;flex-direction:column;gap:6px}#t div{background:#fff;color:var(--ink);border:1px solid var(--ac);padding:9px 14px;border-radius:8px;box-shadow:0 4px 14px #2f8f8133}#t .e{background:#fdecea;color:#8e1b13;border-color:#e8a29b}
.lg{margin:auto;width:min(380px,92%);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:24px}.lg h1{font-size:20px;margin:8px 0 0}.lg p{color:var(--mu);margin:2px 0 8px}
.lg select,.lg input{width:100%;padding:9px;border:1px solid var(--ln);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}.lg .bt{width:100%;justify-content:center;margin-top:16px}
@media(max-width:900px){.nl button span,.br span{display:none}.dg{grid-template-columns:1fr;overflow:auto}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>

<div id="app" style="display:contents"></div><div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),pad=(n,l=2)=>String(n).padStart(l,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdt=d=>{d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const fd=d=>d?fdt(d).slice(0,10):'-',nowI=()=>new Date().toISOString();
const addD=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d},diff=(a,b)=>Math.round((new Date(b).setHours(0,0,0,0)-new Date(a).setHours(0,0,0,0))/864e5);
const ago=(n,h=9)=>{const d=new Date();d.setDate(d.getDate()-n);d.setHours(h,(n*13)%60,0,0);return d.toISOString()};
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const CAT=['Agua potable y almacenamiento','Control de plagas','Higiene del personal','Manejo de residuos','Temperatura de refrigeración','Licencia sanitaria vigente'];
const MED=['Sin medida','Suspender','Asegurar','Destruir','Liberar','Clausura'];
const CAU=['No se encontró el establecimiento','Establecimiento cerrado','Negativa de acceso','Situación administrativa'];
const RN={sa:'Super administrador',dir:'Director',prog:'Programador',aud:'Auditor',dic:'Dictaminador',est:'Usuario de establecimiento'};
const TIPOS=['Restaurante','Hospital','Laboratorio','Farmacia','Clínica'],MUN=['Cuernavaca','Jiutepec','Cuautla','Temixco','Yautepec'];
let U=[[1,'Ana Ruiz Salgado','aruiz','sa'],[2,'Roberto Mena Díaz','rmena','dir'],[3,'Claudia Torres Vega','ctorres','prog'],[4,'Luis Ortega Pineda','lortega','aud'],[5,'Marta Silva Cruz','msilva','aud'],[6,'Elena Paredes Gil','eparedes','dic'],[7,'Taquería La Esquina','taqesquina','est']].map(([id,n,l,r])=>({id,n,l,r,a:1,est:r==='est'?1:0,by:1,at:ago(150)}));
const uname=id=>(U.find(u=>u.id==id)||{n:'Sistema'}).n;
let E=[['Taquería La Esquina SA de CV','Taquería La Esquina','TLE010203AB1','Cuernavaca','Restaurante','Av. Morelos 120'],['Hospital San Rafael SC','Hospital San Rafael','HSR950101KT2','Jiutepec','Hospital','Blvd. Cuauhnáhuac 45'],['Laboratorios Clínicos del Sur','LabSur','LCS080808PQ3','Cuautla','Laboratorio','Calle 5 de Mayo 88'],['Farmacias Vida SA','Farmacia Vida','FVI120415RX4','Temixco','Farmacia','Av. Central 301'],['Clínica Familiar Yautepec','Clínica Familiar','CFY010610MN5','Yautepec','Clínica','Calle Hidalgo 12'],['Mariscos El Faro SA','El Faro','MEF070707LL6','Cuernavaca','Restaurante','Av. Plan de Ayala 910'],['Laboratorio Análisis Rápido','AnalisRápido','LAR150120HJ7','Jiutepec','Laboratorio','Calle Reforma 77'],['Hospital Angeles del Valle','Ángeles del Valle','HAV990909CD8','Cuernavaca','Hospital','Av. Universidad 500']].map((a,i)=>({id:i+1,rs:a[0],nc:a[1],rfc:a[2],mun:a[3],tipo:a[4],dom:a[5],tel:'777 1'+pad(i*37+100,3)+' 0'+pad(i+10),a:1,by:i%2?3:1,at:ago(160-i*9)}));
const mk=s=>CAT.map((_,i)=>({v:(i+s)%5===0?'N':'C',obs:(i+s)%5===0?'Se detectó incumplimiento menor':''}));
let O=[];
function S(n,est,estado,prog,aud,x={}){O.push({id:n,folio:'COF-2026-'+pad(100+n,4),est,estado,by:n%2?2:3,at:ago((prog??30)+3,10),prog:prog!=null?ago(prog,9):null,aud,pby:prog!=null?3:0,pat:prog!=null?ago(prog,9):null,docs:[],...x})}
const V=(p,s,i=1)=>({ini:ago(p-1,10),fin:ago(p-1,13),ch:mk(s),obs:'Visita sin incidentes mayores.'});
S(1,1,'Cerrada',80,4,{vis:V(80,1),dic:{tipo:'Dictamen',res:'Favorable',medida:'Sin medida',txt:'Cumple.',by:6,at:ago(70)},cierre:ago(65)});
S(2,2,'Dictaminada',40,5,{vis:V(40,5),dic:{tipo:'Dictamen',res:'Desfavorable',medida:'Clausura',txt:'Riesgo sanitario alto.',by:6,at:ago(30)}});
S(3,3,'Visita realizada',20,4,{vis:V(20,2)});
S(4,4,'En visita',9,5,{vis:{ini:ago(1,10),ch:CAT.map(()=>({v:'',obs:''})),obs:''}});
S(5,5,'Programada',6,4);S(6,6,'Programada',9,5);S(7,7,'Autorizada',null,0);S(8,8,'En revisión',null,0);S(9,1,'Recibida',null,0);
S(10,2,'No realizada',15,4,{vis:{causa:CAU[0],ch:[]}});
S(11,3,'En dictamen',70,5,{vis:V(70,4),dby:6});S(12,5,'Programada',11,4);
let L=[],me=null,cur='dash';
const A={ver:'*',rev:'sa dir prog',aut:'sa dir',rec:'sa dir',prog:'sa prog',ini:'sa aud',cap:'sa aud',fin:'sa aud',nore:'sa aud',rdic:'sa dic',dic:'sa dic',cer:'sa dir',doc:'est'};
const can=a=>A[a]==='*'||A[a].split(' ').includes(me.r);
const NAV=[['dash','Dashboard','dash','sa dir prog aud dic est'],['ord','Órdenes','file','sa dir prog dic est'],['prog','Programación','cal','sa dir prog'],['vis','Visitas','clip','sa dir prog aud'],['dic','Dictámenes','scale','sa dir dic est'],['est','Establecimientos','build','sa dir prog'],['bit','Bitácora','hist','sa dir'],['usr','Usuarios','users','sa']];
function log(m,a,rec,p,q){L.unshift({id:L.length+1,at:nowI(),u:me?me.n:'Sistema',r:me?RN[me.r]:'-',ip:'10.20.4.'+(20+(me?me.id:0)),m:({ord:'Órdenes',prog:'Programación',vis:'Visitas',dic:'Dictámenes',est:'Establecimientos',dash:'Dashboard'}[m]||m),a,rec:rec||'-',p:p||'-',q:q||'-'})}
function toast(t,e){const d=document.createElement('div');d.textContent=t;if(e)d.className='e';$('#t').append(d);setTimeout(()=>d.remove(),3200)}
function modal(t,b,ok,fn,w){$('#m').innerHTML=`<div class="mb${w?' w':''}"><h3>${t}</h3><div class="mc">${b}</div><div class="mf"><button class="bt g2" data-x>${ok?'Cancelar':'Cerrar'}</button>${ok?`<button class="bt" id="ok">${ok}</button>`:''}</div></div>`;$('#m').classList.add('on');if(ok)$('#ok').onclick=()=>{if(fn()!==false)closeM()}}
const closeM=()=>$('#m').classList.remove('on');
$('#m').addEventListener('click',e=>{if(e.target.id==='m'||e.target.closest('[data-x]'))closeM()});
const stc={Recibida:'n','En revisión':'b',Autorizada:'b',Programada:'b','En visita':'w','Visita realizada':'g','En dictamen':'w',Dictaminada:'g',Cerrada:'n',Rechazada:'r','No realizada':'r'};
const chip=(t,c)=>`<span class="ch ${c}">${esc(t)}</span>`,sch=s=>chip(s,stc[s]||'n');
const alc={'En plazo':'g',Preventiva:'w',Prioritaria:'w','Incumplida':'r',Proceso:'w','Crítica':'r',Vencida:'r',Cumplido:'n'};
function plz(o){if(!o.prog)return null;const d=diff(o.prog,new Date()),lv=addD(o.prog,10),lc=addD(o.prog,90);let l;
if(['Cerrada','Rechazada'].includes(o.estado))l='Cumplido';
else if(o.estado==='Programada')l=d>=10?'Incumplida':d>=8?'Prioritaria':d>=5?'Preventiva':'En plazo';
else l=d>=90?'Vencida':d>=85?'Crítica':d>=75?'Prioritaria':d>=60?'Proceso':'En plazo';
return{d,lv,lc,rv:10-d,rc:90-d,l}}
const al=o=>{const p=plz(o);return p?chip(p.l,alc[p.l]):'-'};
const rest=o=>{const p=plz(o);if(!p)return'-';return(o.estado==='Programada'?`Visita: ${p.rv} d<small class="s">Cierre: ${p.rc} d</small>`:`Cierre: ${p.rc} d`)};
const sc=o=>{const c=(o.vis?.ch||[]).filter(x=>x.v==='C'||x.v==='N');return c.length?Math.round(c.filter(x=>x.v==='C').length/c.length*100)+'%':'-'};
const scope=()=>O.filter(o=>me.r==='est'?o.est===me.est:me.r==='aud'&&cur==='vis'?o.aud===me.id:1);
const en=id=>E.find(e=>e.id==id)||{};
const by=(id,at)=>`<b style="font-weight:600">${esc(uname(id))}</b><small class="s">${fdt(at)}</small>`;
const byv=(id,at)=>uname(id)+' '+fdt(at);
/* tabla genérica con filtros al pie de cada columna */
const F={};let TB=null;
function tbl(key,title,sub,cols,rows,tools){F[key]=F[key]||{};TB={key,cols,rows};
const head=cols.map(c=>`<th>${c.t}</th>`).join('');
const foot=cols.map((c,i)=>c.f==='s'?`<td><select data-i="${i}"><option value="">Todos</option>${[...new Set(rows.map(c.v))].sort().map(x=>`<option${F[key][i]===x?' selected':''}>${esc(x)}</option>`).join('')}</select></td>`:c.f?`<td><input data-i="${i}" placeholder="Filtrar" value="${esc(F[key][i]||'')}"></td>`:'<td></td>').join('');

<div class="rt"><button class="ib0" id="bell" title="Alertas de plazo" aria-label="Alertas">${ic('bell')}<b class="bd" id="bd"></b></button><select id="sw" title="Cambiar perfil (demo)">${U.filter(u=>u.a).map(u=>`<option value="${u.id}"${u.id===me.id?' selected':''}>${esc(u.n)}, ${RN[u.r]}</option>`).join('')}</select><button class="ib0" id="out" title="Cerrar sesión" aria-label="Cerrar sesión">${ic('out')}</button></div></header><main id="mn"></main>`;
document.querySelectorAll('.nl button').forEach(b=>b.onclick=()=>go(b.dataset.m));
$('#bell').onclick=()=>{const a=alerts();modal('Alertas de plazo',a.map(o=>`<div class="al"><span><b>${o.folio}</b> ${esc(en(o.est).nc)}<small class="s">${rest(o).replace(/<[^>]+>/g,' ')}</small></span>${al(o)}</div>`).join('')||'Sin alertas activas.')};
$('#sw').onchange=e=>{log('Seguridad','Cambio de perfil',uname(+e.target.value));me=U.find(u=>u.id==e.target.value);shell();go('dash')};
$('#out').onclick=()=>{log('Seguridad','Cierre de sesión');me=null;login()};
go(NAV.find(n=>n[0]===cur&&n[3].split(' ').includes(me.r))?cur:'dash')}
function login(){$('#app').innerHTML=`<div class="lg"><div style="color:var(--ac)">${ic('shield')}</div><h1>VisitaSan</h1><p>Gestión y seguimiento de visitas sanitarias</p><label>Usuario</label><select id="lu">${U.filter(u=>u.a).map(u=>`<option value="${u.id}">${esc(u.n)}, ${RN[u.r]}</option>`).join('')}</select><label>Contraseña</label><input type="password" id="lp" placeholder="Cualquier valor (demostración)"><button class="bt" id="li">${ic('out')}Iniciar sesión</button></div>`;
$('#li').onclick=()=>{me=U.find(u=>u.id==$('#lu').value);log('Seguridad','Inicio de sesión');cur='dash';shell()}}
[[3,'Órdenes','Importación','COF-2026-0101','-','Recibida',1],[2,'Seguridad','Inicio de sesión','-','-','-',6]].forEach(x=>L.push({id:L.length+1,at:ago(x[0]),u:uname(x[6]),r:RN[U[x[6]-1].r],ip:'10.20.4.2'+x[6],m:x[1],a:x[2],rec:x[3],p:x[4],q:x[5]}));
login();
</script></body></html>
