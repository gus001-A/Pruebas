 if(id){Object.assign(P(id),o);log('Paciente editado',`${o.name} (${id})`)}else{const dup=S.patients.find(p=>p.name.toLowerCase()===o.name.toLowerCase()&&p.birth===o.birth);if(dup)return toast(`Ya existe el expediente ${dup.id} con ese nombre y fecha de nacimiento.`,'err');createPatient(o)}A.close();render();toast('Paciente guardado')};
A.specModal=id=>{const e=id?E(id):{name:'',desc:'',cost:0,firstForm:'f5',subForm:'f6',active:true};const fo=sel=>opts(S.forms.map(f=>({v:f.id,l:f.name})),sel,'Sin formato');
 openModal({title:id?'Editar especialidad':'Nueva especialidad',body:`<div class="grid2"><div class="field"><label for="sp-n">Nombre</label><input id="sp-n" value="${esc(e.name)}"></div><div class="field"><label for="sp-c">Costo predeterminado</label><input type="number" id="sp-c" value="${e.cost}"></div></div><div class="field"><label for="sp-d">Descripción</label><input id="sp-d" value="${esc(e.desc)}"></div><div class="grid2"><div class="field"><label for="sp-f1">Formato de primera consulta</label><select id="sp-f1">${fo(e.firstForm)}</select></div><div class="field"><label for="sp-f2">Formato de consulta subsecuente</label><select id="sp-f2">${fo(e.subForm)}</select></div></div><label class="chk"><input type="checkbox" id="sp-a" ${e.active?'checked':''}>Activa</label>`,foot:`<button class="btn ghost" onclick="A.close()">Cancelar</button><button class="btn primary" onclick="A.saveSpec('${id||''}')">Guardar</button>`})};
A.saveSpec=id=>{const o={name:val('sp-n').trim(),cost:Number(val('sp-c'))||0,desc:val('sp-d'),firstForm:val('sp-f1'),subForm:val('sp-f2'),active:chk('sp-a')};if(!o.name)return toast('Escribe el nombre.','err');if(id)Object.assign(E(id),o);else S.specialties.push({id:uid('e'),...o});log(id?'Especialidad editada':'Especialidad creada',o.name);A.close();render();toast('Especialidad guardada')};
A.docModal=id=>{const d=id?D(id):{name:'',specId:'e1',phone:'',room:'r1',cost:800,dur:30,depMode:'monto',depVal:0,days:[1,3,5],start:'08:00',end:'14:00',obs:'',active:true};
 openModal({title:id?`Configurar a ${d.name}`:'Nuevo médico',wide:true,body:`<div class="grid3"><div class="field"><label for="dm-n">Nombre completo</label><input id="dm-n" value="${esc(d.name)}"></div><div class="field"><label for="dm-s">Especialidad</label><select id="dm-s">${specOpts(d.specId)}</select></div><div class="field"><label for="dm-p">Teléfono</label><input id="dm-p" value="${esc(d.phone)}"></div></div>
 <div class="field"><label>Días de atención</label><div class="pills">${[1,2,3,4,5,6,0].map(x=>`<label><input type="checkbox" class="dm-day" value="${x}" ${d.days.includes(x)?'checked':''} onchange="A.dmPrev()">${DAYS[x]}</label>`).join('')}</div></div>
 <div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="field"><label for="dm-a">Hora inicial</label><input type="time" id="dm-a" value="${d.start}" step="600" onchange="A.dmPrev()"></div><div class="field"><label for="dm-b">Hora final</label><input type="time" id="dm-b" value="${d.end}" step="600" onchange="A.dmPrev()"></div><div class="field"><label for="dm-u">Duración de consulta</label><select id="dm-u" onchange="A.dmPrev()">${opts([15,20,30,40,45,50,60].map(x=>({v:x,l:x+' min'})),d.dur)}</select></div><div class="field"><label for="dm-r">Consultorio</label><select id="dm-r">${resOpts(d.room)}</select></div></div>
 <div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="field"><label for="dm-c">Costo de consulta</label><input type="number" id="dm-c" value="${d.cost}" oninput="A.dmPrev()"></div><div class="field"><label for="dm-m">Anticipo</label><select id="dm-m" onchange="A.dmPrev()">${opts([{v:'monto',l:'Monto fijo'},{v:'porcentaje',l:'Porcentaje'}],d.depMode)}</select></div><div class="field"><label for="dm-v">Valor del anticipo</label><input type="number" id="dm-v" value="${d.depVal}" oninput="A.dmPrev()"></div><div class="field"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="dm-act" ${d.active?'checked':''}>Activo</label></div></div>
 <div class="field"><label for="dm-o">Observaciones</label><input id="dm-o" value="${esc(d.obs)}"></div>
 <div><div class="sec-t">Vista previa de la agenda generada</div><div id="dm-prev"></div></div>`,foot:`<button class="btn ghost" onclick="A.close()">Cancelar</button><button class="btn primary" onclick="A.saveDoc('${id||''}')">Guardar configuración</button>`,onMount:()=>{A.dmPrev(id)}})};
let DMid='';
A.dmPrev=id=>{if(id!==undefined)DMid=id;const days=[...document.querySelectorAll('.dm-day:checked')].map(x=>Number(x.value));const a=tm(val('dm-a')),b=tm(val('dm-b')),u=Number(val('dm-u'));const c=Number(val('dm-c'))||0,dv=Number(val('dm-v'))||0;const dep=val('dm-m')==='porcentaje'?Math.round(c*dv/100):dv;const el=$('#dm-prev');if(!el)return;
 if(!days.length||b<=a){el.innerHTML='<p class="note warn small">Selecciona al menos un día y un horario válido.</p>';return}
 const n=Math.floor((b-a)/u);let next=TODAY;for(let i=0;i<14&&!days.includes(dow(next));i++)next=addDays(next,1);
 const tmp={id:DMid||'_tmp',active:true,days,start:val('dm-a'),end:val('dm-b'),dur:u};const sl=slotsFor(tmp,next);
 const out=DMid?S.appts.filter(x=>x.doctorId===DMid&&x.date>=TODAY&&isActive(x)&&(!days.includes(dow(x.date))||!sl.length||(tm(x.time)<a||tm(x.time)+u>b))).length:0;
 el.innerHTML=`<p class="small" style="margin-bottom:8px">${n} consultas por día, ${n*days.length} por semana. Anticipo calculado: <b>${money(dep)}</b>. Próximo día: ${fmtDL(next)}.</p><div class="times">${sl.filter(s=>!s.off).map(s=>`<span class="chip s-${STATUS[s.state]} plain" title="${s.state}">${s.time} ${s.state==='Disponible'?'':s.state.toLowerCase()}</span>`).join('')}</div>${out?`<p class="note warn small" style="margin-top:8px">${out} citas futuras quedan fuera del nuevo horario. Seguirán visibles marcadas como fuera de horario para que las reagendes.</p>`:''}`};
A.saveDoc=id=>{const days=[...document.querySelectorAll('.dm-day:checked')].map(x=>Number(x.value));const o={name:val('dm-n').trim(),specId:val('dm-s'),phone:val('dm-p'),days,start:val('dm-a'),end:val('dm-b'),dur:Number(val('dm-u')),room:val('dm-r'),cost:Number(val('dm-c'))||0,depMode:val('dm-m'),depVal:Number(val('dm-v'))||0,obs:val('dm-o'),active:chk('dm-act')};
 if(!o.name)return toast('Escribe el nombre del médico.','err');if(!days.length)return toast('Selecciona los días de atención.','err');if(tm(o.end)<=tm(o.start))return toast('La hora final debe ser posterior a la inicial.','err');
 if(id){Object.assign(D(id),o);log('Horario de médico actualizado',`${o.name}: ${days.map(x=>DSH[x]).join(', ')} ${o.start} a ${o.end}, ${o.dur} min`)}else{const d={id:uid('d'),...o};S.doctors.push(d);S.users.push({id:uid('u'),name:o.name,role:'Médico',email:'',active:true,doctorId:d.id});log('Médico creado',o.name)}A.close();render();toast('Configuración guardada. La agenda se regeneró.')};
A.resModal=id=>{const r=id?Rs(id):{name:'',type:'Consultorio',location:'',capacity:1,start:'07:00',end:'21:00',cost:0,equipment:'',responsible:'',rules:'',active:true};
 openModal({title:id?'Editar espacio':'Nuevo espacio',wide:true,body:`<div class="grid3"><div class="field"><label for="rm-n">Nombre</label><input id="rm-n" value="${esc(r.name)}"></div><div class="field"><label for="rm-t">Tipo</label><select id="rm-t">${opts(RTYPES,r.type)}</select></div><div class="field"><label for="rm-l">Ubicación</label><input id="rm-l" value="${esc(r.location)}"></div><div class="field"><label for="rm-c">Capacidad</label><input type="number" id="rm-c" value="${r.capacity}"></div><div class="field"><label for="rm-a">Abre</label><input type="time" id="rm-a" value="${r.start}"></div><div class="field"><label for="rm-b">Cierra</label><input type="time" id="rm-b" value="${r.end}"></div><div class="field"><label for="rm-$">Costo</label><input type="number" id="rm-$" value="${r.cost}"></div><div class="field"><label for="rm-r">Responsable</label><input id="rm-r" value="${esc(r.responsible)}"></div><div class="field"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="rm-act" ${r.active?'checked':''}>Activo</label></div></div><div class="field"><label for="rm-e">Equipamiento</label><input id="rm-e" value="${esc(r.equipment)}"></div><div class="field"><label for="rm-g">Reglas de uso</label><input id="rm-g" value="${esc(r.rules)}"></div>`,foot:`<button class="btn ghost" onclick="A.close()">Cancelar</button><button class="btn primary" onclick="A.saveRes2('${id||''}')">Guardar</button>`})};
A.saveRes2=id=>{const o={name:val('rm-n').trim(),type:val('rm-t'),location:val('rm-l'),capacity:Number(val('rm-c'))||1,start:val('rm-a'),end:val('rm-b'),cost:Number(val('rm-$'))||0,responsible:val('rm-r'),equipment:val('rm-e'),rules:val('rm-g'),active:chk('rm-act')};if(!o.name)return toast('Escribe el nombre.','err');if(id)Object.assign(Rs(id),o);else S.resources.push({id:uid('r'),...o});log(id?'Espacio editado':'Espacio creado',o.name);A.close();render();toast('Espacio guardado')};

// ---------- REPORTES ----------
VIEWS.reportes=()=>{const {from,to}=U.rep;const inR=a=>a.date>=from&&a.date<=to;const L=S.appts.filter(inR);const act=L.filter(a=>a.status!=='Reagendada');
 const by=(key,lab)=>{const m={};act.forEach(a=>{const k=a[key];m[k]=m[k]||{t:0,at:0,c:0};m[k].t++;if(a.status==='Atendida')m[k].at++;if(a.status==='Cancelada')m[k].c++});return Object.entries(m).map(([k,v])=>({l:lab(k),v:v.t,parts:[{v:v.at,c:'var(--primary)'},{v:v.t-v.at-v.c,c:'color-mix(in srgb,var(--primary) 35%,transparent)'},{v:v.c,c:'var(--danger)'}]})).sort((a,b)=>b.v-a.v)};
 const st={};L.forEach(a=>st[a.status]=(st[a.status]||0)+1);const noShow=L.filter(a=>a.date<TODAY&&['Agendada','Confirmada','Anticipo pendiente'].includes(a.status)).length;
 // recursos
 const nDays=Math.max(1,Math.round((parseISO(to)-parseISO(from))/864e5)+1);
 const occ=S.resources.filter(r=>['Consultorio','Quirófano','Sala de procedimientos'].includes(r.type)).map(r=>{const avail=(tm(r.end)-tm(r.start))*nDays;let used=0;S.reservations.filter(x=>x.resourceId===r.id&&x.status==='Programada'&&x.date>=from&&x.date<=to).forEach(x=>used+=x.duration);if(r.type==='Consultorio')act.filter(a=>a.status!=='Cancelada'&&D(a.doctorId).room===r.id).forEach(a=>used+=D(a.doctorId).dur);return {l:r.name,v:Math.min(100,Math.round(used*100/avail)),max:100}});
 let free=0,blk=0,book=0;for(let i=0;i<nDays&&i<62;i++){const date=addDays(from,i);S.doctors.forEach(d=>slotsFor(d,date).forEach(s=>{if(s.off)return;if(s.state==='Bloqueada')blk+=s.dur;else if(s.appt)book+=s.dur;else if(s.state==='Disponible'||s.state==='No disponible')free+=s.dur}))}
 const pats=new Set(act.filter(a=>a.status==='Atendida').map(a=>a.patientId));const nuevos=new Set(act.filter(a=>a.type==='Primera consulta'&&a.status!=='Cancelada').map(a=>a.patientId));
 const perP={};act.forEach(a=>perP[a.patientId]=(perP[a.patientId]||0)+1);const topP=Object.entries(perP).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const dep=L.filter(a=>a.deposit>0);const cob=dep.filter(a=>!a.refunded).reduce((s,a)=>s+a.paid,0),pen=dep.filter(isActive).reduce((s,a)=>s+Math.max(0,a.deposit-a.paid),0),ree=dep.filter(a=>a.refunded).reduce((s,a)=>s+a.paid,0);
 const hc={};act.filter(a=>a.status!=='Cancelada').forEach(a=>hc[a.hcStatus]=(hc[a.hcStatus]||0)+1);
 const h=x=>Math.round(x/60);
 return `<div class="vh"><div class="field" style="width:170px"><label for="rp-f">Desde</label><input type="date" id="rp-f" value="${from}" onchange="U.rep.from=this.value;render()"></div><div class="field" style="width:170px"><label for="rp-t">Hasta</label><input type="date" id="rp-t" value="${to}" onchange="U.rep.to=this.value;render()"></div><div class="seg" style="align-self:flex-end">${[['Este mes',TODAY.slice(0,8)+'01',addDays(toISO(new Date(parseISO(TODAY).getFullYear(),parseISO(TODAY).getMonth()+1,1)),-1)],['Últimos 7 días',addDays(TODAY,-7),TODAY],['Próximos 14 días',TODAY,addDays(TODAY,14)]].map(([l,a,b])=>`<button class="${from===a&&to===b?'on':''}" onclick="U.rep={from:'${a}',to:'${b}'};render()">${l}</button>`).join('')}</div><div class="sp"></div><button class="btn" onclick="window.print()">Imprimir</button></div>
 <div class="kpis"><div class="kpi"><span>Citas en el periodo</span><b>${act.length}</b></div><div class="kpi"><span>Atendidas</span><b>${st['Atendida']||0}</b></div><div class="kpi"><span>Canceladas</span><b>${st['Cancelada']||0}</b></div><div class="kpi"><span>Reagendadas</span><b>${st['Reagendada']||0}</b></div><div class="kpi"><span>No atendidas</span><b>${noShow}</b></div><div class="kpi"><span>Pacientes atendidos</span><b>${pats.size}</b></div><div class="kpi"><span>Pacientes nuevos</span><b>${nuevos.size}</b></div></div>
 <div class="grid2"><div class="card"><header><h3>Citas por médico</h3></header><div class="body">${bars(by('doctorId',k=>D(k).name))}<p class="muted small" style="margin-top:10px">Oscuro: atendidas. Claro: por atender. Rojo: canceladas.</p></div></div>
 <div class="card"><header><h3>Citas por especialidad</h3></header><div class="body">${bars(by('specId',k=>E(k).name))}</div></div>
 <div class="card"><header><h3>Citas por estado</h3></header><div class="body">${bars(Object.keys(st).map(k=>({l:k,v:st[k],c:`var(--sf)`})).sort((a,b)=>b.v-a.v)).replace(/<div class="bar"><span class="n" title="([^"]+)">/g,(m,l)=>`<div class="bar s-${STATUS[l]||'nodi'}"><span class="n" title="${l}">`)}</div></div>
 <div class="card"><header><h3>Ocupación de recursos</h3></header><div class="body">${bars(occ,i=>i.v+'%')}<p class="muted small" style="margin-top:10px">Horas de agenda médica: ${h(book)} h ocupadas, ${h(free)} h libres, ${h(blk)} h bloqueadas.</p></div></div>
 <div class="card"><header><h3>Anticipos</h3></header><div class="body">${bars([{l:'Cobrados',v:cob,c:'var(--ok)'},{l:'Pendientes',v:pen,c:'var(--accent)'},{l:'Reembolsados',v:ree,c:'#8E3B69'}],i=>money(i.v))}</div></div>
 <div class="card"><header><h3>Historias clínicas</h3></header><div class="body">${bars(Object.keys(HC).map(k=>({l:k,v:hc[k]||0})).map(x=>({...x,c:'var(--sf)'}))).replace(/<div class="bar"><span class="n" title="([^"]+)">/g,(m,l)=>`<div class="bar ${HC[l]}"><span class="n" title="${l}">`)}</div></div>
 <div class="card"><header><h3>Pacientes con más citas</h3></header><div class="body small">${topP.map(([id,n])=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${esc(pname(id))}</span><b>${n}</b></div>`).join('')||'<p class="muted">Sin datos</p>'}</div></div></div>`};

// ---------- USUARIOS Y PERMISOS ----------
VIEWS.usuarios=()=>{const cfg=can('config');
 return `<div class="split"><div class="card"><header><h2>Usuarios</h2>${cfg?`<button class="btn sm" onclick="A.userModal()">${ic('plus',14)}Nuevo usuario</button>`:''}</header><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nombre</th><th>Rol</th><th>Correo</th><th>Estatus</th></tr></thead><tbody>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td><td class="small">${esc(u.email)}</td><td>${cfg?`<label class="chk"><input type="checkbox" ${u.active?'checked':''} onchange="A.userAct('${u.id}',this.checked)">${u.active?'Activo':'Inactivo'}</label>`:(u.active?'Activo':'Inactivo')}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><header><h2>Acceso por módulo</h2></header><div class="tbl-wrap"><table class="tbl matrix"><thead><tr><th>Módulo</th>${ROLES.map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${MODS.filter(m=>m.k!=='portal').map(m=>`<tr><td>${m.l}</td>${ROLES.map(r=>`<td><input type="checkbox" aria-label="${m.l}: ${r}" ${S.perms[r].includes(m.k)?'checked':''} ${!cfg||r==='Administrador'?'disabled':''} onchange="A.perm('${r}','${m.k}',this.checked)"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="body"><p class="muted small">Los cambios aplican de inmediato. Prueba cambiando la sesión simulada en el menú lateral. Además del acceso al módulo, cada rol tiene permisos de acción: Recepción no ve el contenido clínico, el Médico solo ve a sus pacientes y el rol Consulta es de solo lectura.</p></div></div></div>`};
A.perm=(r,k,v)=>{const s=new Set(S.perms[r]);v?s.add(k):s.delete(k);S.perms[r]=[...s];log('Permiso modificado',`${r}: ${k} ${v?'habilitado':'deshabilitado'}`);render()};
A.userAct=(id,v)=>{const u=S.users.find(x=>x.id===id);u.active=v;log('Usuario '+(v?'activado':'desactivado'),u.name);render()};
A.userModal=()=>openModal({title:'Nuevo usuario',body:`<div class="field"><label for="us-n">Nombre</label><input id="us-n"></div><div class="grid2"><div class="field"><label for="us-r">Rol</label><select id="us-r">${opts(ROLES,'Recepción')}</select></div><div class="field"><label for="us-e">Correo</label><input id="us-e" type="email"></div></div><p class="muted small">El usuario recibirá un correo para definir su contraseña.</p>`,foot:`<button class="btn ghost" onclick="A.close()">Cancelar</button><button class="btn primary" onclick="A.saveUser()">Crear usuario</button>`});
A.saveUser=()=>{const n=val('us-n').trim();if(!n)return toast('Escribe el nombre.','err');S.users.push({id:uid('u'),name:n,role:val('us-r'),email:val('us-e'),active:true});log('Usuario creado',`${n} (${val('us-r')})`);A.close();render();toast('Usuario creado')};

// ---------- AUDITORÍA ----------
VIEWS.auditoria=()=>`<div class="vh"><input style="max-width:360px" placeholder="Filtrar por usuario, acción o paciente" value="${esc(U.auditQ)}" oninput="A.auditF(this.value)" aria-label="Filtrar auditoría"><div class="sp"></div><span class="muted small">${S.audit.length} registros</span></div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody id="aud-rows">${audRows()}</tbody></table></div>`;
function audRows(){const q=U.auditQ.toLowerCase();const L=S.audit.slice().reverse().filter(x=>!q||(x.user+x.action+x.detail).toLowerCase().includes(q)).slice(0,300);return L.length?L.map(x=>`<tr><td style="white-space:nowrap">${fmtStamp(x.at)}</td><td>${esc(x.user)}</td><td><b style="font-weight:500">${esc(x.action)}</b></td><td>${esc(x.detail)}</td></tr>`).join(''):`<tr><td colspan="4"><div class="empty"><b>Sin registros</b>Las acciones que realices en la simulación aparecerán aquí.</div></td></tr>`}
A.auditF=q=>{U.auditQ=q;$('#aud-rows').innerHTML=audRows()};

// ---------- inicio ----------
window.U=U;Object.defineProperty(window,'S',{get:()=>S});Object.defineProperty(window,'N',{get:()=>N});window.render=render;window.save=save;
try{const th=localStorage.getItem(SKEY+'-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
load();
render();
setInterval(()=>{if(['agenda','panel','recepcion','espacios'].includes(U.view)&&!$('#modal-root').innerHTML)render()},60000);
})();
</script>
</body>
</html>
