<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGMA24 Agenda | Clínica San Antonio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EFF3F4;--surface:#FFFFFF;--surface-2:#F6F9F9;--ink:#13262D;--muted:#5A6D75;--line:#D8E2E5;--line-2:#E8EEF0;
--primary:#0D5C6B;--primary-2:#09495A;--primary-soft:#DFEEF0;--on-primary:#fff;
--accent:#D68A1F;--accent-soft:#FBEFD9;--danger:#B23838;--danger-soft:#FBE5E5;--ok:#1E7A4C;--ok-soft:#E1F3E9;
--side:#0A3B45;--side-ink:#D3E6EA;--side-muted:#86A9B1;--side-active:#13525E;
--blk1:#EDF0F1;--blk2:#E2E7E9;--shadow:0 1px 2px rgba(10,40,50,.06),0 8px 24px rgba(10,40,50,.08);--now:#D23F3F;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0C1A1F;--surface:#12242B;--surface-2:#162B33;--ink:#E2ECEF;--muted:#91A7AF;--line:#243C44;--line-2:#1C323A;
--primary:#45B3C5;--primary-2:#6CC6D5;--primary-soft:#173C45;--on-primary:#06252C;
--accent:#F0B050;--accent-soft:#3A2E17;--danger:#F08080;--danger-soft:#3E1F22;--ok:#6CD49C;--ok-soft:#173A2A;
--side:#071F25;--side-ink:#CFE2E6;--side-muted:#6F939B;--side-active:#123E48;
--blk1:#18292F;--blk2:#1F333A;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--now:#FF6B6B;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0C1A1F;--surface:#12242B;--surface-2:#162B33;--ink:#E2ECEF;--muted:#91A7AF;--line:#243C44;--line-2:#1C323A;
--primary:#45B3C5;--primary-2:#6CC6D5;--primary-soft:#173C45;--on-primary:#06252C;
--accent:#F0B050;--accent-soft:#3A2E17;--danger:#F08080;--danger-soft:#3E1F22;--ok:#6CD49C;--ok-soft:#173A2A;
--side:#071F25;--side-ink:#CFE2E6;--side-muted:#6F939B;--side-active:#123E48;
--blk1:#18292F;--blk2:#1F333A;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--now:#FF6B6B;color-scheme:dark}

/* estados de cita */
.s-disp{--sb:#E3F4EA;--sf:#1E7A4C}.s-agen{--sb:#E4ECFB;--sf:#2C56AE}.s-conf{--sb:#DBF0F3;--sf:#0B6B7B}
.s-anti{--sb:#FCEFD6;--sf:#9A5E00}.s-enco{--sb:#EEE5FB;--sf:#6A3DB3}.s-aten{--sb:#E5EBED;--sf:#41565F}
.s-canc{--sb:#FBE4E4;--sf:#B03535}.s-reag{--sb:#F6E6EF;--sf:#8E3B69}.s-bloq{--sb:#E9EDEF;--sf:#59666C}.s-nodi{--sb:transparent;--sf:#8B9BA1}
.hpen{--sb:#FCEFD6;--sf:#9A5E00}.hpro{--sb:#E4ECFB;--sf:#2C56AE}.hcom{--sb:#E3F4EA;--sf:#1E7A4C}.hrev{--sb:#DBF0F3;--sf:#0B6B7B}.hupd{--sb:#FBE4E4;--sf:#B03535}
.dpen{--sb:#FCEFD6;--sf:#9A5E00}.dpar{--sb:#FDF3C9;--sf:#7D6400}.dpag{--sb:#E3F4EA;--sf:#1E7A4C}.dnor{--sb:#E9EDEF;--sf:#59666C}.dree{--sb:#F6E6EF;--sf:#8E3B69}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s-disp,:root:not([data-theme="light"]) .hcom,:root:not([data-theme="light"]) .dpag{--sb:rgba(108,212,156,.14);--sf:#7FDCA9}
:root:not([data-theme="light"]) .s-agen,:root:not([data-theme="light"]) .hpro{--sb:rgba(120,160,245,.16);--sf:#A5C0F7}
:root:not([data-theme="light"]) .s-conf,:root:not([data-theme="light"]) .hrev{--sb:rgba(69,179,197,.17);--sf:#7FD3E0}
:root:not([data-theme="light"]) .s-anti,:root:not([data-theme="light"]) .hpen,:root:not([data-theme="light"]) .dpen{--sb:rgba(240,176,80,.16);--sf:#F3C37A}
:root:not([data-theme="light"]) .dpar{--sb:rgba(230,205,90,.15);--sf:#EAD27A}
:root:not([data-theme="light"]) .s-enco{--sb:rgba(170,130,240,.17);--sf:#C6A9F5}
:root:not([data-theme="light"]) .s-aten,:root:not([data-theme="light"]) .s-bloq,:root:not([data-theme="light"]) .dnor{--sb:rgba(150,170,178,.14);--sf:#AFC0C6}
:root:not([data-theme="light"]) .s-canc,:root:not([data-theme="light"]) .hupd{--sb:rgba(240,128,128,.15);--sf:#F5A3A3}
:root:not([data-theme="light"]) .s-reag,:root:not([data-theme="light"]) .dree{--sb:rgba(225,130,185,.15);--sf:#EBA9CE}}
:root[data-theme="dark"] .s-disp,:root[data-theme="dark"] .hcom,:root[data-theme="dark"] .dpag{--sb:rgba(108,212,156,.14);--sf:#7FDCA9}
:root[data-theme="dark"] .s-agen,:root[data-theme="dark"] .hpro{--sb:rgba(120,160,245,.16);--sf:#A5C0F7}
:root[data-theme="dark"] .s-conf,:root[data-theme="dark"] .hrev{--sb:rgba(69,179,197,.17);--sf:#7FD3E0}
:root[data-theme="dark"] .s-anti,:root[data-theme="dark"] .hpen,:root[data-theme="dark"] .dpen{--sb:rgba(240,176,80,.16);--sf:#F3C37A}
:root[data-theme="dark"] .dpar{--sb:rgba(230,205,90,.15);--sf:#EAD27A}
:root[data-theme="dark"] .s-enco{--sb:rgba(170,130,240,.17);--sf:#C6A9F5}
:root[data-theme="dark"] .s-aten,:root[data-theme="dark"] .s-bloq,:root[data-theme="dark"] .dnor{--sb:rgba(150,170,178,.14);--sf:#AFC0C6}
:root[data-theme="dark"] .s-canc,:root[data-theme="dark"] .hupd{--sb:rgba(240,128,128,.15);--sf:#F5A3A3}
:root[data-theme="dark"] .s-reag,:root[data-theme="dark"] .dree{--sb:rgba(225,130,185,.15);--sf:#EBA9CE}

html,body{height:100%}
body{margin:0;font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600}
h1{font-size:22px;letter-spacing:-.01em}h2{font-size:17px}h3{font-size:15px}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 16px}
.mark{width:36px;height:36px;border-radius:10px;background:#E9A23B;color:#0A3B45;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:.01em}
.brand small{color:var(--side-muted);font-size:12px}
.nav{padding:4px 0 12px;flex:1}
.nav .g{font-size:11.5px;color:var(--side-muted);padding:14px 22px 5px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;width:calc(100% - 20px);margin:1px 10px;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--side-ink);font-size:13.5px}
.nav button svg{opacity:.75;flex:none}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #E9A23B}
.nav button.on svg{opacity:1}
.nav .cnt{margin-left:auto;background:rgba(233,162,59,.2);color:#F3C47E;font-size:11px;padding:1px 7px;border-radius:10px}
.who{border-top:1px solid rgba(255,255,255,.08);padding:14px 16px 18px;display:grid;gap:8px}
.who label{font-size:11.5px;color:var(--side-muted)}
.who select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 9px;color:var(--side-ink)}
.who select option{color:#13262D;background:#fff}
.who .row{display:flex;gap:6px}
.who .row button{flex:1;background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--side-ink);border-radius:8px;padding:6px;font-size:12px;cursor:pointer}
.who .row button:hover{background:rgba(255,255,255,.07)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:14px;padding:12px 26px;border-bottom:1px solid var(--line);background:var(--surface);min-height:62px}
.top .ttl{min-width:0}
.top .ttl small{color:var(--muted);font-size:12.5px;display:block}
.top .sp{flex:1}
.user{display:flex;align-items:center;gap:9px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:12px}
.menu-btn{display:none}
#view{flex:1;overflow:auto;padding:22px 26px 40px;min-height:0}

/* componentes */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#2B1A00}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:6px;border-radius:7px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card.pad{padding:18px}
.card>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card>header h2,.card>header h3{flex:1}
.card .body{padding:16px 18px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh .sp{flex:1}
.field{display:grid;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],input[type=tel],input:not([type]),select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:0;border-color:var(--primary)}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--muted)}
.inline{display:flex;gap:8px;align-items:center}
.inline select,.inline input{width:auto}
.chk{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--primary);margin:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;background:var(--sb,var(--surface-2));color:var(--sf,var(--muted));white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.plain::before{display:none}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--primary);border-color:var(--primary)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.note{padding:10px 13px;border-radius:9px;background:var(--primary-soft);color:var(--ink);font-size:13px;border:1px solid color-mix(in srgb,var(--primary) 18%,transparent)}
.note.warn{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.note.err{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.prog{height:6px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--primary);border-radius:4px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.dateNav{display:flex;align-items:center;gap:6px}
.dateNav input{width:150px}
.legend{display:flex;flex-wrap:wrap;gap:6px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px;cursor:default;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kpi.click{cursor:pointer}.kpi.click:hover{background:var(--surface-2)}
.kpi span{font-size:12.5px;color:var(--muted);display:block}
.kpi b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
.kpi.alert b{color:var(--accent)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden;display:flex}
.bar .t i{display:block;height:100%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Agenda */
.cal{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto;max-height:calc(100vh - 250px);min-height:380px;position:relative}
.cal-axis{width:58px;flex:none;position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line)}
.cal-axis .hd{height:58px;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.cal-axis .h{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.cal-col{flex:1 0 190px;border-right:1px solid var(--line-2);min-width:190px}
.cal-col:last-child{border-right:0}
.cal-col .hd{height:58px;position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 10px;cursor:default}
.cal-col .hd b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-col .hd small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cal-col .hd.today b{color:var(--primary)}
.cal-col .bd{position:relative}
.cal-col.off .bd{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--line-2) 8px 9px)}
.slot{position:absolute;left:5px;right:5px;border-radius:7px;padding:3px 8px;font-size:12px;overflow:hidden;cursor:pointer;line-height:1.3;transition:filter .12s}
.slot.ap{background:var(--sb);border-left:3px solid var(--sf);color:var(--ink)}
.slot.ap:hover{filter:brightness(.97)}
.slot.ap .tm{color:var(--sf);font-weight:600;margin-right:5px;font-variant-numeric:tabular-nums}
.slot.ap .pn{font-weight:500}
.slot.ap .meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11.5px;white-space:nowrap}
.slot.free{border:1px dashed var(--line);color:var(--muted);display:flex;align-items:center;gap:6px}
.slot.free .add{margin-left:auto;font-weight:600;color:var(--primary);opacity:0}
.slot.free:hover{background:var(--primary-soft);border-color:var(--primary);border-style:solid}
.slot.free:hover .add{opacity:1}
.slot.blk{background:repeating-linear-gradient(135deg,var(--blk1) 0 6px,var(--blk2) 6px 12px);color:var(--muted);border:1px solid var(--line)}
.slot.blk b{color:var(--ink);font-weight:500}
.slot.past{color:var(--muted);opacity:.45;cursor:default;font-size:11px;padding-top:2px}
.slot.dim{opacity:.22}
.slot .off{color:var(--danger);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--sf);flex:none}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:1;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-1px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.month .dh{background:var(--surface-2);padding:8px 10px;font-size:12px;color:var(--muted)}
.month .dc{background:var(--surface);min-height:96px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.month .dc:hover{background:var(--surface-2)}
.month .dc.out{opacity:.45}
.month .dc.today .n{background:var(--primary);color:var(--on-primary);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.month .n{font-weight:600;font-size:13px}
.month .dc small{font-size:11.5px;color:var(--muted)}

/* espacios timeline */
.tl{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto}
.tl-in{min-width:calc(190px + 14 * 84px)}
.tl-row{display:flex;border-bottom:1px solid var(--line-2);min-height:52px}
.tl-row:last-child{border-bottom:0}
.tl-lab{width:190px;flex:none;padding:8px 12px;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line)}
.tl-lab b{display:block;font-size:13px;font-weight:500}
.tl-lab small{color:var(--muted);font-size:11.5px}
.tl-track{position:relative;flex:1;cursor:copy;background-image:linear-gradient(to right,var(--line-2) 1px,transparent 1px);background-size:84px 100%}
.tl-head .tl-track{cursor:default;background:none;height:32px}
.tl-head .tl-lab{background:var(--surface-2)}
.tl-head{position:sticky;top:0;z-index:3;background:var(--surface-2)}
.tl-hr{position:absolute;top:8px;font-size:11px;color:var(--muted);transform:translateX(4px)}

@keyframes pop{from{transform:translateY(8px);opacity:0}}

@media (max-width:1100px){.split{grid-template-columns:1fr}.portal-wrap{grid-template-columns:1fr;justify-items:center}.grid3{grid-template-columns:1fr 1fr}}

function genAnswers(ver,R,pt,a,partial){

VIEWS.panel=()=>{
 const d=TODAY,nm=nowMin();const list=S.appts.filter(a=>a.date===d&&a.status!=='Reagendada');const act=list.filter(a=>a.status!=='Cancelada');
 const fut=S.appts.filter(a=>a.date>=d&&isActive(a)&&a.status!=='Atendida');
 const antP=fut.filter(a=>['Pendiente','Parcial'].includes(depState(a)));
 const hcP=fut.filter(a=>a.date<=addDays(d,7)&&['Pendiente','En proceso','Requiere actualización'].includes(a.hcStatus));
 const cons=S.resources.filter(r=>r.type==='Consultorio'&&r.active);const occC=cons.filter(r=>S.doctors.some(doc=>doc.room===r.id&&works(doc,d)&&tm(doc.start)<=nm&&nm<tm(doc.end))).length;
 const qx=S.resources.filter(r=>r.type==='Quirófano'&&r.active);const occQ=qx.filter(r=>S.reservations.some(x=>x.resourceId===r.id&&x.date===d&&x.status==='Programada'&&tm(x.start)<=nm&&nm<tm(x.start)+x.duration)).length;

 <div class="kpis">${K('Citas del día',act.length,'','', 'recepcion')}${K('Confirmadas',act.filter(a=>a.status==='Confirmada').length)}${K('Pendientes de confirmar',act.filter(a=>['Agendada','Anticipo pendiente'].includes(a.status)).length)}${K('Canceladas',list.filter(a=>a.status==='Cancelada').length)}${K('Pacientes del día',new Set(act.map(a=>a.patientId)).size)}${K('Anticipos pendientes',money(antP.reduce((s,a)=>s+a.deposit-a.paid,0)),antP.length+' citas','alert','anticipos')}${K('Historias por completar',hcP.length,'próx. 7 días','alert','historias')}${K('Consultorios ocupados',`${occC}/${cons.length}`)}${K('Quirófanos ocupados',`${occQ}/${qx.length}`,'','','espacios')}</div>

 ${next.length?next.map(a=>{const doc=D(a.doctorId);return `<div class="list-item" onclick="A.openAppt('${a.id}')"><span class="time-b">${a.time}</span><div style="flex:1;min-width:0"><b style="font-weight:500">${esc(pname(a.patientId))}</b><div class="muted small">${esc(doc.name)}, ${esc(E(a.specId).name)}</div></div>${hcChip(a.hcStatus)}${chip(a.status)}</div>`}).join(''):`<div class="empty"><b>No quedan citas por atender hoy</b>Las próximas aparecen en la agenda.</div>`}</div>

const PPM=1.6;
function agendaFilters(){const f=U.f,lock=U.role==='Médico';
 return `<div class="row" style="margin-bottom:12px">
 <select style="width:auto" onchange="A.setF('spec',this.value)" aria-label="Especialidad" ${lock?'disabled':''}>${specOpts(f.spec,'Todas las especialidades')}</select>
 <select style="width:auto" onchange="A.setF('doc',this.value)" aria-label="Médico" ${lock?'disabled':''}>${docOpts(f.doc,U.mode==='semana'?'Elige un médico':'Todos los médicos',f.spec)}</select>
 <select style="width:auto" onchange="A.setF('room',this.value)" aria-label="Consultorio">${resOpts(f.room,'Todos los consultorios')}</select>
 <select style="width:auto" onchange="A.setF('st',this.value)" aria-label="Estado">${opts(Object.keys(STATUS).filter(s=>s!=='No disponible'),f.st,'Todos los estados')}</select>
 <select style="width:auto" onchange="A.setF('type',this.value)" aria-label="Tipo de cita">${opts(CTYPES,f.type,'Todos los tipos')}</select>
 ${(f.spec||f.room||f.st||f.type||(f.doc&&!lock))?`<button class="btn ghost sm" onclick="A.clearF()">Limpiar filtros</button>`:''}</div>`}
A.setF=(k,v)=>{U.f[k]=v;if(k==='spec'&&v&&U.f.doc&&D(U.f.doc).specId!==v)U.f.doc='';render()};
A.clearF=()=>{U.f={spec:'',doc:U.role==='Médico'?U.docAs:'',room:'',st:'',type:''};render()};
A.mode=m=>{U.mode=m;render()};
function filteredDocs(){const f=U.f;return S.doctors.filter(d=>d.active&&(!f.spec||d.specId===f.spec)&&(!f.doc||d.id===f.doc)&&(!f.room||d.room===f.room))}
function slotHTML(s,d,date,base){
 const top=(s.m-base)*PPM,h=Math.max(s.dur*PPM-3,18);const f=U.f;
 const dim=(f.st&&s.state!==f.st)||(f.type&&(!s.appt||s.appt.type!==f.type))?' dim':'';
 const st=`top:${top}px;height:${h}px`;
 if(s.appt){const a=s.appt;const tall=h>=36;
  return `<div class="slot ap s-${STATUS[a.status]}${dim}" style="${st}" onclick="A.openAppt('${a.id}')" title="${esc(pname(a.patientId))}, ${a.status}"><span class="tm">${a.time}</span><span class="pn">${esc(pname(a.patientId))}</span>${s.off?' <span class="off">fuera de horario</span>':''}${tall?`<div class="meta"><span class="dot ${HC[a.hcStatus]}" title="Historia clínica: ${a.hcStatus}"></span>${esc(a.status)}${a.deposit>a.paid&&!a.refunded?`, debe ${money(a.deposit-a.paid)}`:''}</div>`:''}</div>`}
 if(s.state==='Bloqueada')return `<div class="slot blk${dim}" style="${st}" onclick="A.openBlock('${s.block.id}')" title="Bloqueado: ${esc(s.block.type)}">${s.time} <b>${esc(s.block.type)}</b></div>`;
 if(s.state==='Disponible')return `<div class="slot free${dim}" style="${st}" onclick="A.newAppt('${d.id}','${date}','${s.time}')" role="button" tabindex="0" aria-label="Agendar ${s.time}">${s.time}<span class="add">Agendar</span></div>`;
 return `<div class="slot past${dim}" style="${st}">${s.time}</div>`;
}
function calendar(cols,base,end){
 const H=(end-base)*PPM;let axis='';for(let m=Math.ceil(base/60)*60;m<=end;m+=60)axis+=`<span class="h" style="top:${(m-base)*PPM}px">${mt(m)}</span>`;
 const grid=`background-image:repeating-linear-gradient(to bottom,var(--line-2) 0 1px,transparent 1px ${60*PPM}px);background-position:0 ${((60-base%60)%60)*PPM}px`;
 return `<div class="cal"><div class="cal-axis"><div class="hd"></div><div style="position:relative;height:${H}px">${axis}</div></div>${cols.map(c=>`<div class="cal-col${c.off?' off':''}"><div class="hd${c.today?' today':''}">${c.head}</div><div class="bd" style="height:${H}px;${grid}">${c.body}${c.today&&nowMin()>=base&&nowMin()<=end?`<div class="nowline" style="top:${(nowMin()-base)*PPM}px"></div>`:''}</div></div>`).join('')}</div>`}
VIEWS.agenda=()=>{
 const legend=`<div class="legend">${['Disponible','Agendada','Confirmada','Anticipo pendiente','En consulta','Atendida','Bloqueada'].map(chip).join('')}</div>`;
 const head=`<div class="vh"><div class="seg" role="tablist">${[['dia','Día'],['semana','Semana'],['mes','Mes']].map(([k,l])=>`<button class="${U.mode===k?'on':''}" onclick="A.mode('${k}')">${l}</button>`).join('')}</div>${dateNav()}<div class="sp"></div>${can('bloqueo')?`<button class="btn" onclick="A.newBlock()">${ic('ban',16)}Bloquear horario</button>`:''}</div>${agendaFilters()}`;
 if(U.mode==='mes')return head+monthView();
 if(U.mode==='semana'){
  const d=D(U.f.doc)||filteredDocs()[0];if(!d)return head+`<div class="card empty"><b>Sin médicos para estos filtros</b>Ajusta especialidad o consultorio.</div>`;
  const mon=mondayOf(U.date);const days=[...Array(7)].map((_,i)=>addDays(mon,i));
  let base=tm(d.start),end=tm(d.end);
  const cols=days.map(date=>{const s=slotsFor(d,date);s.forEach(x=>{base=Math.min(base,x.m);end=Math.max(end,x.m+x.dur)});return {date,s}});
  base=Math.floor(base/60)*60;
  return head+`<p class="muted small" style="margin-bottom:10px">Semana de ${esc(d.name)}: ${d.days.map(x=>DAYS[x]).join(', ')}, ${d.start} a ${d.end}, cada ${d.dur} min. ${legend}</p>`+calendar(cols.map(c=>({today:c.date===TODAY,off:!works(d,c.date),head:`<b>${DAYS[dow(c.date)]} ${parseISO(c.date).getDate()}</b><small>${works(d,c.date)?c.s.filter(x=>x.state==='Disponible').length+' disponibles':'Sin consulta'}</small>`,body:c.s.map(x=>slotHTML(x,d,c.date,base)).join('')})),base,end);
 }
 const docs=filteredDocs().filter(d=>works(d,U.date)||S.appts.some(a=>a.doctorId===d.id&&a.date===U.date&&isActive(a)));
 if(!docs.length)return head+legend+`<div class="card empty" style="margin-top:12px"><b>No hay consulta programada este día</b>Ningún médico con estos filtros atiende el ${fmtDL(U.date).toLowerCase()}. Usa la próxima disponibilidad para encontrar el siguiente espacio.<div style="margin-top:12px"><button class="btn" onclick="A.go('disponibilidad')">Buscar disponibilidad</button></div></div>`;
 let base=24*60,end=0;const cols=docs.map(d=>{const s=slotsFor(d,U.date);s.forEach(x=>{base=Math.min(base,x.m);end=Math.max(end,x.m+x.dur)});return {d,s}});
 base=Math.floor(base/60)*60;end=Math.ceil(end/60)*60;
 return head+`<div style="margin-bottom:10px">${legend}</div>`+calendar(cols.map(c=>({today:U.date===TODAY,head:`<b title="${esc(c.d.name)}">${esc(c.d.name)}</b><small>${esc(E(c.d.specId).name)}, ${esc((Rs(c.d.room)||{}).name||'')}</small>`,body:c.s.map(x=>slotHTML(x,c.d,U.date,base)).join('')})),base,end);
};
function monthView(){
 const d=parseISO(U.date);const first=toISO(new Date(d.getFullYear(),d.getMonth(),1));const start=mondayOf(first);const docs=filteredDocs();
 let h=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="dh">${x}</div>`).join('');
 for(let i=0;i<42;i++){const date=addDays(start,i);const inM=parseISO(date).getMonth()===d.getMonth();
  let n=0,free=0,tot=0;docs.forEach(doc=>slotsFor(doc,date).forEach(s=>{if(s.off&&!s.appt)return;tot++;if(s.appt&&(!U.f.st||s.state===U.f.st)&&(!U.f.type||s.appt.type===U.f.type))n++;if(s.state==='Disponible')free++}));
  const pct=tot?Math.round(n*100/tot):0;
  h+=`<div class="dc${inM?'':' out'}${date===TODAY?' today':''}" onclick="A.setDate('${date}');A.mode('dia')"><span class="n">${parseISO(date).getDate()}</span>${tot?`<small>${n} citas</small><small>${free} disponibles</small><div class="prog"><i style="width:${pct}%"></i></div>`:'<small>Sin consulta</small>'}</div>`}
 return `<div class="month">${h}</div>`;
}

 const canc=S.appts.filter(a=>a.date===date&&!isActive(a)&&(!U.rec.doc||a.doctorId===U.rec.doc));

  if(r.state==='Disponible')act=`<button class="btn sm" onclick="event.stopPropagation();A.newAppt('${r.d.id}','${date}','${r.time}')">Agendar</button>`;

  else if(a)act=`<button class="btn sm" onclick="event.stopPropagation();A.openAppt('${a.id}')">Ver</button>`;

 const dup=S.patients.find(p=>p.name.toLowerCase()===name.toLowerCase()&&p.birth===birth);if(dup){toast(`Ya existe ${dup.name} (${dup.id}). Se seleccionó el expediente existente.`);return A.nSel(dup.id)}
 const p=createPatient({name,birth,phone,email:val('np-mail')});N.newPat=false;A.nSel(p.id);toast(`Paciente dado de alta con ID ${p.id}`)};

 if(!d){tEl.innerHTML='<span class="muted small">Elige un médico para ver horarios.</span>';hid.value=''}
 else{const sl=slotsFor(d,date).filter(s=>s.state==='Disponible'&&!s.off);

 const fi=$('#n-form');if(d){const f=findForm(d.specId,val('n-type'));const p2=P(N.patientId);const pr=p2&&prevHC({patientId:p2.id,id:'_',date:'9999-12-31',time:'99'});
  fi.innerHTML=`Al registrar se asignará <b>${esc(f.name)} v${curV(f).v}</b> y se enviará al paciente el enlace para completarla.${pr?` El paciente tiene información previa del ${fmtDS(pr.date)}; se le preguntará si sigue vigente.`:''}`}
 else fi.innerHTML='El formato clínico se asigna según especialidad, médico y tipo de consulta.';

 try{if(!N.patientId)throw new Error('Selecciona o da de alta al paciente.');if(!val('n-doc'))throw new Error('Selecciona un médico.');if(!val('n-time'))throw new Error('Selecciona un horario disponible.');
  const dep=Number(val('n-dep'))||0,paid=Number(val('n-paid'))||0;if(paid>dep&&dep>0)throw new Error('El anticipo recibido no puede ser mayor al requerido.');
  const a=createAppt({patientId:N.patientId,doctorId:val('n-doc'),date:val('n-date'),time:val('n-time'),type:val('n-type'),reason:val('n-reason'),cost:val('n-cost'),deposit:dep,paid,pay:val('n-pay'),notes:val('n-notes'),channel:val('n-chan')});
  if(waitId){const w=S.waitlist.find(x=>x.id===waitId);if(w){w.status='Agendado';w.apptId=a.id;log('Lista de espera atendida',`${pname(w.patientId)} agendado`)}}
  A.close();render();toast(`Cita registrada para ${pname(a.patientId)}. Notificación enviada por ${a.channel}.`,'ok',{label:'Ver cita',fn:()=>A.openAppt(a.id)});
 }catch(e){toast(e.message,'err')}

A.openAppt=(id,silent)=>{
 const a=Ap(id);if(!a)return;U.drawer=id;const d=D(a.doctorId),p=P(a.patientId)||{},e=E(a.specId),r=Rs(d.room)||{},fm=Fm(a.formId)||{name:''};const act=isActive(a);const prog=progressOf(a);
 const B=[];
 if(act&&can('cita')){
  if(['Agendada','Anticipo pendiente'].includes(a.status)&&!a.confirmed)B.push(`<button class="btn" onclick="A.confirmAppt('${id}')">${ic('check',16)}Confirmar</button>`);
  if(a.deposit>a.paid&&can('anticipo'))B.push(`<button class="btn accent" onclick="A.payModal('${id}')">${ic('coin',16)}Registrar anticipo</button>`);
 }
 if(act&&can('consulta')&&['Agendada','Confirmada','Anticipo pendiente'].includes(a.status)&&a.date===TODAY)B.push(`<button class="btn primary" onclick="A.setStatus('${id}','En consulta')">Iniciar consulta</button>`);
 if(a.status==='En consulta'&&can('consulta'))B.push(`<button class="btn primary" onclick="A.finishModal('${id}')">Finalizar atención</button>`);
 if(act&&can('cita')&&!['Atendida','En consulta'].includes(a.status)){B.push(`<button class="btn" onclick="A.reschedModal('${id}')">Reagendar</button>`);B.push(`<button class="btn danger" onclick="A.cancelModal('${id}')">Cancelar cita</button>`)}
 if(!act&&a.paid>0&&!a.refunded&&can('anticipo'))B.push(`<button class="btn" onclick="A.refund('${id}')">Reembolsar anticipo</button>`);
 const B2=[];if(can('verclinico'))B2.push(`<button class="btn sm" onclick="A.viewHC('${id}')">${ic('eye',15)}Ver historia clínica</button>`);
 if(act&&a.status!=='Atendida'){B2.push(`<button class="btn sm" onclick="A.resend('${id}')">${ic('send',15)}Reenviar enlace</button>`);B2.push(`<button class="btn sm" onclick="A.openPortal('${id}')">${ic('phone',15)}Abrir como paciente</button>`)}
 if(can('cita')&&act)B2.push(`<button class="btn sm" onclick="A.editAppt('${id}')">Editar datos</button>`);
 const html=`<div class="drawer-ov" onclick="A.closeDrawer()"></div><aside class="drawer" role="dialog" aria-label="Detalle de cita"><header><div><div class="row" style="gap:6px;margin-bottom:6px">${chip(a.status)}${a.confirmed&&a.status!=='Confirmada'?'<span class="tag">Confirmada por paciente</span>':''}</div><h2>${esc(p.name)}</h2><p class="muted small">${p.id||''}${p.birth?`, ${ageOf(p.birth)} años`:''}${p.phone?`, tel. ${esc(p.phone)}`:''}</p></div><button class="icon-btn" onclick="A.closeDrawer()" aria-label="Cerrar">${ic('x')}</button></header>
 <div class="db">${B.length?`<div class="acts">${B.join('')}</div>`:''}
 <dl class="kv"><dt>Fecha y hora</dt><dd><b style="font-weight:500">${fmtDL(a.date)}, ${a.time}</b></dd><dt>Médico</dt><dd>${esc(d.name)}</dd><dt>Especialidad</dt><dd>${esc(e.name)}</dd><dt>Consultorio</dt><dd>${esc(r.name||'')} ${r.location?`<span class="muted">(${esc(r.location)})</span>`:''}</dd><dt>Tipo</dt><dd>${esc(a.type)}</dd><dt>Motivo</dt><dd>${esc(a.reason||'Sin especificar')}</dd>${a.notes?`<dt>Observaciones</dt><dd>${esc(a.notes)}</dd>`:''}</dl>
 <div><div class="sec-t">Pago</div><dl class="kv"><dt>Costo</dt><dd>${money(a.cost)}</dd><dt>Anticipo</dt><dd>${money(a.paid)} de ${money(a.deposit)} ${depChip(a)}</dd>${a.deposit>a.paid&&!a.refunded?`<dt>Saldo de anticipo</dt><dd style="color:var(--accent);font-weight:500">${money(a.deposit-a.paid)}</dd>`:''}<dt>Saldo a pagar en consulta</dt><dd>${money(a.cost-a.paid)}</dd></dl></div>
 <div><div class="sec-t">Historia clínica previa</div><div class="row" style="justify-content:space-between"><div><b style="font-weight:500">${esc(fm.name)}</b> <span class="tag">v${a.formV}</span><div class="muted small">${a.hcAt?'Enviada '+fmtStamp(a.hcAt):'Sin enviar'}${a.files.length?`, ${a.files.length} archivos`:''}${a.reviewedBy?`, revisada por ${esc(a.reviewedBy)}`:''}</div></div>${hcChip(a.hcStatus)}</div><div class="prog" style="margin-top:8px"><i style="width:${prog}%"></i></div><div class="acts" style="margin-top:10px">${B2.join('')}</div>${!can('verclinico')?`<p class="muted small" style="margin-top:6px">${ic('lock',13)} Tu rol puede ver el estado, no el contenido clínico.</p>`:''}</div>
 ${a.attNote?`<div><div class="sec-t">Nota de atención</div><p>${esc(a.attNote)}</p></div>`:''}
 ${can('cita')&&act?`<div><div class="sec-t">Cambiar estado</div><select onchange="A.setStatus('${id}',this.value)" style="width:auto">${opts(APPT_ST_MANUAL,a.status)}</select></div>`:''}
 <div><div class="sec-t">Historial de la cita</div><div class="timeline">${a.history.slice().reverse().map(h=>`<div>${esc(h.text)}<small>${fmtStamp(h.at)}, ${esc(h.user||'Sistema')}</small></div>`).join('')}</div></div>

 if(Number(val('e-cost'))!==a.cost){ch.push(`costo ${money(a.cost)} a ${money(val('e-cost'))}`);a.cost=Number(val('e-cost'))}

A.pay=id=>{const a=Ap(id);const amt=Number(val('pm-amt'));const rest=a.deposit-a.paid;if(!(amt>0))return toast('Escribe un monto mayor a cero.','err');if(amt>rest)return toast(`El monto excede el saldo de ${money(rest)}.`,'err');
 a.paid+=amt;a.pay=val('pm-m');a.payments.push({amount:amt,method:val('pm-m'),ref:val('pm-ref'),at:stamp()});hist(a,`Anticipo registrado: ${money(amt)} (${val('pm-m')})`);
 if(a.status==='Anticipo pendiente'&&a.paid>=a.deposit){a.status=a.confirmed?'Confirmada':'Agendada';hist(a,'Anticipo liquidado')}
 log('Anticipo registrado',`${pname(a.patientId)}: ${money(amt)}`);notify(a,'anticipo');A.close();render();toast(a.paid>=a.deposit?'Anticipo liquidado':`Pago parcial registrado. Saldo ${money(a.deposit-a.paid)}`)};

// ---------- CANCELAR / REAGENDAR ----------

 <label class="chk"><input type="checkbox" id="cn-not" checked>Notificar al paciente</label>${a.paid>0?`<p class="note warn small">La cita tiene ${money(a.paid)} de anticipo. Podrás registrar el reembolso desde el detalle.</p>`:''}<p class="muted small">El horario quedará disponible y se buscarán candidatos en la lista de espera.</p>`,

 const d=D(a.doctorId);const c=candidatesFor(d,a.date,a.time);

A.freedModal=(docId,date,time,c)=>{const d=D(docId);c=c||candidatesFor(d,date,time);
 openModal({title:'Se liberó un espacio',body:`<p>${esc(d.name)}, ${fmtDL(date)} a las ${time}. Estos pacientes de la lista de espera son compatibles por especialidad, médico y preferencia de horario:</p>
 <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Paciente</th><th>Prioridad</th><th>Preferencia</th><th>Solicitó</th><th></th></tr></thead><tbody>${c.map(w=>`<tr><td>${esc(pname(w.patientId))}<div class="muted small">${esc(w.notes)}</div></td><td>${w.priority}</td><td>${w.pref}</td><td>${fmtD(w.requested)}</td><td><button class="btn sm primary" onclick="A.close();A.newAppt('${docId}','${date}','${time}','${w.id}')">Agendar</button></td></tr>`).join('')}</tbody></table></div>`,foot:`<button class="btn ghost" onclick="A.close()">Dejar el horario libre</button>`})};
let RS={};
A.reschedModal=id=>{const a=Ap(id);RS={id,doc:a.doctorId,date:a.date<TODAY?TODAY:a.date,time:''};
 openModal({title:'Reagendar cita',wide:true,body:`<p class="muted">${esc(pname(a.patientId))}. Actual: ${fmtDL(a.date)} a las ${a.time}. Las respuestas de historia clínica y los anticipos se conservan.</p>
 <div class="grid2"><div class="field"><label for="rs-doc">Médico</label><select id="rs-doc" onchange="RSu('doc',this.value)">${docOpts(a.doctorId,undefined,a.specId)}</select></div><div class="field"><label for="rs-date">Nueva fecha</label><input type="date" id="rs-date" min="${TODAY}" value="${RS.date}" onchange="RSu('date',this.value)"></div></div>
 <div class="field"><label>Horarios disponibles</label><div id="rs-times" class="times"></div></div><div class="field"><label for="rs-why">Motivo del cambio</label><input id="rs-why" value="Solicitud del paciente"></div>`,

 el.innerHTML=sl.length?sl.map(s=>`<button type="button" class="${s.time===RS.time?'on':''}" onclick="RSu('time','${s.time}')">${s.time}</button>`).join(''):`<span class="muted small">Sin espacios este día. <a href="#" onclick="event.preventDefault();RSnext()">Buscar la próxima fecha disponible</a></span>`};

A.doResched=()=>{const a=Ap(RS.id);if(!RS.time)return toast('Elige un horario.','err');
 try{const n=createAppt({patientId:a.patientId,doctorId:RS.doc,date:RS.date,time:RS.time,type:a.type,reason:a.reason,cost:a.cost,deposit:a.deposit,paid:0,pay:a.pay,notes:a.notes,channel:a.channel,notify:false,prevId:a.id});
  n.paid=a.paid;n.payments=a.payments.slice();n.confirmed=false;n.status=n.deposit>n.paid?'Anticipo pendiente':'Agendada';n.hcData=JSON.parse(JSON.stringify(a.hcData));n.files=a.files.slice();n.hcStatus=a.hcStatus;n.hcAt=a.hcAt;n.formId=a.formId;n.formV=a.formV;n.history=a.history.concat(n.history);

  const c=candidatesFor(D(old.d),old.date,old.time);if(c.length&&old.date>=TODAY)setTimeout(()=>A.freedModal(old.d,old.date,old.time,c),300);

// ---------- BLOQUEOS ----------
A.openBlock=id=>{const b=S.blocks.find(x=>x.id===id);if(!b)return;const t=b.scope==='doctor'?(b.targetId==='*'?'Todos los médicos':D(b.targetId).name):Rs(b.targetId).name;
 openModal({title:'Bloqueo de agenda',body:`<dl class="kv"><dt>Tipo</dt><dd><b style="font-weight:500">${esc(b.type)}</b></dd><dt>Aplica a</dt><dd>${esc(t)}</dd><dt>Fecha</dt><dd>${b.recur?`Cada ${b.days.map(x=>DAYS[x].toLowerCase()).join(', ')} desde ${fmtDS(b.date)}${b.until?' hasta '+fmtDS(b.until):''}`:fmtDL(b.date)}</dd><dt>Horario</dt><dd>${b.start==='00:00'&&b.end==='23:59'?'Todo el día':`${b.start} a ${b.end}`}</dd>${b.notes?`<dt>Observaciones</dt><dd>${esc(b.notes)}</dd>`:''}<dt>Creado por</dt><dd>${esc(b.user)}, ${fmtStamp(b.createdAt)}</dd></dl>`,

A.newBlock=(scope,target,date,start)=>{if(!can('bloqueo'))return toast('Solo Administración y Coordinación pueden bloquear horarios.','err');scope=scope||'doctor';
 openModal({title:'Bloquear horario',body:`<div class="grid2"><div class="field"><label for="bk-sc">Aplica a</label><select id="bk-sc" onchange="A.bkScope()">${opts([{v:'doctor',l:'Agenda de médico'},{v:'resource',l:'Espacio o quirófano'}],scope)}</select></div><div class="field"><label for="bk-t">Médico o espacio</label><select id="bk-t"></select></div></div>
 <div class="grid3"><div class="field"><label for="bk-type">Tipo de bloqueo</label><select id="bk-type">${opts(BTYPES,'Comida')}</select></div><div class="field"><label for="bk-d">Fecha</label><input type="date" id="bk-d" value="${date||U.date}"></div><div class="field"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="bk-all" onchange="$id('bk-s').disabled=$id('bk-e').disabled=this.checked">Todo el día</label></div></div>
 <div class="grid2"><div class="field"><label for="bk-s">Hora inicial</label><input type="time" id="bk-s" value="${start||'13:00'}" step="600"></div><div class="field"><label for="bk-e">Hora final</label><input type="time" id="bk-e" value="${start?mt(tm(start)+60):'14:00'}" step="600"></div></div>
 <label class="chk"><input type="checkbox" id="bk-r" onchange="$id('bk-rd').style.display=this.checked?'grid':'none'">Repetir cada semana</label>
 <div id="bk-rd" style="display:none" class="stack"><div class="pills">${[1,2,3,4,5,6,0].map(x=>`<label><input type="checkbox" class="bk-day" value="${x}" ${x===dow(date||U.date)?'checked':''}>${DSH[x]}</label>`).join('')}</div><div class="field"><label for="bk-u">Hasta (opcional)</label><input type="date" id="bk-u"></div></div>
 <div class="field"><label for="bk-n">Observaciones</label><input id="bk-n"></div>`,
 foot:`<button class="btn ghost" onclick="A.close()">Cancelar</button><button class="btn primary" onclick="A.saveBlock()">Crear bloqueo</button>`,onMount:()=>{A.bkScope(target||(scope==='doctor'?U.f.doc:''))}})};
window.$id=id=>document.getElementById(id);
A.bkScope=t=>{const sc=val('bk-sc');$('#bk-t').innerHTML=sc==='doctor'?`<option value="*">Todos los médicos</option>`+docOpts(t||''):resOpts(t||'');if(t)$('#bk-t').value=t};
A.saveBlock=()=>{const sc=val('bk-sc'),t=val('bk-t'),all=chk('bk-all');const s=all?'00:00':val('bk-s'),e=all?'23:59':val('bk-e');const recur=chk('bk-r');const days=[...document.querySelectorAll('.bk-day:checked')].map(x=>Number(x.value));
 if(tm(s)>=tm(e))return toast('La hora final debe ser posterior a la inicial.','err');if(recur&&!days.length)return toast('Elige al menos un día de la semana.','err');
 const b={id:uid('B'),scope:sc,targetId:t,type:val('bk-type'),date:val('bk-d'),start:s,end:e,recur,days,until:recur?val('bk-u'):'',notes:val('bk-n'),user:user(),createdAt:stamp()};
 // regla: no bloquear sobre citas o reservaciones existentes
 const conf=[];for(let i=0;i<(recur?120:1);i++){const date=addDays(b.date,i);if(recur&&b.until&&date>b.until)break;if(!blockApplies(b,date))continue;
  if(sc==='doctor')S.appts.filter(a=>isActive(a)&&a.date===date&&(t==='*'||a.doctorId===t)&&overlap(tm(a.time),tm(a.time)+D(a.doctorId).dur,tm(s),tm(e))&&a.status!=='Atendida').forEach(a=>conf.push(`${fmtD(a.date)} ${a.time}, ${pname(a.patientId)}`));
  else S.reservations.filter(r=>r.status==='Programada'&&r.resourceId===t&&r.date===date&&overlap(tm(r.start),tm(r.start)+r.duration,tm(s),tm(e))).forEach(r=>conf.push(`${fmtD(r.date)} ${r.start}, ${r.procedure}`))}
 if(conf.length)return openModal({title:'No se puede bloquear',body:`<p class="note err">Hay ${conf.length} ${sc==='doctor'?'citas':'reservaciones'} en ese periodo. Reagéndalas o cancélalas antes de bloquear.</p><ul>${conf.slice(0,10).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`,foot:`<button class="btn" onclick="A.close()">Entendido</button>`});
 S.blocks.push(b);const tn=sc==='doctor'?(t==='*'?'Todos los médicos':D(t).name):Rs(t).name;log('Bloqueo creado',`${tn}: ${b.type} ${s} a ${e}${recur?' (semanal)':''}`);A.close();render();toast('Horario bloqueado')};

// ---------- DISPONIBILIDAD ----------

// ---------- LISTA DE ESPERA ----------
VIEWS.espera=()=>{const L=S.waitlist.slice().sort((a,b)=>({'En espera':0,'Contactado':1,'Agendado':2,'Descartado':3}[a.status]-{'En espera':0,'Contactado':1,'Agendado':2,'Descartado':3}[b.status])||({Alta:0,Media:1,Baja:2}[a.priority]-{Alta:0,Media:1,Baja:2}[b.priority]));
 const sc={'En espera':'hpen','Contactado':'hpro','Agendado':'hcom','Descartado':'s-aten'};
 return `<div class="vh"><p class="muted">Cuando se cancela o reagenda una cita, el sistema propone a los pacientes compatibles.</p><div class="sp"></div>${can('cita')?`<button class="btn primary" onclick="A.newWait()">${ic('plus',16)}Agregar paciente</button>`:''}</div>
 <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Paciente</th><th>Especialidad</th><th>Médico</th><th>Solicitud</th><th>Preferencia</th><th>Prioridad</th><th>Estado</th><th></th></tr></thead><tbody>${L.length?L.map(w=>`<tr><td>${esc(pname(w.patientId))}${w.notes?`<div class="muted small">${esc(w.notes)}</div>`:''}</td><td>${esc(E(w.specId).name)}</td><td>${w.doctorId?esc(D(w.doctorId).name):'<span class="muted">Cualquiera</span>'}</td><td>${fmtD(w.requested)}</td><td>${w.pref}</td><td>${w.priority==='Alta'?`<b style="color:var(--danger);font-weight:600">Alta</b>`:w.priority}</td><td><span class="chip ${sc[w.status]}">${w.status}</span></td><td style="white-space:nowrap">${['En espera','Contactado'].includes(w.status)&&can('cita')?`<button class="btn sm primary" onclick="A.waitFind('${w.id}')">Buscar espacio</button> <button class="btn sm ghost" onclick="A.waitSt('${w.id}','${w.status==='En espera'?'Contactado':'En espera'}')">${w.status==='En espera'?'Marcar contactado':'Regresar a espera'}</button> <button class="btn sm ghost" onclick="A.waitSt('${w.id}','Descartado')">Descartar</button>`:w.apptId&&Ap(w.apptId)?`<button class="btn sm" onclick="A.openAppt('${w.apptId}')">Ver cita</button>`:''}</td></tr>`).join(''):`<tr><td colspan="8"><div class="empty"><b>No hay pacientes en espera</b></div></td></tr>`}</tbody></table></div>`};
A.waitSt=(id,st)=>{const w=S.waitlist.find(x=>x.id===id);w.status=st;log('Lista de espera',`${pname(w.patientId)}: ${st}`);render()};
A.newWait=(spec,doc)=>{openModal({title:'Agregar a lista de espera',body:`<div class="field"><label for="w-p">Paciente</label><select id="w-p">${patOpts('','Elige paciente')}</select></div><div class="grid2"><div class="field"><label for="w-s">Especialidad</label><select id="w-s" onchange="$id('w-d').innerHTML='<option value=&quot;&quot;>Cualquier médico</option>'+A._docOpts(this.value)">${specOpts(spec||'e1')}</select></div><div class="field"><label for="w-d">Médico</label><select id="w-d"><option value="">Cualquier médico</option>${S.doctors.filter(d=>d.specId===(spec||'e1')).map(d=>`<option value="${d.id}"${d.id===doc?' selected':''}>${esc(d.name)}</option>`).join('')}</select></div></div>
 <div class="grid2"><div class="field"><label for="w-pr">Preferencia de horario</label><select id="w-pr">${opts(['Cualquier horario','Mañana','Tarde'])}</select></div><div class="field"><label for="w-pi">Prioridad</label><select id="w-pi">${opts(['Alta','Media','Baja'],'Media')}</select></div></div><div class="field"><label for="w-n">Observaciones</label><input id="w-n"></div>`,

A.waitFind=id=>{const w=S.waitlist.find(x=>x.id===id);const r=freeSlots(w.specId,w.doctorId,TODAY,45,w.pref==='Cualquier horario'?'':w.pref).slice(0,6);
 openModal({title:`Espacios para ${pname(w.patientId)}`,wide:true,body:r.length?`<p class="muted small">${esc(E(w.specId).name)}${w.doctorId?', '+esc(D(w.doctorId).name):''}, preferencia: ${w.pref.toLowerCase()}.</p>${r.map(x=>`<div style="margin-bottom:12px"><b style="font-weight:500">${fmtD(x.date)}</b> <span class="muted small">${esc(x.d.name)}</span><div class="times" style="margin-top:6px">${x.times.slice(0,10).map(t=>`<button onclick="A.close();A.newAppt('${x.d.id}','${x.date}','${t}','${w.id}')">${t}</button>`).join('')}</div></div>`).join('')}`:`<div class="empty"><b>Sin espacios compatibles en 45 días</b>El paciente seguirá en espera.</div>`,foot:`<button class="btn ghost" onclick="A.close()">Cerrar</button>`})};

// ---------- ESPACIOS ----------
const HPX=84,TL0=7*60,TL1=21*60;
VIEWS.espacios=()=>{const date=U.date;const rs=S.resources.filter(r=>!U.esp.type||r.type===U.esp.type);
 let hd='';for(let m=TL0;m<TL1;m+=60)hd+=`<span class="tl-hr" style="left:${(m-TL0)/60*HPX}px">${mt(m)}</span>`;
 const X=m=>(Math.max(m,TL0)-TL0)/60*HPX;const W=(a,b)=>Math.max((Math.min(b,TL1)-Math.max(a,TL0))/60*HPX-2,6);

function validateRes(r,selfId){const R=Rs(r.resourceId);const s=tm(r.start),e=s+Number(r.duration);const c=[];
 c.push({ok:!!R&&R.active,t:'El recurso está activo'});
 c.push({ok:!!R&&s>=tm(R.start)&&e<=tm(R.end),t:`Dentro del horario permitido${R?` (${R.start} a ${R.end})`:''}`});
 const other=S.reservations.find(x=>x.id!==selfId&&x.status==='Programada'&&x.resourceId===r.resourceId&&x.date===r.date&&overlap(s,e,tm(x.start),tm(x.start)+x.duration));
 c.push({ok:!other,t:other?`Ya existe una reservación: ${other.start} ${other.procedure}`:'Sin otra reservación en ese horario'});
 const bl=blocksOn('resource',r.resourceId,r.date).find(b=>overlap(s,e,tm(b.start),tm(b.end)));c.push({ok:!bl,t:bl?`Bloqueado por ${bl.type.toLowerCase()} (${bl.start} a ${bl.end})`:'Sin bloqueos del recurso'});
 const sh=R&&(R.type==='Consultorio')?S.doctors.find(d=>d.room===R.id&&works(d,r.date)&&overlap(s,e,tm(d.start),tm(d.end))&&d.id!==r.doctorId):null;c.push({ok:!sh,t:sh?`El consultorio está asignado a la consulta de ${sh.name}`:'Sin conflicto con consultas asignadas al espacio'});
 if(r.doctorId){const d=D(r.doctorId);const ap=S.appts.find(a=>a.doctorId===d.id&&a.date===r.date&&isActive(a)&&overlap(s,e,tm(a.time),tm(a.time)+d.dur));const ob=blocksOn('doctor',d.id,r.date).find(b=>overlap(s,e,tm(b.start),tm(b.end))&&!['Procedimiento'].includes(b.type));const orr=S.reservations.find(x=>x.id!==selfId&&x.status==='Programada'&&x.doctorId===d.id&&x.date===r.date&&overlap(s,e,tm(x.start),tm(x.start)+x.duration));
  c.push({ok:!ap&&!ob&&!orr,t:ap?`${d.name} tiene consulta a las ${ap.time}`:ob?`${d.name} tiene bloqueo: ${ob.type}`:orr?`${d.name} está en otra reservación (${orr.start})`:`${d.name} está disponible`})}
 return c}

  <div class="pc stack" style="gap:10px"><div class="row" style="justify-content:space-between"><b>Historia clínica</b>${hcChip(a.hcStatus)}</div><p class="small muted">${esc(fm.name)}. ${ver.sections.length} secciones, toma unos 8 minutos. Puede guardar y continuar después.</p><div class="prog"><i style="width:${prog}%"></i></div><span class="small muted">${prog}% completado</span>
  ${a.hcStatus==='Requiere actualización'&&a.updReq?`<div class="note warn small">Su médico solicita: ${esc(a.updReq)}</div>`:''}
  <button class="btn ${ro?'':'primary'}" style="justify-content:center" onclick="U.portal.screen='${ro?'review':'form'}';U.portal.step=0;render()">${ro?'Ver información enviada':a.hcStatus==='Pendiente'&&!prog?'Comenzar':a.hcStatus==='Requiere actualización'?'Actualizar información':'Continuar'}</button></div></div>`}
 if(sc==='review'){const ro=['Completado','Revisado'].includes(a.hcStatus);const miss=[];ver.sections.forEach((s,si)=>s.fields.forEach(f=>{if(f.mode==='required'&&!isAnswered(f,a.hcData[f.id]??(f.prefill?prefillVal(f,p):undefined),a))miss.push({si,f})}));

  <div class="ph-foot">${ro?`<button class="btn" onclick="U.portal.screen='home';render()">Volver</button>`:`<button class="btn" onclick="U.portal.screen='form';U.portal.step=${ver.sections.length-1};render()">Atrás</button><button class="btn primary" ${miss.length?'disabled':''} onclick="A.ptSubmit('${a.id}')">Enviar historia clínica</button>`}</div>`}

}
function fieldHTML(f,v,a,preview){const ro=f.mode==='readonly';const req=f.mode==='required';const nm='f_'+f.id;const dis=ro?'disabled':'';

  case 'scale':{const cur=v===undefined||v===''?'':Number(v);h=`<input type="hidden" data-in value="${cur}"><div class="scale">${[...Array(11)].map((_,i)=>`<button type="button" class="${cur===i?'on':''}" style="${cur===i?`background:hsl(${120-i*12} 55% 42%)`:''}" onclick="A.pfScale(this,${i})" aria-label="${i}">${i}</button>`).join('')}</div><div class="row small muted" style="justify-content:space-between"><span>Sin dolor</span><span>Máximo</span></div>`;break}

  case 'files':case 'photo':{const fl=a?a.files.filter(x=>x.fieldId===f.id):[];h=`<div class="filelist">${fl.map(x=>`<div>${ic('file',15)}<span>${esc(x.name)}</span><small class="muted">${x.size} KB</small>${preview?'':`<button type="button" class="icon-btn" onclick="A.pfDelFile('${a.id}','${x.id}')" aria-label="Quitar">${ic('x',14)}</button>`}</div>`).join('')}</div>${preview?'<input type="file" disabled>':`<label class="btn sm" style="justify-self:start">${ic('plus',14)}${f.type==='photo'?'Tomar o elegir foto':'Adjuntar archivo'}<input type="file" ${f.type==='photo'?'accept="image/*"':'accept="image/*,.pdf"'} multiple hidden onchange="A.pfUpload(this,'${a.id}','${f.id}')"></label>`}<span class="small muted">PDF o imagen, máximo 10 MB.</span>`;break}

A.pfScale=(b,i)=>{const pf=b.closest('.pf');pf.querySelector('[data-in]').value=i;pf.querySelectorAll('.scale button').forEach((x,j)=>{x.classList.toggle('on',j===i);x.style.background=j===i?`hsl(${120-j*12} 55% 42%)`:''})};

function initSig(){document.querySelectorAll('canvas[data-sig]').forEach(c=>{const ctx=c.getContext('2d');const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink')||'#13262D';ctx.strokeStyle='#13262D';ctx.lineWidth=3;ctx.lineCap='round';c.style.background='#fff';
 const hv=c.parentNode.querySelector('[data-sigval]');if(hv){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=hv.value}
 let dn=false;const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};

  case 'signature':{const c=el.querySelector('canvas');if(c.dataset.drawn)v=c.toDataURL('image/png');else if(c.dataset.cleared)v=undefined;else v=a.hcData[id];break}

 if(v===undefined||v==='')delete a.hcData[id];else a.hcData[id]=v})}

 a.hcStatus='Completado';a.hcAt=stamp();a.updReq='';hist(a,`Historia clínica enviada por el paciente (${Fm(a.formId).name} v${a.formV})`);log('Historia clínica completada',`${p.name}, formato v${a.formV}, ${a.files.length} archivos`);U.portal.screen='done';render();toast('Recepción y el médico ya pueden ver la información')};
A.ptConfirm=id=>{const a=Ap(id);a.confirmed=true;if(a.status==='Agendada')a.status='Confirmada';hist(a,'El paciente confirmó su asistencia desde el enlace');log('Confirmación del paciente',pname(a.patientId));S.notifs.push(mkNotif(a,'confirmacion','Sistema','Leído'));render();toast('Asistencia confirmada')};
A.ptReuse=(id,mode)=>{const a=Ap(id);a.prevAsked=true;if(mode!=='new'){const pr=prevHC(a);const ver=verOf(a.formId,a.formV);const ids=new Set();ver.sections.forEach(s=>s.fields.forEach(f=>ids.add(f.id)));Object.keys(pr.hcData).forEach(k=>{if(ids.has(k)&&!['motivo','padec','privacidad','firma'].includes(k))a.hcData[k]=JSON.parse(JSON.stringify(pr.hcData[k]))});a.hcStatus='En proceso';hist(a,`Paciente ${mode==='keep'?'confirmó como vigente':'reutilizó y modificará'} su información del ${fmtDS(pr.date)}`);log('Reutilización de historia clínica',`${pname(a.patientId)}: información del ${fmtDS(pr.date)}`)}
 U.portal.screen=mode==='keep'?'review':'form';U.portal.step=0;render();if(mode==='keep')toast('Se cargó su información anterior. Complete el motivo de esta consulta y acepte el aviso de privacidad.')};
A.pfUpload=(inp,id,fid)=>{const a=Ap(id);A.ptSave(id,false);[...inp.files].forEach(file=>{const x={id:uid('A'),name:file.name,size:Math.max(1,Math.round(file.size/1024)),fieldId:fid,at:stamp()};
 if(file.type.startsWith('image/')&&file.size<1.5e6){const r=new FileReader();r.onload=()=>{x.data=r.result;save()};r.readAsDataURL(file)}a.files.push(x);log('Documento adjuntado',`${file.name} de ${pname(a.patientId)}`)});render();toast('Archivo adjuntado')};

const fbForm=()=>Fm(U.fb.id)||S.forms[0];
const fbSecs=f=>f.draft||curV(f).sections;
const fbEdit=()=>{const f=fbForm();if(!f.draft)f.draft=JSON.parse(JSON.stringify(curV(f).sections));return f.draft};
const usedBy=(f,v)=>S.appts.filter(a=>a.formId===f.id&&(!v||a.formV===v)&&a.hcStatus!=='Pendiente').length;
VIEWS.formatos=()=>{const f=fbForm();const cfg=can('config');const secs=fbSecs(f);const dirty=!!f.draft&&JSON.stringify(f.draft)!==JSON.stringify(curV(f).sections);
 const list=`<div class="card fb-list"><header><h3>Formatos</h3>${cfg?`<button class="btn sm" onclick="A.fbNew()">${ic('plus',14)}Nuevo</button>`:''}</header>${S.forms.map(x=>`<button class="${x.id===f.id?'on':''}" onclick="U.fb.id='${x.id}';U.fb.preview=false;render()"><b>${esc(x.name)}</b><span class="muted small">${x.specId?esc(E(x.specId).name):'Todas las especialidades'}, ${esc(x.consultType)}, v${curV(x).v}${x.draft?' (borrador)':''}${x.active?'':' (inactivo)'}</span></button>`).join('')}</div>`;
 let ed;
 if(U.fb.preview){ed=`<div class="card pad" style="background:var(--bg)"><p class="muted small" style="margin-bottom:12px">Vista previa de cómo lo verá el paciente${f.draft?' (incluye cambios sin publicar)':''}.</p>${secs.map(s=>`<div class="pc" style="margin-bottom:12px"><h3 style="margin-bottom:12px">${esc(s.title)}</h3>${s.fields.map(x=>fieldHTML(x,undefined,null,true)).join('')}</div>`).join('')}</div>`}
 else ed=secs.map((s,si)=>`<div class="fb-sec"><header><input value="${esc(s.title)}" ${cfg?'':'disabled'} onchange="A.fbSec(${si},'title',this.value)" aria-label="Título de la sección"><span class="muted small" style="white-space:nowrap">${s.fields.length} campos</span>${cfg?`<button class="icon-btn" onclick="A.fbMoveSec(${si},-1)" aria-label="Subir sección">${ic('up',16)}</button><button class="icon-btn" onclick="A.fbMoveSec(${si},1)" aria-label="Bajar sección">${ic('down',16)}</button><button class="icon-btn" onclick="A.fbDelSec(${si})" aria-label="Eliminar sección">${ic('trash',16)}</button>`:''}</header>
  ${s.fields.map((x,fi)=>`<div class="fb-f"><span class="ix">${fi+1}</span><input value="${esc(x.label)}" ${cfg?'':'disabled'} onchange="A.fbF(${si},${fi},'label',this.value)" aria-label="Etiqueta"><select ${cfg?'':'disabled'} onchange="A.fbF(${si},${fi},'type',this.value)" aria-label="Tipo">${opts(Object.entries(FTYPES).map(([v,l])=>({v,l})),x.type)}</select><select ${cfg?'':'disabled'} onchange="A.fbF(${si},${fi},'mode',this.value)" aria-label="Requisito">${opts([{v:'required',l:'Obligatorio'},{v:'optional',l:'Opcional'},{v:'readonly',l:'Solo lectura'}],x.mode)}</select><div class="tools">${cfg?`<button class="icon-btn" onclick="A.fbMoveF(${si},${fi},-1)" aria-label="Subir">${ic('up',15)}</button><button class="icon-btn" onclick="A.fbMoveF(${si},${fi},1)" aria-label="Bajar">${ic('down',15)}</button><button class="icon-btn" onclick="A.fbDelF(${si},${fi})" aria-label="Eliminar">${ic('trash',15)}</button>`:''}</div>${OPT_TYPES.includes(x.type)?`<div class="opts"><input value="${esc(x.options.join(', '))}" ${cfg?'':'disabled'} placeholder="Opciones separadas por coma" onchange="A.fbF(${si},${fi},'options',this.value)" aria-label="Opciones"></div>`:''}</div>`).join('')}
  ${cfg?`<div style="padding:10px 12px"><button class="btn sm ghost" onclick="A.fbAddF(${si})">${ic('plus',14)}Agregar campo</button></div>`:''}</div>`).join('')+(cfg?`<button class="btn" onclick="A.fbAddSec()">${ic('plus',16)}Agregar sección</button>`:'');
 return `<div class="split" style="grid-template-columns:290px minmax(0,1fr)">${list}<div class="stack"><div class="card pad stack"><div class="grid3" style="grid-template-columns:1.6fr 1fr 1fr"><div class="field"><label for="fb-n">Nombre del formato</label><input id="fb-n" value="${esc(f.name)}" ${cfg?'':'disabled'} onchange="A.fbMeta('name',this.value)"></div><div class="field"><label for="fb-s">Especialidad</label><select id="fb-s" ${cfg?'':'disabled'} onchange="A.fbMeta('specId',this.value)">${specOpts(f.specId,'Todas (formato general)')}</select></div><div class="field"><label for="fb-t">Tipo de consulta</label><select id="fb-t" ${cfg?'':'disabled'} onchange="A.fbMeta('consultType',this.value)">${opts(CTYPES,f.consultType)}</select></div></div>
 <div class="row"><span class="tag">Versión publicada v${curV(f).v}</span>${dirty?'<span class="chip hpen">Cambios sin publicar</span>':''}<label class="chk"><input type="checkbox" ${f.active?'checked':''} ${cfg?'':'disabled'} onchange="A.fbMeta('active',this.checked)">Activo</label><div style="flex:1"></div><div class="seg"><button class="${U.fb.preview?'':'on'}" onclick="U.fb.preview=false;render()">Editar</button><button class="${U.fb.preview?'on':''}" onclick="U.fb.preview=true;render()">Vista previa</button></div>${cfg&&dirty?`<button class="btn ghost" onclick="A.fbDiscard()">Descartar</button><button class="btn primary" onclick="A.fbPublish()">Publicar versión</button>`:''}</div>${!cfg?`<p class="muted small">${ic('lock',13)} Solo el Administrador puede modificar formatos.</p>`:''}</div>
 ${ed}
 <div class="card"><header><h3>Versiones</h3><span class="muted small">Las historias ya contestadas conservan la versión con la que se respondieron.</span></header><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Versión</th><th>Fecha</th><th>Cambios</th><th>Campos</th><th class="num">Historias respondidas</th></tr></thead><tbody>${f.versions.slice().reverse().map(v=>`<tr><td><b>v${v.v}</b>${v===curV(f)?' <span class="tag">vigente</span>':''}</td><td>${fmtDS(v.date)}</td><td>${esc(v.notes)}</td><td>${v.sections.reduce((n,s)=>n+s.fields.length,0)}</td><td class="num">${usedBy(f,v.v)}</td></tr>`).join('')}</tbody></table></div></div></div></div>`};
A.fbMeta=(k,v)=>{const f=fbForm();f[k]=v;log('Formato modificado',`${f.name}: ${k}`);render()};
A.fbSec=(si,k,v)=>{fbEdit()[si][k]=v;render()};
A.fbF=(si,fi,k,v)=>{const x=fbEdit()[si].fields[fi];if(k==='options')v=v.split(',').map(s=>s.trim()).filter(Boolean);x[k]=v;if(k==='type'&&OPT_TYPES.includes(v)&&!x.options.length)x.options=['Opción 1','Opción 2'];render()};
const mv=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]};
A.fbMoveSec=(si,d)=>{mv(fbEdit(),si,d);render()};A.fbMoveF=(si,fi,d)=>{mv(fbEdit()[si].fields,fi,d);render()};

 openModal({title:'Publicar nueva versión',body:`<p>Las citas nuevas usarán esta versión. Las ${usedBy(f)} historias ya respondidas conservarán su versión original.</p><div class="pills"><label><input type="radio" name="pv" value="${ma}.${mi+1}" checked>Cambio menor: v${ma}.${mi+1}</label><label><input type="radio" name="pv" value="${ma+1}.0">Cambio mayor: v${ma+1}.0</label></div><div class="field"><label for="pv-n">Descripción de los cambios</label><input id="pv-n" placeholder="Ej. se agregó pregunta sobre actividad física"></div>`,foot:`<button class="btn ghost" onclick="A.close()">Cancelar</button><button class="btn primary" onclick="A.fbDoPub()">Publicar</button>`})};

VIEWS.catalogos=()=>{const t=U.cat;const cfg=can('config');
 const tabs=`<div class="tabs">${[['esp','Especialidades'],['med','Médicos y horarios'],['rec','Consultorios y espacios'],['pac','Pacientes']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="U.cat='${k}';render()">${l}</button>`).join('')}</div>`;
