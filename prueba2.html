*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1a2332;min-height:100vh}
:root{--blue:#1e40af;--blue-light:#dbeafe;--blue-mid:#3b82f6;--green:#065f46;--green-light:#d1fae5;--red:#991b1b;--red-light:#fee2e2;--amber:#92400e;--amber-light:#fef3c7;--gray:#374151;--gray-light:#f9fafb;--border:#e5e7eb;--shadow:0 1px 3px rgba(0,0,0,.1)}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a5f 0%,#0f2442 100%)}
.login-box{background:#fff;border-radius:12px;padding:2.5rem;width:380px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo h1{font-size:2rem;font-weight:800;color:#1e3a5f;letter-spacing:2px}
.login-logo p{color:#64748b;font-size:.85rem;margin-top:.25rem}
.login-box label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:.4rem;margin-top:1rem}
.login-box input{width:100%;padding:.6rem .9rem;border:1.5px solid #d1d5db;border-radius:8px;font-size:.95rem;outline:none;transition:border-color .2s}
.login-box input:focus{border-color:#1e40af}
.btn-login{width:100%;margin-top:1.5rem;padding:.75rem;background:#1e3a5f;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-login:hover{background:#1e40af}
.profile-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}
.profile-chip{padding:.3rem .75rem;border-radius:20px;font-size:.75rem;cursor:pointer;border:1.5px solid #d1d5db;background:#f9fafb;transition:all .2s;font-weight:500}
.profile-chip:hover,.profile-chip.active{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
.chip-label{font-size:.75rem;color:#64748b;margin-top:.6rem;font-weight:500}

#app{display:none;flex-direction:column;min-height:100vh}
.topbar{background:#1e3a5f;color:#fff;display:flex;align-items:center;padding:0 1.5rem;height:54px;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.topbar-logo{font-size:1.1rem;font-weight:800;letter-spacing:2px;margin-right:2rem}
.topbar-nav{display:flex;gap:.25rem;flex:1}
.nav-btn{padding:.4rem .9rem;border-radius:6px;border:none;background:transparent;color:#94a3b8;cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-btn.active{background:rgba(255,255,255,.15);color:#fff}
.topbar-right{display:flex;align-items:center;gap:.75rem}
.user-badge{display:flex;align-items:center;gap:.5rem;font-size:.82rem}
.user-avatar{width:30px;height:30px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem}
.btn-logout{padding:.3rem .7rem;background:rgba(255,255,255,.1);border:none;color:#94a3b8;border-radius:5px;cursor:pointer;font-size:.78rem}
.btn-logout:hover{color:#fff;background:rgba(255,255,255,.2)}

.main-layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;flex-shrink:0}
.sidebar-section{padding:.75rem .75rem .25rem;font-size:.7rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-top:.5rem}
.sidebar-item{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;margin:.1rem .4rem;border-radius:7px;cursor:pointer;font-size:.83rem;color:#374151;transition:all .2s;position:relative}
.sidebar-item:hover{background:#f1f5f9}
.sidebar-item.active{background:#dbeafe;color:#1e40af;font-weight:600}
.sidebar-badge{margin-left:auto;background:#ef4444;color:#fff;border-radius:10px;padding:.1rem .45rem;font-size:.68rem;font-weight:700}
.content{flex:1;overflow-y:auto;padding:1.25rem}
.page{display:none}
.page.active{display:block}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.page-title{font-size:1.2rem;font-weight:700;color:#1a2332}
.page-sub{font-size:.82rem;color:#64748b;margin-top:.15rem}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.25rem}
.stat-card{background:#fff;border-radius:10px;padding:1rem 1.1rem;border:1px solid #e5e7eb}
.stat-label{font-size:.75rem;color:#64748b;font-weight:500;margin-bottom:.35rem}
.stat-value{font-size:1.6rem;font-weight:700;color:#1a2332}
.stat-sub{font-size:.72rem;color:#64748b;margin-top:.2rem}
.stat-card.blue .stat-value{color:#1e40af}
.stat-card.green .stat-value{color:#065f46}
.stat-card.amber .stat-value{color:#92400e}
.stat-card.red .stat-value{color:#991b1b}

.btn{padding:.45rem 1rem;border-radius:7px;border:none;cursor:pointer;font-size:.83rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:#1e3a5f;color:#fff}
.btn-primary:hover{background:#1e40af}
.btn-success{background:#065f46;color:#fff}
.btn-success:hover{background:#047857}
.btn-danger{background:#991b1b;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-warning{background:#92400e;color:#fff}
.btn-warning:hover{background:#b45309}
.btn-outline{background:#fff;color:#374151;border:1.5px solid #d1d5db}
.btn-outline:hover{background:#f1f5f9}
.btn-sm{padding:.3rem .65rem;font-size:.76rem}
.btn-group{display:flex;gap:.5rem;flex-wrap:wrap}

.card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;overflow:hidden}
.card-header{padding:.85rem 1.1rem;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:.95rem;font-weight:600;color:#1a2332}
.card-body{padding:1.1rem}

table{width:100%;border-collapse:collapse;font-size:.82rem}
thead tr{background:#f8fafc}
th{padding:.65rem .9rem;text-align:left;font-weight:600;color:#64748b;font-size:.76rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1.5px solid #e5e7eb}
td{padding:.65rem .9rem;border-bottom:1px solid #f1f5f9;color:#374151}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}

.badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:12px;font-size:.72rem;font-weight:600}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-green{background:#d1fae5;color:#065f46}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-gray{background:#f3f4f6;color:#374151}
.badge-purple{background:#ede9fe;color:#5b21b6}

.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:.4rem}
.form-label span{color:#ef4444}
.form-input,.form-select,.form-textarea{width:100%;padding:.55rem .85rem;border:1.5px solid #d1d5db;border-radius:7px;font-size:.85rem;outline:none;transition:border-color .2s;background:#fff;color:#1a2332}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#1e40af;box-shadow:0 0 0 3px rgba(30,64,175,.08)}
.form-textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:680px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-header{padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-size:1rem;font-weight:700;color:#1a2332}
.modal-close{width:28px;height:28px;border-radius:50%;border:none;background:#f1f5f9;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:#64748b}
.modal-close:hover{background:#e5e7eb}
.modal-body{padding:1.4rem}
.modal-footer{padding:1rem 1.4rem;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:.6rem;background:#f9fafb}

.alert{padding:.75rem 1rem;border-radius:8px;font-size:.83rem;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.alert-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.alert-warning{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.alert-danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}

.filter-bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;padding:.85rem;background:#fff;border-radius:9px;border:1px solid #e5e7eb}
.filter-bar .form-input,.filter-bar .form-select{padding:.4rem .7rem;font-size:.8rem;width:auto}
.filter-label{font-size:.78rem;font-weight:600;color:#64748b}

.urgency-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:.4rem}
.dot-urgent{background:#ef4444}
.dot-convencional{background:#3b82f6}
.dot-retraso{background:#f59e0b}

.steps{display:flex;gap:0;margin-bottom:1.5rem;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb}
.step{flex:1;padding:.5rem;text-align:center;font-size:.74rem;font-weight:600;background:#f9fafb;color:#64748b;border-right:1px solid #e5e7eb;cursor:pointer}
.step:last-child{border-right:none}
.step.done{background:#d1fae5;color:#065f46}
.step.active{background:#1e3a5f;color:#fff}

.notification-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:#ef4444;border-radius:50%}

.empty-state{text-align:center;padding:3rem;color:#94a3b8}
.empty-icon{font-size:3rem;margin-bottom:.75rem}
.empty-text{font-size:.9rem}

.timeline{border-left:2px solid #e5e7eb;margin-left:1rem;padding-left:1.25rem}
.timeline-item{position:relative;margin-bottom:1rem;padding-bottom:.75rem}
.timeline-dot{position:absolute;left:-1.65rem;top:.2rem;width:10px;height:10px;border-radius:50%;border:2px solid #3b82f6;background:#fff}
.timeline-time{font-size:.72rem;color:#94a3b8;margin-bottom:.2rem}
.timeline-text{font-size:.83rem;color:#374151}
.timeline-user{font-size:.76rem;color:#1e40af;font-weight:600}

.tab-group{display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:1.25rem}
.tab-btn{padding:.55rem 1.1rem;border:none;background:transparent;font-size:.83rem;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn.active{color:#1e40af;border-bottom-color:#1e40af}

.priority-bar{height:4px;border-radius:2px;margin-top:.3rem}
.priority-high{background:#ef4444}
.priority-mid{background:#f59e0b}
.priority-low{background:#10b981}

.search-highlight{background:#fef3c7}

#toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast-msg{background:#1e3a5f;color:#fff;padding:.75rem 1.2rem;border-radius:9px;font-size:.83rem;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:slideIn .3s ease;display:flex;align-items:center;gap:.6rem}
.toast-msg.success{background:#065f46}
.toast-msg.error{background:#991b1b}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

// ===================== LOGIN =====================
document.querySelectorAll('.profile-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.profile-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    selectedProfile = chip.dataset.profile;
    selectedProfileName = chip.dataset.name;
  });
});

function doLogin(){
  const u = document.getElementById('login-user').value;
  const p = document.getElementById('login-pass').value;
  if(!u||!p){showToast('Complete usuario y contraseña','error');return;}
  if(!u.includes('@cofepris.gob.mx') && !u.includes('@')){showToast('Dominio de correo no válido','error');return;}
  STORE.currentUser = {email:u,nombre:selectedProfileName,perfil:selectedProfile};
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  initApp();
  showToast('Bienvenido, '+selectedProfileName,'success');
}

function doLogout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  STORE.currentUser=null;
}

// ===================== APP INIT =====================
function initApp(){
  const u = STORE.currentUser;
  const initials = u.nombre.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  document.getElementById('user-avatar').textContent=initials;
  document.getElementById('user-name-display').textContent=u.nombre;
  document.getElementById('user-profile-badge').textContent=PROFILES[u.perfil].label;
  buildNav();
  buildSidebar();
  const defaultPage = getDefaultPage();
  showPage(defaultPage);
}

function getDefaultPage(){
  const p = STORE.currentUser.perfil;
  const map = {super_usuario:'usuarios',entradas:'gestion_entradas',dictaminador:'dictamen_lista',gerente:'gestion_gerente',subdireccion:'gestion_subdir',direccion:'gestion_dir',salidas:'salidas_lista',archivo:'archivo_lista',sers_pa:'sers_registro',sers:'sers_revision',sers_dj:'sers_analisis',cos:'cos_resoluciones'};
  return map[p]||'dashboard';
}

function buildNav(){
  const nav = document.getElementById('topbar-nav');
  nav.innerHTML='';
  // Common nav items by profile
  const p = STORE.currentUser.perfil;
  const items = [];
  if(['entradas','gerente','subdireccion','direccion','salidas','archivo'].includes(p)) items.push({id:'deds_home',label:'DEDS'});
  if(['sers_pa','sers','sers_dj','cos'].includes(p)) items.push({id:'sers_home',label:'SERS'});
  if(p==='super_usuario') items.push({id:'usuarios',label:'Gestión de Usuarios'});
  items.push({id:'reportes_page',label:'Reportes'});
  items.push({id:'notificaciones_page',label:'🔔 Notificaciones'});
  items.forEach(item=>{
    const btn = document.createElement('button');
    btn.className='nav-btn';
    btn.textContent=item.label;
    btn.onclick=()=>showPage(item.id);
    nav.appendChild(btn);
  });
}

function sidebarSection(label){return`<div class="sidebar-section">${label}</div>`;}
function sidebarItem(page,label,active,badge){

}

// ===================== PAGE ROUTER =====================
function showPage(pageId){
  currentPage=pageId;
  document.querySelectorAll('.sidebar-item').forEach(el=>el.classList.remove('active'));
  document.querySelector(`[data-page="${pageId}"]`)?.classList.add('active');
  const area = document.getElementById('content-area');
  const pages = {
    usuarios: renderUsuarios,
    usuarios_nuevo: ()=>openModalAgregarUsuario(),
    gestion_entradas: renderGestionEntradas,
    gestion_entradas_nuevo: ()=>openModalNuevoDocumento(),
    dictamen_lista: renderDictamenLista,
    dictamen_urgentes: ()=>renderDictamenLista('urgente'),
    gestion_gerente: renderGestionGerente,
    gestion_subdir: renderGestionSubdir,
    gestion_dir: renderGestionDir,
    asignacion_dictaminador: renderAsignacionDictaminador,
    salidas_lista: renderSalidasLista,
    salidas_envio: renderSalidasEnvio,
    salidas_acuses: renderSalidasAcuses,
    archivo_lista: renderArchivoLista,
    archivo_prestamo: renderArchivoPrestamo,
    sers_registro: renderSersRegistro,
    sers_admin_gestion: renderSersAdminGestion,
    sers_revision: renderSersRevision,
    sers_firma: renderSersFirma,
    sers_visita: renderSersVisita,
    sers_analisis: renderSersAnalisis,
    sers_eval: renderSersEval,
    sers_resolucion: renderSersResolucion,
    sers_archivo: renderSersArchivo,
    cos_resoluciones: renderCosResoluciones,
    cos_clausuras: renderCosClausuras,
    cos_firmadas: renderCosFirmadas,
    reportes_page: renderReportes,
    notificaciones_page: renderNotificaciones,
    deds_home: renderGestionEntradas,
    sers_home: renderSersRegistro,
  };
  if(pages[pageId]) area.innerHTML=pages[pageId]()||'';
  else area.innerHTML=`<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-text">Página en construcción</div></div>`;
}

function filtrarUsuarios(){
  const txt=(document.getElementById('filtro-usuario')?.value||'').toLowerCase();
  const pf=document.getElementById('filtro-perfil-u')?.value||'';
  const es=document.getElementById('filtro-estatus-u')?.value||'';
  const rows = STORE.usuarios.filter(u=>
    (!txt||(u.nombre+u.email).toLowerCase().includes(txt))&&
    (!pf||u.perfil===pf)&&
    (!es||u.estatus===es)
  ).map(u=>`<tr>
    <td><strong>${u.id}</strong></td><td>${u.nombre}</td><td style="color:#64748b">${u.email}</td>
    <td><span class="badge ${perfilBadge(u.perfil)}">${PROFILES[u.perfil]?.label||u.perfil}</span></td>
    <td>${u.area}</td>
    <td><span class="badge ${u.estatus==='activo'?'badge-green':'badge-red'}">${u.estatus}</span></td>
    <td><button class="btn btn-outline btn-sm" onclick="openModalEditarUsuario('${u.id}')">✏️ Editar</button>
    <button class="btn btn-danger btn-sm" onclick="confirmarEliminarUsuario('${u.id}')">🗑️</button></td>
  </tr>`).join('');
  document.querySelector('#tabla-usuarios tbody').innerHTML=rows||'<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:2rem">Sin resultados</td></tr>';
}

function perfilBadge(p){
  const m={super_usuario:'badge-purple',entradas:'badge-blue',dictaminador:'badge-amber',gerente:'badge-green',subdireccion:'badge-blue',direccion:'badge-purple',salidas:'badge-gray',archivo:'badge-gray',sers_pa:'badge-amber',sers:'badge-blue',sers_dj:'badge-green',cos:'badge-purple'};
  return m[p]||'badge-gray';
}

function openModalAgregarUsuario(){
  openModal('Agregar Nuevo Usuario',`

    <div class="form-row">
      <div class="form-group"><label class="form-label">Perfil <span>*</span></label>
        <select class="form-select" id="nu-perfil">
          ${Object.entries(PROFILES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Área <span>*</span></label><input class="form-input" id="nu-area" placeholder="DEDS, SERS, COS..."></div>
    </div>
    <div class="form-row">

    const id='U'+String(STORE.usuarios.length+1).padStart(3,'0');

function confirmarEliminarUsuario(id){
  const u=STORE.usuarios.find(x=>x.id===id);if(!u)return;
  openModal('⚠️ Eliminar Usuario',`
    <div class="alert alert-danger">Esta acción archivará al usuario <strong>${u.nombre}</strong>. El registro quedará en el sistema para trazabilidad pero el usuario no podrá acceder.</div>
    <p style="font-size:.85rem;color:#374151">¿Está seguro de que desea continuar?</p>
  `,()=>{
    u.estatus='inactivo';

  },'Confirmar Eliminación','btn-danger');

    <div class="stat-card red"><div class="stat-label">Con retraso</div><div class="stat-value">${docs.filter(d=>d.urgencia==='retraso').length}</div></div>

function renderTablaDocumentos(docs, modo){
  const rows = docs.map(d=>`<tr>
    <td><strong>${d.folio}</strong></td>
    <td>${d.establecimiento}</td>
    <td><span class="badge badge-blue">${d.materia}</span></td>
    <td><span class="urgency-dot dot-${d.urgencia}"></span>${d.urgencia}</td>
    <td><span class="badge ${estatusBadge(d.estatus)}">${d.estatus.replace('_',' ')}</span></td>
    <td style="color:#64748b">${d.fecha}</td>
    <td>${accionesPorModo(d,modo)}</td>
  </tr>`).join('');
  return`<div class="filter-bar">
    <span class="filter-label">Filtrar:</span>
    <input class="form-input" placeholder="Buscar folio o establecimiento..." id="filtro-doc" oninput="filtrarDocumentos('${modo}')">
    <select class="form-select" id="filtro-urgencia" onchange="filtrarDocumentos('${modo}')">
      <option value="">Urgencia</option><option value="urgente">Urgente</option><option value="convencional">Convencional</option><option value="retraso">Con retraso</option>
    </select>
    <select class="form-select" id="filtro-materia" onchange="filtrarDocumentos('${modo}')">
      <option value="">Materia</option><option value="PS">PS - Prod. y Servicios</option><option value="AS">AS - Serv. Salud</option><option value="MS">MS - Insumos Salud</option><option value="SS">SS - Salud Ambiental</option><option value="TS">TS - Tercero Autorizado</option>
    </select>
  </div>
  <div class="card"><div class="card-header"><span class="card-title">Documentos (${docs.length})</span></div>
  <table id="tabla-docs"><thead><tr><th>Folio</th><th>Establecimiento</th><th>Materia</th><th>Urgencia</th><th>Estatus</th><th>Fecha</th><th>Acciones</th></tr></thead>
  <tbody>${rows}</tbody></table></div>`;
}

function filtrarDocumentos(modo){
  const txt=(document.getElementById('filtro-doc')?.value||'').toLowerCase();
  const urg=document.getElementById('filtro-urgencia')?.value||'';
  const mat=document.getElementById('filtro-materia')?.value||'';
  const docs=STORE.documentos.filter(d=>
    (!txt||(d.folio+d.establecimiento).toLowerCase().includes(txt))&&
    (!urg||d.urgencia===urg)&&(!mat||d.materia===mat)
  );
  const rows=docs.map(d=>`<tr>
    <td><strong>${d.folio}</strong></td><td>${d.establecimiento}</td>
    <td><span class="badge badge-blue">${d.materia}</span></td>
    <td><span class="urgency-dot dot-${d.urgencia}"></span>${d.urgencia}</td>
    <td><span class="badge ${estatusBadge(d.estatus)}">${d.estatus.replace('_',' ')}</span></td>
    <td style="color:#64748b">${d.fecha}</td>
    <td>${accionesPorModo(d,modo)}</td>
  </tr>`).join('');
  document.querySelector('#tabla-docs tbody').innerHTML=rows||'<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:2rem">Sin resultados</td></tr>';
}

function accionesPorModo(d,modo){
  let btns='';
  btns+=`<button class="btn btn-outline btn-sm" onclick="verDetalleDoc('${d.id}')">👁️ Ver</button> `;
  if(modo==='entradas'){
    btns+=`<button class="btn btn-outline btn-sm" onclick="openModalEditarDoc('${d.id}')">✏️ Editar</button> `;
    btns+=`<button class="btn btn-primary btn-sm" onclick="openModalPreAsignar('${d.id}')">📤 Pre-Asignar</button>`;
  }else if(modo==='gerente'||modo==='subdir'||modo==='dir'){
    if(d.estatus==='en_gerencia'||d.estatus==='pendiente'){
      btns+=`<button class="btn btn-success btn-sm" onclick="aceptarDoc('${d.id}')">✅ Aceptar</button> `;
      btns+=`<button class="btn btn-danger btn-sm" onclick="rechazarDoc('${d.id}')">❌ Rechazar</button>`;
    }else if(d.estatus==='en_dictamen'){
      btns+=`<button class="btn btn-warning btn-sm" onclick="openModalFirmar('${d.id}')">✍️ Firmar/Rubricar</button>`;
    }
  }else if(modo==='dictamen'){
    if(d.estatus==='en_dictamen'||d.estatus==='pendiente'){
      btns+=`<button class="btn btn-success btn-sm" onclick="openModalDictaminar('${d.id}')">⚖️ Dictaminar</button>`;
    }
  }
  return btns;
}

      }).join('')}
    </div></div>
    <div class="card" style="margin-top:.85rem"><div class="card-header"><span class="card-title">Documentos por Urgencia</span></div><div class="card-body">
      ${[{k:'urgente',label:'Urgentes',color:'#ef4444'},{k:'convencional',label:'Convencionales',color:'#3b82f6'},{k:'retraso',label:'Con Retraso',color:'#f59e0b'}].map(({k,label,color})=>{
        const count=docs.filter(d=>d.urgencia===k).length;
        const pct=docs.length?Math.round(count/docs.length*100):0;
        return`<div style="margin-bottom:.85rem">
          <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:.3rem">
            <span style="color:${color};font-weight:600">${label}</span><span>${count} (${pct}%)</span>
          </div>
          <div style="background:#f1f5f9;border-radius:4px;height:8px">
            <div style="background:${color};width:${pct}%;height:8px;border-radius:4px"></div>
          </div>
        </div>`;
      }).join('')}
    </div></div>
  </div>
  <div id="rpt-sers" style="display:none">
    <div class="stats-row">
      <div class="stat-card blue"><div class="stat-label">Total Expedientes</div><div class="stat-value">${exps.length}</div></div>
      <div class="stat-card amber"><div class="stat-label">En Revisión</div><div class="stat-value">${exps.filter(e=>e.estatus==='en_revision').length}</div></div>
      <div class="stat-card green"><div class="stat-label">Resueltos</div><div class="stat-value">${exps.filter(e=>e.estatus==='resuelto').length}</div></div>
      <div class="stat-card red"><div class="stat-label">Devueltos</div><div class="stat-value">${exps.filter(e=>e.estatus==='devuelto').length}</div></div>
    </div>
    <div class="card"><div class="card-header"><span class="card-title">Expedientes por Materia</span></div><div class="card-body">
      ${['PS','AS','MS','P'].map(m=>{
        const count=exps.filter(e=>e.materia===m).length;
        const pct=exps.length?Math.round(count/exps.length*100):0;
        return`<div style="margin-bottom:.85rem"><div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:.3rem">
          <span><span class="badge badge-purple">${m}</span></span><span>${count} (${pct}%)</span></div>
          <div style="background:#f1f5f9;border-radius:4px;height:8px"><div style="background:#7c3aed;width:${pct}%;height:8px;border-radius:4px"></div></div>
        </div>`;
      }).join('')}
    </div></div>
    <div class="card" style="margin-top:.85rem"><div class="card-header"><span class="card-title">Resoluciones</span></div><div class="card-body">
      <div class="stats-row" style="margin-bottom:0">
        <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${STORE.resoluciones.length}</div></div>
        <div class="stat-card green"><div class="stat-label">Firmadas</div><div class="stat-value">${STORE.resoluciones.filter(r=>r.firmado).length}</div></div>
        <div class="stat-card amber"><div class="stat-label">Pendientes</div><div class="stat-value">${STORE.resoluciones.filter(r=>!r.firmado).length}</div></div>
        <div class="stat-card red"><div class="stat-label">Clausuras</div><div class="stat-value">${STORE.resoluciones.filter(r=>r.procederClausura).length}</div></div>
      </div>
    </div></div>
  </div>
  <div id="rpt-usuarios" style="display:none">
    <div class="stats-row">
      <div class="stat-card blue"><div class="stat-label">Total Usuarios</div><div class="stat-value">${STORE.usuarios.length}</div></div>
      <div class="stat-card green"><div class="stat-label">Activos</div><div class="stat-value">${STORE.usuarios.filter(u=>u.estatus==='activo').length}</div></div>
      <div class="stat-card red"><div class="stat-label">Inactivos</div><div class="stat-value">${STORE.usuarios.filter(u=>u.estatus==='inactivo').length}</div></div>
    </div>
    <div class="card"><div class="card-header"><span class="card-title">Usuarios por Perfil</span></div><div class="card-body">
      ${Object.entries(PROFILES).map(([k,v])=>{
        const count=STORE.usuarios.filter(u=>u.perfil===k).length;
        return count?`<div style="display:flex;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid #f1f5f9;font-size:.83rem">
          <span>${v.label}</span><span class="badge badge-blue">${count}</span></div>`:'';
      }).join('')}
    </div></div>
  </div>`;
}

// --- NOTIFICACIONES ---
function renderNotificaciones(){
  return`<div class="page-header"><div class="page-title">Notificaciones</div></div>
  <div class="card card-body">
  ${STORE.notificaciones.map(n=>`
    <div style="display:flex;align-items:center;gap:.75rem;padding:.75rem;border-bottom:1px solid #f1f5f9;${!n.leido?'background:#f0f9ff':''}">
      <div style="width:8px;height:8px;border-radius:50%;background:${!n.leido?'#3b82f6':'transparent'};flex-shrink:0"></div>
      <div style="flex:1">
        <p style="font-size:.84rem;${!n.leido?'font-weight:600':''}color:#374151">${n.texto}</p>
        <p style="font-size:.73rem;color:#94a3b8">${n.fecha}</p>
      </div>
      ${!n.leido?`<button class="btn btn-outline btn-sm" onclick="marcarLeido('${n.id}')">Marcar leído</button>`:''}
    </div>
  `).join('')}
  <div style="padding:.75rem;text-align:center">
    <button class="btn btn-outline" onclick="marcarTodosLeidos()">✅ Marcar todas como leídas</button>
  </div>
  </div>`;
}

function marcarLeido(id){
  const n=STORE.notificaciones.find(x=>x.id===id);
  if(n) n.leido=true;
  showPage('notificaciones_page');
}
function marcarTodosLeidos(){
  STORE.notificaciones.forEach(n=>n.leido=true);
  showPage('notificaciones_page');showToast('Todas marcadas como leídas','success');
}

// ===================== HELPERS =====================
function switchTab(btn,tabId){
  const parent=btn.parentElement;
  parent.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const container=btn.closest('.page')||document.getElementById('content-area');
  container.querySelectorAll('[id^="tab-"],[id^="cos-tab-"],[id^="rpt-"]').forEach(t=>t.style.display='none');
  const el=document.getElementById(tabId);
  if(el) el.style.display='block';
}

function openModal(title, body, onConfirm, confirmLabel='Confirmar', confirmClass='btn-primary'){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  const footer=document.getElementById('modal-footer');
  footer.innerHTML='';
  const cancelBtn=document.createElement('button');
  cancelBtn.className='btn btn-outline';cancelBtn.textContent='Cancelar';
  cancelBtn.onclick=closeModal;footer.appendChild(cancelBtn);
  if(onConfirm&&onConfirm!=''){
    const confBtn=document.createElement('button');
    confBtn.className=`btn ${confirmClass}`;confBtn.textContent=confirmLabel;
    confBtn.onclick=onConfirm;footer.appendChild(confBtn);
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function closeModalOnOverlay(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function showToast(msg,type=''){
  const container=document.getElementById('toast');
  const el=document.createElement('div');
  el.className=`toast-msg ${type}`;
  el.innerHTML=(type==='success'?'✅ ':type==='error'?'❌ ':'ℹ️ ')+msg;
  container.appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

// Boot
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login-screen').style.display!=='none')doLogin();});
</script>
