<style>
/* Layout: fondo blanco, navbar superior con módulos e íconos, área de trabajo a lo ancho; la app del agremiado en marco de celular. */
:root {
  /* Paleta del logo SIGO: azul marino del texto + la red multicolor */
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f3f7fb;
  --line: #e1e8f0;
  --ink: #0c2742;
  --ink-2: #45597a;
  --ink-3: #7b8ba3;
  --brand: #0f3b63;
  --brand-2: #18a3a0;
  --brand-ink: #ffffff;
  --brand-soft: #e4f1f8;
  --azul: #2a7fc4;
  --teal: #18a3a0;
  --verde: #6fae3e;
  --amarillo: #f2b632;
  --naranja: #ee8a2c;
  --grad: linear-gradient(135deg, #0f3b63 0%, #1f6fae 55%, #18a3a0 100%);
  --grad-logo: linear-gradient(90deg, #2a7fc4, #18a3a0, #6fae3e, #f2b632, #ee8a2c);
  --signal: #ee8a2c;
  --signal-soft: #fdf0e2;
  --ok: #2f9d58; --ok-soft: #e3f5e9;
  --warn: #c98a06; --warn-soft: #fdf3d6;
  --bad: #d64545; --bad-soft: #fde7e7;
  --shadow: 0 1px 2px rgba(12,39,66,.05), 0 8px 24px rgba(12,39,66,.06);
  --shadow-up: 0 6px 14px rgba(12,39,66,.08), 0 18px 40px rgba(12,39,66,.12);
  --font-display: "Montserrat", "Segoe UI", Arial, sans-serif;
  --font-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--font-display); font-stretch: 85%; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; vertical-align: -3px; }

/* ---------- Animaciones (sin ocultar contenido: solo movimiento) ---------- */
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
@keyframes pop { from { transform: scale(.96); } to { transform: none; } }
@keyframes slideIn { from { transform: translateX(40px); } to { transform: none; } }
@keyframes toastIn { from { transform: translateY(16px); } to { transform: none; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--signal) 55%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
@keyframes flash { from { background: var(--brand-soft); } to { background: transparent; } }
.anim > * { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
.anim > *:nth-child(2) { animation-delay: .05s; } .anim > *:nth-child(3) { animation-delay: .1s; } .anim > *:nth-child(4) { animation-delay: .15s; } .anim > *:nth-child(5) { animation-delay: .2s; }
.kpi { animation: pop .4s ease both; }
.kpi:nth-child(2) { animation-delay: .06s; } .kpi:nth-child(3) { animation-delay: .12s; } .kpi:nth-child(4) { animation-delay: .18s; }
.nuevo td, .nuevo.card, .tl.nuevo { animation: flash 1.8s ease; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Sidebar + barra superior ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; padding-block: 16px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; z-index: 35; }
.logo-sigo { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 4px 14px; border-bottom: 1px solid var(--line); }
.logo-sigo img { width: 128px; height: auto; max-width: 100%; animation: pop .5s ease both; }
.logo-sigo .org { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.logo-sigo .org svg.lucide { color: var(--brand); }
.logo-sigo .org b { display: block; font-size: 12px; line-height: 1.2; }
.logo-sigo .org small { font-size: 11px; color: var(--ink-3); }
.phone-top .app-logo { height: 34px; width: auto; background: #fff; border-radius: 8px; padding: 3px 6px; align-self: flex-start; margin-bottom: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding: 12px 10px 4px; font-weight: 600; }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 11px; border: 0; background: transparent; color: var(--ink-2); border-radius: 10px; text-align: left; font-weight: 600; font-size: 13.5px; transition: background .15s, color .15s, transform .15s; }
.nav button svg.lucide { width: 18px; height: 18px; color: var(--ink-3); transition: color .15s; }
.nav button:hover { background: var(--surface-2); color: var(--brand); }
.nav button:hover svg.lucide { color: var(--brand); }
.nav button[aria-current="page"] { background: var(--brand); color: #fff; box-shadow: 0 6px 14px color-mix(in srgb, var(--brand) 30%, transparent); }
.nav button[aria-current="page"] svg.lucide { color: #fff; }
.nav .badge-n { margin-left: auto; font-size: 10.5px; background: var(--signal); color: #fff; border-radius: 999px; padding: 0 7px; line-height: 18px; }
.side-foot { margin-top: auto; font-size: 11px; color: var(--ink-3); padding: 12px 8px 0; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.topbar-in .crumb { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; min-width: 0; }
.topbar-in .crumb b { color: var(--ink); }
.side-back { display: none; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-stretch: 75%; font-size: 15px; letter-spacing: .02em; flex-shrink: 0; box-shadow: inset 0 -4px 0 var(--signal); }
.brand b { display: block; font-family: var(--font-display); font-stretch: 80%; font-size: 16px; line-height: 1.1; }
.brand small { font-size: 11.5px; color: var(--ink-3); }
.top-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.as { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 4px 4px 10px; font-size: 12px; color: var(--ink-2); background: var(--surface); }
.as select { border: 0; background: var(--surface-2); border-radius: 7px; padding: 5px 8px; font-weight: 600; color: var(--ink); max-width: 210px; }
.me { display: flex; align-items: center; gap: 8px; }
.me small { display: block; color: var(--ink-3); font-size: 11px; line-height: 1.1; }
.me b { font-size: 13px; line-height: 1.2; }
.btn.menu-btn { display: none; }

/* ---------- Página ---------- */
.page { width: 100%; max-width: 1400px; margin: 0 auto; padding-block: 22px 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.page-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-h h1 { font-size: 26px; font-weight: 750; display: flex; align-items: center; gap: 10px; }
.page-h h1 svg.lucide { width: 24px; height: 24px; color: var(--brand); }
.page-h p { margin: 2px 0 0; color: var(--ink-3); }
.demo-note { font-size: 12px; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; margin: 0; }
.demo-note svg.lucide { color: var(--signal); width: 14px; height: 14px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.panel-h h2 svg.lucide { color: var(--brand); }
.panel-h .sub { font-size: 12px; color: var(--ink-3); }
.panel-h .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.panel-b { padding: 16px; }
.grid { display: grid; gap: 18px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
.kpi .k-ico { grid-row: 1 / 4; grid-column: 2; width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.kpi .k-ico svg.lucide { width: 20px; height: 20px; }
.kpi.alert .k-ico { background: var(--signal-soft); color: var(--signal); }
.kpi span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.kpi b { font-family: var(--font-display); font-stretch: 80%; font-size: 30px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi small { font-size: 12px; color: var(--ink-2); }
.kpi small.up { color: var(--ok); }
.chart-box { position: relative; height: 270px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 7px 12px; font-weight: 600; font-size: 13px; transition: transform .12s, border-color .15s, color .15s, filter .15s; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.1); color: var(--brand-ink); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill svg.lucide { width: 12px; height: 12px; vertical-align: 0; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }

/* Sello de trazabilidad: usuario · fecha · hora */
.traza { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); line-height: 1.3; }
.traza svg.lucide { width: 12px; height: 12px; vertical-align: 0; }
.traza b { color: var(--ink-2); font-weight: 600; }
.traza time { font-family: var(--font-mono); font-size: 11px; background: var(--surface-2); border-radius: 5px; padding: 0 5px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; transition: background .15s; }
tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }

.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; flex-shrink: 0; }
.avatar svg.lucide { width: 18px; height: 18px; }
.person b { display: block; font-weight: 600; }
.person small { color: var(--ink-3); font-size: 12px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); outline: none; }
.field textarea { resize: vertical; min-height: 64px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.search-wrap { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
.search-wrap svg.lucide { position: absolute; left: 9px; color: var(--ink-3); }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; min-width: 0; width: 240px; max-width: 100%; }
.search-wrap .search { padding-left: 30px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: 0 12px; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; transition: color .15s; }
.tabs button:hover { color: var(--brand); }
.tabs button[aria-selected="true"] { color: var(--brand); border-color: var(--brand); }

.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; margin: 0; }
.dl div { min-width: 0; }
.dl dt { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.dl dt svg.lucide { width: 12px; height: 12px; }
.dl dd { margin: 2px 0 0; font-weight: 500; word-break: break-word; }

.toast { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 11px 14px; border-radius: 11px; font-size: 13px; box-shadow: var(--shadow-up); z-index: 60; max-width: min(400px, calc(100vw - 36px)); display: flex; gap: 10px; align-items: flex-start; animation: toastIn .3s ease both; }
.toast svg.lucide { color: #6ee7b7; margin-top: 2px; }
.toast small { display: block; color: #b6c3cc; font-size: 11.5px; }

/* Credencial */
.gafete { border-radius: 14px; overflow: hidden; background: var(--grad); color: #fff; padding: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; position: relative; animation: pop .45s ease both; }
.gafete::after { content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; border-radius: 50%; border: 18px solid rgba(255,255,255,.07); }
.gafete .foto { width: 72px; height: 88px; border-radius: 8px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-family: var(--font-display); font-size: 26px; font-weight: 800; }
.gafete b { font-family: var(--font-display); font-stretch: 85%; font-size: 18px; display: block; line-height: 1.15; }
.gafete .meta { font-size: 11.5px; opacity: .88; display: grid; gap: 1px; margin-top: 6px; }
.gafete .folio { font-family: var(--font-mono); font-size: 12px; background: rgba(0,0,0,.22); padding: 2px 7px; border-radius: 5px; display: inline-block; margin-top: 6px; }

/* Árbol */
.tree { list-style: none; margin: 0; padding: 0; }
.tree ul { list-style: none; margin: 0 0 0 16px; padding-left: 26px; border-left: 1px dashed var(--line); }
.tree ul > li { animation: rise .3s ease both; }
.node { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 8px; flex-wrap: wrap; transition: background .15s; }
.node:hover { background: var(--surface-2); }
.node .tog { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--ink-2); }
.node .tog svg.lucide { width: 14px; height: 14px; transition: transform .2s; }
.node .tog[aria-expanded="true"] svg.lucide { transform: rotate(90deg); }
.node .tog.leaf { visibility: hidden; }
.node .name { font-weight: 600; background: none; border: 0; padding: 0; text-align: left; }
.node .name:hover { color: var(--brand); text-decoration: underline; }

/* Tienda */
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.prod { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; text-align: left; padding: 0; transition: transform .2s, box-shadow .2s, border-color .2s; }
.prod:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: var(--brand); }
.prod .ph { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; color: #fff; position: relative; overflow: hidden; }
.prod .ph svg.lucide { width: 42px; height: 42px; stroke-width: 1.6; transition: transform .3s; }
.prod:hover .ph svg.lucide { transform: scale(1.12) rotate(-4deg); }
.prod .ph::after { content: ""; position: absolute; inset: auto -20% -60% auto; width: 70%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.12); }
.prod .pb { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.prod .pb b { font-weight: 650; }
.stock-bar { height: 6px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
.stock-bar i { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 99px; transition: width .8s cubic-bezier(.2,.7,.2,1); }
.stock-bar i.low { background: var(--bad); }
.stock-bar u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--warn); }

.evid { display: flex; gap: 6px; flex-wrap: wrap; }
.evid span, .evid img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: grid; place-items: center; color: #fff; }
.evid span svg.lucide { width: 18px; height: 18px; }

.perm td select { border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; background: var(--surface); font-size: 12px; }
.perm td select.n { color: var(--ink-3); }
.perm td select.v { color: var(--brand); }
.perm td select.e { color: var(--warn); }
.perm td select.t { color: var(--ok); font-weight: 700; }

/* Mapa */
.mapa { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.mapa svg.base { width: 100%; height: 100%; display: block; }
.pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; transition: left 2.6s ease-in-out, top 2.6s ease-in-out; }
.pin b { background: var(--ink); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.pin i { width: 14px; height: 14px; border-radius: 50%; background: var(--signal); border: 3px solid #fff; margin-top: 3px; animation: pulse 1.6s ease-out infinite; }

/* App del agremiado */
.phone-stage { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; align-items: start; }
.phone { width: 100%; max-width: 380px; border-radius: 38px; border: 10px solid #0b1215; background: var(--surface-2); box-shadow: var(--shadow-up); overflow: hidden; display: flex; flex-direction: column; height: 720px; max-height: 82vh; min-height: 560px; }
.phone-top { background: var(--grad); color: #fff; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 2px; }
.phone-top small { opacity: .8; font-size: 11px; }
.phone-top b { font-family: var(--font-display); font-stretch: 85%; font-size: 19px; }
.phone-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.phone-nav { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); }
.phone-nav button { border: 0; background: transparent; padding: 9px 2px 11px; font-size: 10.5px; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color .15s; }
.phone-nav button svg.lucide { width: 20px; height: 20px; transition: transform .2s; }
.phone-nav button[aria-current="page"] { color: var(--brand); font-weight: 700; }
.phone-nav button[aria-current="page"] svg.lucide { transform: translateY(-2px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card > b { display: flex; align-items: center; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line); border: 0; flex-shrink: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.progress { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); border-radius: 99px; transition: width .9s cubic-bezier(.2,.7,.2,1); }

.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 10px 6px; border-bottom: 1px solid var(--line); border-radius: 8px; }
.tl:last-child { border-bottom: 0; }
.tl .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }

/* Modales centrados */
@keyframes modalIn { from { transform: translateY(18px) scale(.97); } to { transform: none; } }
@keyframes fadeBg { from { background: rgba(5,15,18,0); } to { background: rgba(5,15,18,.45); } }
.drawer-back { position: fixed; inset: 0; background: rgba(5,15,18,.45); z-index: 40; display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadeBg .2s ease both; backdrop-filter: blur(2px); }
.drawer { width: min(640px, 100%); max-height: 100%; background: var(--surface); border-radius: 18px; overflow-y: auto; padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 16px; animation: modalIn .28s cubic-bezier(.2,.7,.2,1) both; box-shadow: 0 24px 60px rgba(5,15,18,.28); }
.drawer-h { display: flex; gap: 12px; align-items: start; position: sticky; top: -22px; background: var(--surface); padding: 22px 0 12px; margin-top: -22px; z-index: 2; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 21px; }
.drawer-h .x { margin-left: auto; }
.empty { padding: 26px; text-align: center; color: var(--ink-3); }

/* Formularios en panel lateral */
.drawer.wide { width: min(860px, 100%); }
.fsec { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.fsec:last-of-type { border-bottom: 0; }
.fsec h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--ink); }
.fsec h3 svg.lucide { color: var(--brand); }
.fsec h3 small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--ink-3); }
.form-grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.req { color: var(--signal); }
.field .err { color: var(--bad); font-size: 11.5px; font-weight: 600; display: none; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--bad); background: var(--bad-soft); }
.field.invalid .err { display: block; }
.field .hint { font-size: 11.5px; color: var(--ink-3); }
.upl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

// Tarjetas de alerta que encabezan el panel de control.
function atencion(adeudos, bajos, activos) {
  const sinDocs = activos.filter((p) => !p.foto || !p.ineF || !p.ineR);
  const porCobrar = adeudos.reduce((t, p) => t + p.adeudo * CUOTA, 0);
  const total = adeudos.length + bajos.length + sinDocs.length;
  const mas = (lista, n) => lista.length > n ? `<li class="muted">y ${lista.length - n} más…</li>` : '';
  const tarjetas = [];
  if (adeudos.length) tarjetas.push(`<article class="alerta">
    <div class="alerta-top"><span class="alerta-ico">${ico('wallet')}</span><div><b>Cuotas pendientes</b><small>${money(porCobrar)} por cobrar</small></div><span class="alerta-num">${adeudos.length}</span></div>
    <ul>${adeudos.sort((a, b) => b.adeudo - a.adeudo).slice(0, 3).map((p) => `<li>${personaCell(p, `${p.adeudo} ${p.adeudo === 1 ? 'mes' : 'meses'} · ${money(p.adeudo * CUOTA)}`)}${puede('cuotas') ? `<button class="btn sm" data-pago="${p.id}">${ico('receipt')}Cobrar</button>` : ''}</li>`).join('')}${mas(adeudos, 3)}</ul>
    <button class="btn btn-alerta" data-go="cuotas">${ico('arrow-right')}Ir a cuotas</button></article>`);
  if (bajos.length) tarjetas.push(`<article class="alerta naranja">
    <div class="alerta-top"><span class="alerta-ico">${ico('package-x')}</span><div><b>Inventario bajo el mínimo</b><small>Reabastece antes de que se agote</small></div><span class="alerta-num">${bajos.length}</span></div>
    <ul>${bajos.slice(0, 3).map((b) => `<li><div class="person"><span class="avatar" style="background:${b.color};width:30px;height:30px">${ico(b.ico)}</span><div><b>${esc(b.nombre)}</b><small>Quedan ${b.stock} · mínimo ${b.min}</small></div></div>${puede('tienda') ? `<button class="btn sm" data-reab="${b.id}">${ico('truck')}Pedir ${b.max - b.stock}</button>` : ''}</li>`).join('')}${mas(bajos, 3)}</ul>
    <button class="btn btn-alerta" data-go="tienda">${ico('arrow-right')}Ir a la tienda</button></article>`);
  if (sinDocs.length) tarjetas.push(`<article class="alerta azul">
    <div class="alerta-top"><span class="alerta-ico">${ico('file-warning')}</span><div><b>Expedientes incompletos</b><small>Falta foto o INE escaneada</small></div><span class="alerta-num">${sinDocs.length}</span></div>
    <ul>${sinDocs.slice(0, 3).map((p) => `<li>${personaCell(p, [!p.foto && 'foto', !p.ineF && 'INE frente', !p.ineR && 'INE reverso'].filter(Boolean).join(', '))}${puede('agremiados') ? `<button class="btn sm" data-editar="${p.id}">${ico('upload')}Completar</button>` : ''}</li>`).join('')}${mas(sinDocs, 3)}</ul>
    <button class="btn btn-alerta" data-go="agremiados">${ico('arrow-right')}Ir al padrón</button></article>`);
  return `<section style="display:flex;flex-direction:column;gap:12px">
    <div class="aten-h"><h2>${ico('siren')}Requieren atención</h2>${total ? `<span class="cnt">${total}</span>` : ''}</div>
    <div class="alertas">${tarjetas.join('') || `<article class="alerta verde"><div class="alerta-top"><span class="alerta-ico">${ico('circle-check')}</span><div><b>Todo en orden</b><small>No hay pendientes por atender.</small></div></div></article>`}</div></section>`;
}

function guardarPerfil() {
  const ok = validar([['rNom', (v) => !v ? requerido(v) : ROLES.some((x) => x.nombre.toLowerCase() === v.toLowerCase()) ? 'Ya existe un perfil con ese nombre.' : '']]);
  if (!ok) return;
  const id = 'r' + Date.now(); const base = val('rBase');
  ROLES.push({ id, nombre: val('rNom'), desc: val('rDesc'), custom: true, mod: stamp() });
  PERMISOS[id] = base ? { ...PERMISOS[base] } : Object.fromEntries(MODULOS.map((m) => [m.id, 'n']));
  log('perfiles', 'Creó perfil', `${val('rNom')}${base ? ' · permisos copiados de ' + rolNombre(base) : ' · sin accesos'}`);
  S.perfilSel = id; $('#layer').innerHTML = ''; renderRoles(); go('perfiles'); toast(`Perfil «${ROLES[ROLES.length - 1].nombre}» creado`);
}

// Marca en rojo los campos con error; regresa true si todo está bien.
function validar(reglas) {
  let primero = null;
  reglas.forEach(([id, fn]) => {
    const el = $('#' + id); if (!el) return;
    const box = el.closest('.field'); const msg = fn(el.value.trim(), el);
    if (box) { box.classList.toggle('invalid', !!msg); box.querySelector('.err').textContent = msg || ''; }
    if (msg && !primero) primero = el;
  });
  if (primero) { primero.focus(); primero.scrollIntoView({ block: 'center', behavior: 'smooth' }); toast('Revisa los campos marcados en rojo.'); }
  return !primero;
}

// Lee una imagen y la reduce para que el prototipo pueda guardarla en el navegador.
function leerImagen(file, max = 520) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('El archivo no es una imagen.'));
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => rej(new Error('No se pudo leer la imagen.')); img.src = r.result;
    };
    r.onerror = () => rej(new Error('No se pudo leer el archivo.')); r.readAsDataURL(file);
  });
}

function guardarAgremiado(form) {
  const id = +form.dataset.id || null; const p0 = id ? per(id) : null;
  const hoy = ahora().slice(0, 10);
  const curpUp = val('fCurp').toUpperCase(), ineUp = val('fIne').toUpperCase();
  const ok = validar([
    ['fNom', requerido], ['fAp', requerido],
    ['fCurp', (v) => !v ? requerido(v) : !/^[A-Z0-9]{18}$/i.test(v) ? 'La CURP debe tener 18 letras y números.' : P.some((x) => x.id !== id && x.curp === curpUp) ? 'Esta CURP ya está registrada en otro agremiado.' : ''],
    ['fNac', (v) => !v ? requerido(v) : v > hoy ? 'La fecha no puede ser futura.' : (+hoy.slice(0, 4) - +v.slice(0, 4)) < 15 ? 'Debe tener al menos 15 años.' : ''],
    ['fIne', (v) => !v ? requerido(v) : !/^[A-Z0-9]{18}$/i.test(v) ? 'La clave de elector tiene 18 letras y números.' : P.some((x) => x.id !== id && x.ineClave === ineUp) ? 'Esta clave de elector ya está registrada.' : ''],
    ['fSecc', (v) => !v ? requerido(v) : !/^\d{1,4}$/.test(v) ? 'Solo números, hasta 4 dígitos.' : ''],
    ['fCalle', requerido], ['fCol', requerido],
    ['fCp', (v) => !v ? requerido(v) : !/^\d{5}$/.test(v) ? 'El código postal tiene 5 dígitos.' : ''],
    ['fLat', (v) => v && (isNaN(+v) || +v < -90 || +v > 90) ? 'Latitud entre -90 y 90.' : ''],
    ['fLng', (v) => v && (isNaN(+v) || +v < -180 || +v > 180) ? 'Longitud entre -180 y 180.' : ''],
    ['fCel', (v) => !v ? requerido(v) : diezDig(v)],
    ['fEmerNom', requerido],
    ['fEmerTel', (v) => !v ? requerido(v) : diezDig(v) || (v.replace(/\D/g, '') === val('fCel').replace(/\D/g, '') ? 'Usa un teléfono distinto al celular del agremiado.' : '')],
    ['fPuesto', requerido],
    ['fPadre', (v) => (p0 && !p0.padre) ? '' : requerido(v)],
    ['fIngreso', (v) => !v ? requerido(v) : v > hoy ? 'La fecha de ingreso no puede ser futura.' : ''],
  ]);
  if (!ok) return;
  const datos = {
    nom: val('fNom'), ap: val('fAp'), am: val('fAm'), nombre: [val('fNom'), val('fAp'), val('fAm')].filter(Boolean).join(' '),
    curp: curpUp, nac: val('fNac'), sexo: val('fSexo'), ine: ineUp, ineClave: ineUp, secc: dig('fSecc').padStart(4, '0'),
    calle: val('fCalle'), col: val('fCol'), cp: dig('fCp'), mun: val('fMun'), edo: val('fEdo'), dom: `${val('fCalle')}, ${val('fCol')}, C.P. ${dig('fCp')}`,
    lat: val('fLat'), lng: val('fLng'), cel: fmtTel(dig('fCel')), emerNom: val('fEmerNom'), emerTel: fmtTel(dig('fEmerTel')), emer: `${val('fEmerNom')} · ${fmtTel(dig('fEmerTel'))}`,
    rol: val('fRol'), puesto: val('fPuesto'), padre: val('fPadre') ? +val('fPadre') : null, ingreso: val('fIngreso'), gps: $('#fGps').checked,
    foto: S.tmp.foto, ineF: S.tmp.ineF, ineR: S.tmp.ineR,
  };
  if (p0) {
    const etq = { nombre: 'nombre', curp: 'CURP', nac: 'nacimiento', ine: 'clave de elector', secc: 'sección', dom: 'domicilio', mun: 'municipio', edo: 'estado', lat: 'ubicación', cel: 'celular', emer: 'emergencia', rol: 'perfil', puesto: 'puesto', padre: 'coordinador', ingreso: 'ingreso', gps: 'GPS', foto: 'foto', ineF: 'INE frente', ineR: 'INE reverso' };
    const cambios = Object.keys(etq).filter((k) => String(p0[k] ?? '') !== String(datos[k] ?? '')).map((k) => etq[k]);
    if (!cambios.length) { $('#layer').innerHTML = ''; toast('No hubo cambios que guardar.'); return; }
    datos.gpsTraza = datos.gps ? (p0.gps ? p0.gpsTraza : stamp()) : null;
    Object.assign(p0, datos, { mod: stamp() });
    log('agremiados', 'Editó agremiado', `${p0.folio} · cambió ${cambios.join(', ')}`);
    S.tabFicha = 'datos'; go(S.vista); ficha(p0.id); toast('Datos actualizados');
  } else {
    const nid = Math.max(...P.map((x) => x.id)) + 1;
    const nfol = Math.max(...P.map((x) => +x.folio.split('-')[1])) + 1;
    const nuevo = { id: nid, folio: 'SUT-' + String(nfol).padStart(4, '0'), adeudo: 0, color: COLORES[nid % COLORES.length], ...datos, alta: stamp(), mod: stamp(), gpsTraza: datos.gps ? stamp() : null };
    P.push(nuevo);
    if (nuevo.padre) S.abiertos.add(nuevo.padre);
    log('agremiados', 'Dio de alta agremiado', `${nuevo.folio} · ${nuevo.nombre} · coordinador: ${per(nuevo.padre)?.nombre || '—'}`);
    $('#layer').innerHTML = ''; S.buscar = ''; go('agremiados');
    S.nuevo = 'ag-' + nid; render();
    toast(`Alta registrada: ${nuevo.folio} · ${nuevo.nombre}`);
  }
}

function graficas() {
  charts.splice(0).forEach((c) => c.destroy());
  if (!window.Chart || S.vista !== 'inicio') return;
  const css = getComputedStyle(document.documentElement);
  const brand = css.getPropertyValue('--brand').trim(), signal = css.getPropertyValue('--signal').trim();
  const ink3 = css.getPropertyValue('--ink-3').trim(), line = css.getPropertyValue('--line').trim();
  Chart.defaults.font.family = '"Public Sans", system-ui, sans-serif';
  Chart.defaults.color = ink3;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const base = { responsive: true, maintainAspectRatio: false, animation: reduce ? false : { duration: 900, easing: 'easeOutQuart' } };
  const ejes = { x: { grid: { display: false } }, y: { grid: { color: line }, border: { display: false }, beginAtZero: true } };
  const mk = (id, cfg) => { const el = document.getElementById(id); if (el) charts.push(new Chart(el, cfg)); };

  const ink = css.getPropertyValue('--ink').trim();
  const activos = P.filter((p) => !p.baja);
  const grad = (c1, c2) => (ctx) => {
    const { chart } = ctx; const a = chart.chartArea; if (!a) return c1;
    const g = chart.ctx.createLinearGradient(0, a.bottom, 0, a.top); g.addColorStop(0, c2); g.addColorStop(1, c1); return g;
  };
  const tip = { backgroundColor: '#0c2742', padding: 10, cornerRadius: 10, titleFont: { weight: '700' }, boxPadding: 4, usePointStyle: true };
  const leyenda = { display: true, position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, padding: 14 } };

  // 1) Cuotas: barras con degradado contra la línea de lo esperado
  const esperado = activos.length * CUOTA;
  mk('chCuotas', { type: 'bar', data: { labels: MESES, datasets: [
      { type: 'bar', label: 'Recaudado', data: MESES.map((m, i) => PAGOS.filter((x) => x.mes === i).length * CUOTA), backgroundColor: grad('#2a7fc4', '#8fd9d6'), hoverBackgroundColor: '#1f6fae', borderRadius: 10, borderSkipped: false, maxBarThickness: 40, order: 2 },
      { type: 'line', label: 'Esperado', data: MESES.map(() => esperado), borderColor: signal, borderDash: [6, 5], borderWidth: 2, pointRadius: 0, pointHoverRadius: 0, order: 1 },
    ] },
    options: { ...base, interaction: { mode: 'index', intersect: false }, scales: { x: { grid: { display: false }, border: { display: false } }, y: { beginAtZero: true, grid: { color: line }, border: { display: false }, ticks: { callback: (v) => '$' + v.toLocaleString('es-MX'), maxTicksLimit: 5 } } },
      plugins: { legend: leyenda, tooltip: { ...tip, callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.parsed.y)}`, footer: (it) => { const r = it.find((x) => x.dataset.label === 'Recaudado'); return r ? `Cumplimiento: ${Math.round(r.parsed.y / esperado * 100)}%` : ''; } } } } } });

  // 2) Municipios: dona con el total al centro
  const muns = {}; activos.forEach((p) => { muns[p.mun] = (muns[p.mun] || 0) + 1; });
  const centro = { id: 'centro', afterDraw(chart) {
    const { ctx, chartArea: a } = chart; const x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = ink; ctx.font = '800 30px Archivo, "Arial Narrow", sans-serif'; ctx.fillText(String(activos.length), x, y - 6);
    ctx.fillStyle = ink3; ctx.font = '600 11px "Public Sans", sans-serif'; ctx.fillText('AGREMIADOS', x, y + 16); ctx.restore();
  } };
  const anchoMun = document.getElementById('chMun')?.parentElement.clientWidth || 400;
  mk('chMun', { type: 'doughnut', plugins: [centro], data: { labels: Object.keys(muns), datasets: [{ data: Object.values(muns), backgroundColor: ['#0f3b63', '#18a3a0', '#2a7fc4', '#ee8a2c', '#6fae3e', '#f2b632', '#3d5f8f'], borderWidth: 3, borderColor: '#ffffff', hoverOffset: 10, borderRadius: 6, spacing: 2 }] },
    options: { ...base, cutout: '68%', layout: { padding: 6 }, plugins: { legend: { ...leyenda, position: anchoMun > 460 ? 'right' : 'bottom', labels: { ...leyenda.labels, generateLabels: (ch) => ch.data.labels.map((l, i) => ({ text: `${l}  ${ch.data.datasets[0].data[i]}`, fillStyle: ch.data.datasets[0].backgroundColor[i], strokeStyle: 'transparent', pointStyle: 'circle', index: i, fontColor: ink3 })) } },
      tooltip: { ...tip, callbacks: { label: (c) => ` ${c.label}: ${c.parsed} (${Math.round(c.parsed / activos.length * 100)}%)` } } } } });

  // 3) Apoyos: columnas apiladas por mes y tipo
  const mesesAp = [...new Set(APOYOS.map((a) => a.fecha.slice(0, 7)))].sort().slice(-5);
  const NOM_MES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  const tiposAp = [...new Set(APOYOS.map((a) => a.tipo))];
  const colAp = ['#0f3b63', '#18a3a0', '#2a7fc4', '#ee8a2c', '#6fae3e', '#f2b632', '#3d5f8f'];
  mk('chApoyos', { type: 'bar', data: { labels: mesesAp.map((m) => NOM_MES[+m.slice(5, 7) - 1] + ' ' + m.slice(2, 4)),
      datasets: tiposAp.map((t, i) => ({ label: t, data: mesesAp.map((m) => APOYOS.filter((a) => a.tipo === t && a.fecha.startsWith(m)).reduce((s, a) => s + a.monto, 0)), backgroundColor: colAp[i % colAp.length], borderRadius: 6, borderSkipped: false, maxBarThickness: 42 })) },
    options: { ...base, interaction: { mode: 'index', intersect: false }, scales: { x: { stacked: true, grid: { display: false }, border: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: line }, border: { display: false }, ticks: { callback: (v) => '$' + v.toLocaleString('es-MX'), maxTicksLimit: 5 } } },
      plugins: { legend: leyenda, tooltip: { ...tip, filter: (it) => it.parsed.y > 0, callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.parsed.y)}`, footer: (it) => `Total del mes: ${money(it.reduce((s, x) => s + x.parsed.y, 0))}` } } } } });

  // 4) Tienda: ranking de lo más vendido, cada barra con el color del producto
  const top = [...PRODUCTOS].sort((a, b) => b.vendidos - a.vendidos).slice(0, 6);
  mk('chVentas', { type: 'bar', data: { labels: top.map((p) => p.nombre), datasets: [{ label: 'Unidades', data: top.map((p) => p.vendidos), backgroundColor: top.map((p) => p.color + 'd9'), hoverBackgroundColor: top.map((p) => p.color), borderRadius: 8, borderSkipped: false, barThickness: 18 }] },
    options: { ...base, indexAxis: 'y', scales: { x: { beginAtZero: true, grid: { color: line }, border: { display: false }, ticks: { maxTicksLimit: 5 } }, y: { grid: { display: false }, border: { display: false }, ticks: { color: ink, font: { weight: '600' } } } },
      plugins: { legend: { display: false }, tooltip: { ...tip, callbacks: { label: (c) => ` ${c.parsed.x} unidades · ${money(c.parsed.x * top[c.dataIndex].precio)}` } } } } });
}

    if (filas.length < 2) return;
    const est = S.colFiltros[key] || (S.colFiltros[key] = {});
    const cols = ths.map((th, i) => {
      const nombre = th.textContent.trim(); if (!nombre) return null;
      const distintos = [...new Set(filas.map((tr) => valorCelda(tr.children[i])).filter(Boolean))];
      if (!distintos.length) return null;
      const lista = distintos.length <= 6 && distintos.length < filas.length && distintos.every((v) => v.length < 40);
      return { nombre, tipo: lista ? 'sel' : 'txt', opciones: distintos.sort((a, b) => a.localeCompare(b, 'es')) };
    });
    const tf = document.createElement('tfoot');
    tf.innerHTML = '<tr>' + cols.map((c, i) => `<td>${!c ? '' : c.tipo === 'sel'
      ? `<select class="col-f ${est[i] ? 'on' : ''}" data-key="${key}" data-col="${i}" aria-label="Filtrar ${esc(c.nombre)}"><option value="">Todos</option>${c.opciones.map((o) => `<option ${est[i] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : `<input class="col-f ${est[i] ? 'on' : ''}" data-key="${key}" data-col="${i}" placeholder="Filtrar ${esc(c.nombre.toLowerCase())}" value="${esc(est[i] || '')}" aria-label="Filtrar ${esc(c.nombre)}" autocomplete="off">`}</td>`).join('') + '</tr>';
    tabla.appendChild(tf);
    tabla.dataset.key = key;
    tabla.dataset.tipos = JSON.stringify(cols.map((c) => (c ? c.tipo : '')));
    aplicarFiltro(tabla);
  });
}

function aplicarFiltro(tabla) {
  const key = tabla.dataset.key, est = S.colFiltros[key] || {}, tipos = JSON.parse(tabla.dataset.tipos || '[]');
  const nCols = tabla.querySelectorAll('thead th').length;
  tabla.querySelector('tr.sin-res')?.remove();
  const filas = [...tabla.querySelectorAll('tbody tr')];
  let visibles = 0;
  filas.forEach((tr) => {
    const ok = Object.entries(est).every(([i, v]) => {
      if (!v || !tr.children[i]) return true;
      const cv = norm(valorCelda(tr.children[i]));
      return tipos[i] === 'sel' ? cv === norm(v) : cv.includes(norm(v));
    });
    tr.hidden = !ok; if (ok) visibles++;
  });
  if (!visibles) tabla.tBodies[0].insertAdjacentHTML('beforeend', `<tr class="sin-res"><td colspan="${nCols}">Ningún registro coincide con los filtros. <button class="btn sm" data-limpiar="${key}">${ico('x')}Limpiar filtros</button></td></tr>`);
  const activos = Object.values(est).filter(Boolean).length;
  const head = tabla.closest('.panel')?.querySelector('.panel-h');
  if (head) {
    let b = head.querySelector('.fcount');
    if (!b) { b = document.createElement('button'); b.className = 'pill brand fcount'; b.style.border = '0'; b.style.cursor = 'pointer'; b.title = 'Quitar todos los filtros'; head.insertBefore(b, head.querySelector('.actions')); }
    b.hidden = !activos; b.dataset.limpiar = key;
    b.innerHTML = `${ico('filter')}${visibles} de ${filas.length} · ${activos} filtro${activos === 1 ? '' : 's'} ${ico('x')}`;
  }
  icons();
}

/* ======================= RENDER ======================= */
function render() {
  renderNav();
  const m = MODULOS.find((x) => x.id === S.vista) || { nombre: 'App del agremiado', ico: 'smartphone', desc: 'Lo que ve cada agremiado en su celular' };
  $('#view').innerHTML = `<div class="page-h"><div><h1>${ico(m.ico)}${m.nombre}</h1><p>${m.desc}</p></div>
    <p class="demo-note" style="margin-left:auto">${ico('flask-conical')}Prototipo con datos de ejemplo. Lo que hagas aquí se queda solo en esta pestaña.</p></div>` + V[S.vista]();
  icons();
  $('#view').classList.toggle('fija', VISTAS_FIJAS.includes(S.vista));
  filtrosTablas();
  document.querySelectorAll('[data-count]').forEach(contar);
  graficas();
  S.nuevo = null;
  guardarLocal();
}

/* ======================= EVENTOS ======================= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-ficha],[data-tog],[data-act],[data-ttab],[data-prod],[data-reab],[data-pago],[data-ftab],[data-atab],[data-add],[data-gps],[data-role],[data-editar],[data-pedirbaja],[data-confbaja],[data-cancelbaja],[data-reactivar],[data-editprod],[data-fin],[data-ubicar],[data-quitarfoto],[data-quitaradj],[data-perfil],[data-nivel],[data-delrol],[data-limpiar],[data-close]');
  if (!el) return;
  const d = el.dataset;
  if ('close' in d) { if (e.target === el || el.classList.contains('x')) $('#layer').innerHTML = ''; return; }
  if (d.editar) return formAgremiado(+d.editar);
  if (d.pedirbaja) return pedirBaja(+d.pedirbaja);
  if ('cancelbaja' in d) { $('#bajaBox').innerHTML = ''; return; }
  if (d.confbaja) {
    const p = per(+d.confbaja); const motivo = val('bajaMotivo') + (val('bajaDet') ? ' · ' + val('bajaDet') : '');
    p.baja = { ...stamp(), motivo }; p.mod = stamp();
    ACTIVIDADES_GPS.splice(0, ACTIVIDADES_GPS.length, ...ACTIVIDADES_GPS.filter((g) => g.pid !== p.id));
    log('agremiados', 'Dio de baja agremiado', `${p.folio} · ${p.nombre} · ${motivo}`);
    render(); ficha(p.id); toast(`${p.nombre} quedó dado de baja`); return;
  }
  if (d.reactivar) {
    const p = per(+d.reactivar); delete p.baja; p.mod = stamp();
    if (p.padre && per(p.padre)?.baja) p.padre = 1;
    log('agremiados', 'Reactivó agremiado', `${p.folio} · ${p.nombre}`); render(); ficha(p.id); toast('Agremiado reactivado'); return;
  }
  if (d.editprod) return formProducto(+d.editprod);
  if (d.fin) {
    const g = ACTIVIDADES_GPS.find((x) => x.pid === +d.fin);
    ACTIVIDADES_GPS.splice(ACTIVIDADES_GPS.indexOf(g), 1);
    log('ubicacion', 'Finalizó seguimiento GPS', `${g.actividad} · ${per(g.pid).nombre}`); toast('Seguimiento finalizado'); return render();
  }
  if ('ubicar' in d) {
    const hint = $('#ubicHint'); hint.textContent = 'Obteniendo ubicación…';
    try {
      navigator.geolocation.getCurrentPosition(
        (pos) => { $('#fLat').value = pos.coords.latitude.toFixed(5); $('#fLng').value = pos.coords.longitude.toFixed(5); hint.textContent = `Ubicación capturada (±${Math.round(pos.coords.accuracy)} m)`; },
        () => { hint.textContent = 'El navegador no dio la ubicación. Captúrala a mano.'; }, { timeout: 8000 });
    } catch (err) { hint.textContent = 'El navegador no dio la ubicación. Captúrala a mano.'; }
    return;
  }
  if (d.quitarfoto !== undefined) { S.tmp.fotos.splice(+d.quitarfoto, 1); return pintarMedia(); }
  if (d.quitaradj !== undefined) { S.tmp.adjuntos.splice(+d.quitaradj, 1); return pintarMedia(); }
  if (d.go) return go(d.go);
  if (d.ficha) return abrirFicha(+d.ficha);
  if (d.tog) { const id = +d.tog; S.abiertos.has(id) ? S.abiertos.delete(id) : S.abiertos.add(id); return render(); }
  if (d.ttab) { S.tabTienda = d.ttab; return render(); }
  if (d.prod) return abrirProducto(+d.prod);
  if (d.ftab) { S.tabFicha = d.ftab; return ficha(+d.pid); }
  if (d.atab) { S.appTab = d.atab; return render(); }
  if (d.role) return setRol(d.role);
  if (d.reab) { const p = PRODUCTOS.find((x) => x.id === +d.reab); const n = p.max - p.stock; p.stock = p.max; p.mod = stamp(); log('tienda', 'Registró entrada de inventario', `${p.nombre} +${n}`); S.nuevo = 'inv-' + p.id; toast(`Entrada registrada: ${p.nombre} +${n}`); return render(); }
  if (d.pago) {
    const p = per(+d.pago); const mes = MESES.length - p.adeudo; p.adeudo = Math.max(0, p.adeudo - 1);
    PAGOS.push({ pid: p.id, mes, ...stamp() }); p.mod = stamp();
    log('cuotas', 'Registró pago', `Cuota de ${MESES[mes]} · ${p.folio} · ${money(CUOTA)}`); S.nuevo = 'pago-' + p.id; toast(`Pago registrado para ${p.nombre}`); return render();
  }
  if (d.add) { S.carrito.push(+d.add); return render(); }
  if (d.gps) { const p = per(+d.gps); p.gps = !p.gps; p.gpsTraza = p.gps ? { u: p.id, f: ahora() } : null; log('ubicacion', p.gps ? 'Autorizó seguimiento GPS' : 'Revocó seguimiento GPS', `${p.folio} · desde la app`, p.id); toast(p.gps ? 'Seguimiento GPS autorizado' : 'Seguimiento GPS desactivado'); return render(); }
  if (d.act === 'expandir') { P.forEach((p) => S.abiertos.add(p.id)); return render(); }
  if (d.act === 'contraer') { S.abiertos = new Set([1]); return render(); }
  if (d.act === 'comprar') {
    const me = S.rol === 'agremiado' ? yo() : per(5);
    const total = S.carrito.reduce((s, id) => s + PRODUCTOS.find((p) => p.id === id).precio, 0);
    const resumen = [...new Set(S.carrito)].map((id) => `${PRODUCTOS.find((p) => p.id === id).nombre} × ${S.carrito.filter((x) => x === id).length}`).join(', ');
    S.carrito.forEach((id) => { const p = PRODUCTOS.find((x) => x.id === id); if (p.stock) p.stock--; p.vendidos++; p.mod = { u: me.id, f: ahora() }; });
    log('tienda', 'Compró en tienda', `${resumen} · ${money(total)} (desde la app)`, me.id);
    S.carrito = []; toast('Pedido confirmado. Ya aparece en la bitácora.'); return render();
  }
  if (d.act === 'nuevo-rol') return formPerfil();
  if (d.perfil) { S.perfilSel = d.perfil; return render(); }
  if (d.limpiar) { S.colFiltros[d.limpiar] = {}; return render(); }
  if (d.nivel) {
    const [r, m, k] = d.nivel.split('|');
    if (r === 'super') { toast('El Super usuario no se puede modificar.'); return; }
    if (!puede('perfiles', 't')) { toast('Solo un perfil con acceso total a Perfiles puede cambiar permisos.'); return; }
    const antes = PERMISOS[r][m]; if (antes === k) return;
    PERMISOS[r][m] = k; ROLES.find((x) => x.id === r).mod = stamp();
    log('perfiles', 'Modificó permisos', `${rolNombre(r)} · ${MODULOS.find((x) => x.id === m).nombre}: ${NIVELES[antes]} → ${NIVELES[k]}`);
    toast(`${MODULOS.find((x) => x.id === m).nombre}: ${NIVELES[k]}`); return render();
  }
  if (d.delrol) {
    const r = ROLES.find((x) => x.id === d.delrol); const n = P.filter((p) => p.rol === r.id && !p.baja).length;
    if (n) { toast(`No se puede eliminar: ${n} ${n === 1 ? 'usuario tiene' : 'usuarios tienen'} este perfil.`); return; }
    ROLES.splice(ROLES.indexOf(r), 1); delete PERMISOS[r.id]; S.perfilSel = 'secretario';
    log('perfiles', 'Eliminó perfil', r.nombre); renderRoles(); toast(`Perfil «${r.nombre}» eliminado`); return render();
  }
  if (d.act === 'nuevo-agremiado') return formAgremiado();
  if (d.act === 'nuevo-producto') return formProducto();
  if (d.act === 'nuevo-proveedor') return formProveedor();
  if (d.act === 'nuevo-curso') return formCurso();
  if (d.act === 'nueva-actividad') return formActividad();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'asRole') return setRol(t.value);
  if (t.id === 'filtroBit') { S.filtroBit = t.value; return render(); }
  if (t.id === 'reasignar') {
    const p = per(+t.dataset.pid), antes = per(p.padre), nuevo = per(+t.value); p.padre = nuevo.id; p.mod = stamp();
    log('red', 'Reasignó coordinador', `${p.folio} · ${antes.nombre} → ${nuevo.nombre}`); toast('Coordinador reasignado'); render(); return ficha(p.id);
  }
  if (t.dataset.img && t.files[0]) {
    const k = t.dataset.img, tile = t.closest('.tile');
    leerImagen(t.files[0]).then((url) => { S.tmp[k] = url; tile.classList.add('has'); tile.style.backgroundImage = `url('${url}')`; })
      .catch((err) => toast(err.message));
    return;
  }
  if (t.id === 'pFotosIn') {
    Promise.all([...t.files].slice(0, 6).map((f) => leerImagen(f).catch(() => null)))
      .then((urls) => { S.tmp.fotos.push(...urls.filter(Boolean)); S.tmp.fotos = S.tmp.fotos.slice(0, 6); pintarMedia(); t.value = ''; });
    return;
  }
  if (t.id === 'pAdjIn') {
    [...t.files].forEach((f) => S.tmp.adjuntos.push([f.type.startsWith('video/') ? 'video' : 'file-text', `${f.name} (${Math.max(1, Math.round(f.size / 1024))} KB)`]));
    t.value = ''; return pintarMedia();
  }
  if (t.id === 'pCat') return tipoProducto();
  if (t.id === 'apEvid') {
    const prev = $('#apPrev'); prev.innerHTML = '';
    [...t.files].slice(0, 8).forEach((f) => {
      if (f.type.startsWith('image/')) { const r = new FileReader(); r.onload = () => prev.insertAdjacentHTML('beforeend', `<img src="${r.result}" alt="Vista previa">`); r.readAsDataURL(f); }
      else { prev.insertAdjacentHTML('beforeend', `<span style="background:#ee8a2c">${ico('video')}</span>`); icons(); }
    });
  }
});
document.addEventListener('input', (e) => {
  if (e.target.classList?.contains('col-f')) { const t = e.target; (S.colFiltros[t.dataset.key] ||= {})[t.dataset.col] = t.value; t.classList.toggle('on', !!t.value); aplicarFiltro(t.closest('table')); return; }
  if (e.target.id === 'pCosto' || e.target.id === 'pPrecio') margenProducto();
  if (['fCurp', 'fIne', 'vRfc'].includes(e.target.id)) { const pos = e.target.selectionStart; e.target.value = e.target.value.toUpperCase(); e.target.setSelectionRange(pos, pos); }
  const box = e.target.closest?.('.field.invalid'); if (box) box.classList.remove('invalid');
  if (e.target.id === 'buscar') { S.buscar = e.target.value; const pos = e.target.selectionStart; render(); const b = $('#buscar'); b.focus(); b.setSelectionRange(pos, pos); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'formAgremiado') return guardarAgremiado(e.target);
  if (e.target.id === 'formProducto') return guardarProducto(e.target);
  if (e.target.id === 'formProveedor') return guardarProveedor();
  if (e.target.id === 'formCurso') return guardarCurso();
  if (e.target.id === 'formActividad') return guardarActividad();
  if (e.target.id === 'formPerfil') return guardarPerfil();
  if (e.target.id === 'formApoyo') {
    const pid = +$('#apPid').value, prev = [...$('#apPrev').children];
    const ev = prev.map((c) => (c.tagName === 'IMG' ? c.src : 'V'));
    const a = { id: Date.now(), pid, tipo: $('#apTipo').value, detalle: $('#apDet').value || $('#apTipo').value, monto: +$('#apMonto').value || 0, fecha: ahora(), por: yo().id, evid: ev.length ? ev : ['F'] };
    APOYOS.unshift(a);
    log('apoyos', 'Registró entrega de apoyo', `${a.tipo} a ${per(pid).folio} · ${a.evid.length} evidencia${a.evid.length === 1 ? '' : 's'}`);
    S.nuevo = 'apoyo'; toast('Entrega registrada con usuario, fecha y hora'); return render();
  }
  if (e.target.id === 'formInc') {
    const pid = +e.target.dataset.pid, txt = $('#incTxt').value.trim(); if (!txt) return;
    INCIDENCIAS.unshift({ pid, fecha: ahora(), por: yo().id, tipo: $('#incTipo').value, texto: txt });
    per(pid).mod = stamp();
    log('agremiados', 'Agregó incidencia', `${per(pid).folio} · ${$('#incTipo').value}`); toast('Incidencia guardada'); S.tabFicha = 'incidencias'; S.nuevo = 'inc'; ficha(pid); S.nuevo = null;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#layer').innerHTML = ''; });
function menu(abrir) { $('#side').classList.toggle('open', abrir); $('#sideBack').classList.toggle('open', abrir); $('#menuBtn').setAttribute('aria-expanded', String(abrir)); }
function mini(on) {
  document.querySelector('.shell').classList.toggle('mini', on);
  $('#menuBtn').setAttribute('aria-expanded', String(!on));
  try { localStorage.setItem('sigo-menu-mini', on ? '1' : ''); } catch (e) { /* sin almacenamiento */ }
  setTimeout(() => charts.forEach((c) => c.resize()), 340);
}
$('#menuBtn').addEventListener('click', () => {
  if (window.matchMedia('(max-width: 960px)').matches) return menu(!$('#side').classList.contains('open'));
  mini(!document.querySelector('.shell').classList.contains('mini'));
});
try { if (localStorage.getItem('sigo-menu-mini')) document.querySelector('.shell').classList.add('mini'); } catch (e) { /* sin almacenamiento */ }
$('#sideBack').addEventListener('click', () => menu(false));

function setRol(r) {
  S.rol = r; renderRoles();
  log('perfiles', 'Inició sesión (demo)', `Vista como ${rolNombre(r)}`, USUARIO_POR_ROL[r] || 1);
  toast(`Ahora ves el sistema como ${rolNombre(r)}`);
  if (r === 'agremiado') { S.appTab = 'inicio'; return go('app'); }
  go(nivel(S.vista) === 'n' || S.vista === 'app' ? 'inicio' : S.vista);
}

/* GPS simulado */
let tick = 0;
setInterval(() => {
  tick++;
  if (S.vista !== 'ubicacion') return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  ACTIVIDADES_GPS.forEach((g, i) => {
    if (!reduce) { g.x = Math.min(92, Math.max(8, g.x + Math.sin(tick + i) * 2.2)); g.y = Math.min(92, Math.max(12, g.y + Math.cos(tick * 1.3 + i) * 1.8)); }
    const pin = document.querySelector(`[data-pin="${g.pid}"]`); if (pin) { pin.style.left = g.x + '%'; pin.style.top = g.y + '%'; }
    const s = document.querySelector(`[data-senal="${g.pid}"]`); if (s) s.textContent = `hace ${(i * 2 + tick) % 5} s`;
  });
}, 3000);

/* Restablecer: borra lo capturado y vuelve a los datos de ejemplo (doble clic para confirmar) */
$('#resetBtn').addEventListener('click', () => {
  const b = $('#resetBtn');
  if (b.dataset.armed) {
    try { localStorage.removeItem(LS_KEY); } catch (e) { /* nada guardado */ }
    history.replaceState(null, '', '#inicio'); location.reload(); return;
  }
  b.dataset.armed = '1'; b.classList.add('danger'); b.querySelector('span').textContent = '¿Seguro? Clic otra vez';
  toast('Haz clic otra vez en «Restablecer» para borrar todo lo capturado.');
  setTimeout(() => { delete b.dataset.armed; b.classList.remove('danger'); b.querySelector('span').textContent = 'Restablecer'; }, 4000);
});

/* Arranque */
cargarLocal();
renderRoles();
const inicial = location.hash.slice(1);
go(MODULOS.some((m) => m.id === inicial) || inicial === 'app' ? inicial : 'inicio');
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.vista) go(h); });
</script>
